// -- POINTAGE JOURNALIER -----------------------------------
function PointagePage({data,setData,user}){
  const today=new Date().toISOString().split('T')[0];
  const pointage=data.pointage||[];
  const todayRecords=pointage.filter(p=>p.date===today);

  const pointer=(empId,type)=>{
    const existing=pointage.find(p=>p.emp_id===empId&&p.date===today&&p.type===type);
    if(existing){alert('Déjà pointé pour aujourd\'hui');return;}
    const record={id:'PT'+Date.now(),emp_id:empId,date:today,type,heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),enregistre_par:user.name};
    setData(d=>({...d,pointage:[record,...(d.pointage||[])]}));
  };

  const getStatus=(empId)=>{
    const entree=todayRecords.find(p=>p.emp_id===empId&&p.type==='entree');
    const sortie=todayRecords.find(p=>p.emp_id===empId&&p.type==='sortie');
    if(sortie)return{s:'Parti',c:'#8A99AA',bg:'#F0F2F5'};
    if(entree){
      const [h,m]=entree.heure.split(':').map(Number);
      const retard=h*60+m>8*60+15;
      return{s:retard?'Retard ⚠':'Présent',c:retard?'#9A5F00':'#0E7A4E',bg:retard?'#FDF3E3':'#E6F4EE',entree:entree.heure,retard};
    }
    return{s:'Absent',c:'#C02020',bg:'#FDECEC'};
  };

  const presents=data.employes.filter(e=>todayRecords.some(p=>p.emp_id===e.id&&p.type==='entree')).length;
  const absents=data.employes.length-presents;

  // Monthly summary
  const month=new Date().toISOString().slice(0,7);
  const monthRecords=pointage.filter(p=>p.date.startsWith(month));

  return html`<div>
    <h2 style=${{fontSize:18,fontWeight:700,marginBottom:4}}>Pointage journalier</h2>
    <p style=${{fontSize:11,color:'#8A99AA',marginBottom:14}}>${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>

    <div class="kg k3" style=${{marginBottom:14}}>
      <div class="kp" style=${{borderTopColor:'#0E7A4E'}}><div class="kl">Présents</div><div class="kv" style=${{color:'#0E7A4E'}}>${presents} / ${data.employes.length}</div></div>
      <div class="kp" style=${{borderTopColor:'#C02020'}}><div class="kl">Absents</div><div class="kv" style=${{color:'#C02020'}}>${absents}</div></div>
      <div class="kp" style=${{borderTopColor:'#9A5F00'}}><div class="kl">Retards ce mois</div><div class="kv" style=${{color:'#9A5F00'}}>${monthRecords.filter(p=>p.retard).length}</div></div>
    </div>

    <div class="ca" style=${{marginBottom:14}}>
      <div class="ch"><span class="ct">Pointage du jour — ${new Date().toLocaleDateString('fr-FR')}</span></div>
      <div class="tw"><table>
        <thead><tr><th>Employé</th><th>Poste</th><th>Statut</th><th>Entrée</th><th>Sortie</th><th>Actions</th></tr></thead>
        <tbody>${data.employes.map(emp=>{
          const st=getStatus(emp.id);
          const entree=todayRecords.find(p=>p.emp_id===emp.id&&p.type==='entree');
          const sortie=todayRecords.find(p=>p.emp_id===emp.id&&p.type==='sortie');
          return html`<tr key=${emp.id}>
            <td style=${{fontWeight:700}}>${emp.nom}</td>
            <td style=${{fontSize:11,color:'#4A5568'}}>${emp.poste}</td>
            <td><span class="tag" style=${{background:st.bg,color:st.c}}>${st.s}</span></td>
            <td style=${{fontFamily:'monospace',fontSize:12,color:'#0E7A4E'}}>${entree?.heure||'—'}</td>
            <td style=${{fontFamily:'monospace',fontSize:12,color:'#8A99AA'}}>${sortie?.heure||'—'}</td>
            <td><div style=${{display:'flex',gap:5}}>
              ${!entree&&html`<button class="btn bs bsm" onClick=${()=>pointer(emp.id,'entree')}>Entrée</button>`}
              ${entree&&!sortie&&html`<button class="btn bg bsm" onClick=${()=>pointer(emp.id,'sortie')}>Sortie</button>`}
              ${sortie&&html`<span style=${{fontSize:11,color:'#8A99AA'}}>Journée terminée</span>`}
            </div></td>
          </tr>`;
        })}</tbody>
      </table></div>
    </div>

    ${pointage.length>0&&html`<div class="ca">
      <div class="ch"><span class="ct">Historique récent</span></div>
      <div class="tw"><table>
        <thead><tr><th>Date</th><th>Employé</th><th>Type</th><th>Heure</th><th>Enregistré par</th></tr></thead>
        <tbody>${pointage.slice(0,20).map((p,i)=>{
          const emp=data.employes.find(e=>e.id===p.emp_id);
          return html`<tr key=${i}>
            <td style=${{fontSize:11,color:'#8A99AA'}}>${p.date}</td>
            <td style=${{fontWeight:600}}>${emp?.nom||'?'}</td>
            <td><span class=${`tag ${p.type==='entree'?'tok':'tna'}`}>${p.type==='entree'?'Entrée':'Sortie'}</span></td>
            <td style=${{fontFamily:'monospace'}}>${p.heure}</td>
            <td style=${{fontSize:11,color:'#8A99AA'}}>${p.enregistre_par}</td>
          </tr>`;
        })}</tbody>
      </table></div>
    </div>`}
  </div>`;
}

// -- RAPPELS CLIENTS ---------------------------------------
function RappelsPage({data,setData,user}){
  const[envois,setEnvois]=useState({});

  // Calculate next service date for each vehicle (every 10 000 km or 6 months)
  const rappels=data.vehicules.map(vh=>{
    const cl=data.clients.find(c=>c.id===vh.client_id);
    const lastOT=data.ots.filter(o=>o.vehicule_id===vh.id&&o.statut==='valide_ca').sort((a,b)=>new Date(b.created)-new Date(a.created))[0];
    const lastDate=lastOT?new Date(lastOT.created):new Date(vh.km<20000?'2024-01-01':'2023-10-01');
    const nextDate=new Date(lastDate);
    nextDate.setMonth(nextDate.getMonth()+6);
    const daysUntil=Math.round((nextDate-new Date())/1000/60/60/24);
    const nextKm=(Math.floor(vh.km/10000)+1)*10000;
    const urgency=daysUntil<=0?'overdue':daysUntil<=30?'soon':'ok';
    return{vh,cl,lastDate,nextDate,daysUntil,nextKm,urgency,lastOT};
  }).sort((a,b)=>a.daysUntil-b.daysUntil);

  const overdue=rappels.filter(r=>r.urgency==='overdue');
  const soon=rappels.filter(r=>r.urgency==='soon');
  const ok=rappels.filter(r=>r.urgency==='ok');

  const envoyerSMS=(r)=>{
    const msg=`Bonjour ${r.cl?.nom}, votre ${r.vh.marque} ${r.vh.modele} (${r.vh.immat}) est due pour entretien. Contactez Gan Motor Nabeul au +216 72 XXX XXX pour prendre RDV. Merci!`;
    setEnvois(e=>({...e,[r.vh.id]:{date:new Date().toLocaleDateString('fr-FR'),msg}}));
    setData(d=>({...d,audit:[{id:Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'rappel_sms',module:'CRM',detail:r.vh.immat+' - '+r.cl?.nom},...(d.audit||[])]}));
    alert('Relance envoyee pour '+r.cl?.nom);
  };

  const Section=({title,items,color,bg})=>items.length===0?null:html`<div style=${{marginBottom:14}}>
    <div class="st">${title} <span style=${{fontSize:11,fontWeight:400,color:'#8A99AA'}}>(${items.length})</span></div>
    ${items.map(r=>html`<div key=${r.vh.id} class="ca" style=${{marginBottom:8,padding:14,borderLeft:`3px solid ${color}`}}>
      <div style=${{display:'flex',alignItems:'center',gap:12}}>
        <div style=${{width:40,height:40,borderRadius:10,background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color,flexShrink:0}}>
          ${r.vh.modele.slice(0,2).toUpperCase()}
        </div>
        <div style=${{flex:1}}>
          <div style=${{fontSize:13,fontWeight:700}}>${r.vh.marque} ${r.vh.modele} - ${r.vh.immat}</div>

            <span style=${{color:'#8A99AA',marginLeft:8}}>Prochain entretien ≈ ${r.nextKm.toLocaleString('fr')} km</span>

        </div>
      </div>

  </div>`;

  return html`<div>
    <h2 style=${{fontSize:18,fontWeight:700,marginBottom:4}}>Rappels entretien clients</h2>
    <p style=${{fontSize:11,color:'#8A99AA',marginBottom:14}}>Détection automatique basée sur la dernière visite - Envoi SMS simulé</p>

    <div class="kg k3" style=${{marginBottom:14}}>
      <div class="kp" style=${{borderTopColor:'#C02020'}}><div class="kl">Dépassés</div><div class="kv" style=${{color:'#C02020'}}>${overdue.length}</div><div class="ks">À contacter d'urgence</div></div>
      <div class="kp" style=${{borderTopColor:'#9A5F00'}}><div class="kl">Dans 30 jours</div><div class="kv" style=${{color:'#9A5F00'}}>${soon.length}</div><div class="ks">Rappel recommandé</div></div>
      <div class="kp" style=${{borderTopColor:'#0E7A4E'}}><div class="kl">OK</div><div class="kv" style=${{color:'#0E7A4E'}}>${ok.length}</div><div class="ks">Pas urgent</div></div>
    </div>

    <${Section} title="Entretien dépassé" items=${overdue} color="#C02020" bg="#FDECEC"/>
    <${Section} title="Entretien dans 30 jours" items=${soon} color="#9A5F00" bg="#FDF3E3"/>
    <${Section} title="Entretien à venir" items=${ok} color="#0E7A4E" bg="#E6F4EE"/>
  </div>`;
}

function DevisRemiseBanner({clientId,accord,alertes,user,dvRemiseReq,setDvRemiseReq,clients,setData,setDvRemiseSent}){
  const cl=clients.find(c=>c.id==clientId);

  if(accord){
    return html`<div class="al ain" style=${{marginBottom:12,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <span style=${{flex:1}}>🤝 <strong>Accord B2B actif — ${cl?cl.nom:''}</strong> : remise MO <strong style=${{color:'#1255A0'}}>${accord.remise_mo||0}%</strong> · pièces <strong style=${{color:'#1255A0'}}>${accord.remise_p||0}%</strong> · délai ${accord.delai>0?accord.delai+'j':'Comptant'}</span>
      <span style=${{fontSize:10,color:'#1255A0',fontWeight:700}}>Appliqué automatiquement ✓</span>
    </div>`;
  }

  if(can(user,'ALL')) return null;

  const pendingDv=alertes.find(a=>a.type==='remise_devis'&&String(a.temp_client_id)===String(clientId)&&a.statut==='pending');
  const approvedDv=alertes.find(a=>a.type==='remise_devis'&&String(a.temp_client_id)===String(clientId)&&a.statut==='approved');

  const submitRemise=()=>{
    if(dvRemiseReq.pct_mo===0&&dvRemiseReq.pct_p===0){alert('Sélectionnez au moins une remise');return;}
    const nom=cl?cl.nom:'';
    setData(d=>({...d,
      alertes:[{
        id:'AL'+Date.now(),type:'remise_devis',statut:'pending',
        temp_client_id:clientId,client_nom:nom,
        remise_pct_mo:dvRemiseReq.pct_mo,remise_pct_p:dvRemiseReq.pct_p,
        motif:dvRemiseReq.motif,demande_par:user.name,
        demande_le:new Date().toISOString(),
        titre:'Demande remise devis — '+nom,
        msg:(dvRemiseReq.pct_mo?dvRemiseReq.pct_mo+'% MO ':'')+
            (dvRemiseReq.pct_p?dvRemiseReq.pct_p+'% pieces ':'')+
            '— '+user.name,
      },...(d.alertes||[])],
      audit:[{id:'AU'+Date.now(),ts:new Date().toISOString(),
        user:user.name,role:user.role,action:'demande_remise_devis',
        module:'Devis',detail:'Client '+nom+' MO:'+dvRemiseReq.pct_mo+'% P:'+dvRemiseReq.pct_p+'%',
      },...(d.audit||[])],
    }));
    setDvRemiseSent(true);
    alert('Demande envoyee au DG. Les remises seront appliquees apres approbation.');
  };

  return html`<div class="ca" style=${{marginBottom:12,border:'1.5px solid rgba(154,95,0,.25)',background:'rgba(253,243,227,.4)'}}>
    <div style=${{padding:'10px 14px',borderBottom:'1px solid rgba(154,95,0,.15)',display:'flex',alignItems:'center',gap:8}}>
      <span style=${{fontSize:14}}>🔒</span>
      <span style=${{fontSize:12,fontWeight:700,color:'#9A5F00',flex:1}}>Aucun accord remise pour ce client</span>
      ${approvedDv&&html`<span class="tag tok">✓ Approuvé DG</span>`}
      ${pendingDv&&!approvedDv&&html`<span class="tag twn">⏳ En attente DG</span>`}
    </div>
    <div style=${{padding:'10px 14px'}}>
      ${approvedDv&&html`<div class="al aok" style=${{marginBottom:8}}>
        ✓ DG a approuvé : <strong>${approvedDv.remise_pct_mo||0}% MO</strong> et <strong>${approvedDv.remise_pct_p||0}% pièces</strong> — appliquée sur ce devis.
      </div>`}
      ${pendingDv&&!approvedDv&&html`<div class="al awn">
        ⏳ Demande envoyée — <strong>${pendingDv.remise_pct_mo||0}% MO / ${pendingDv.remise_pct_p||0}% pièces</strong> — en attente DG.
      </div>`}
      ${!pendingDv&&!approvedDv&&html`<div>
        <div style=${{fontSize:11,color:'#4A5568',marginBottom:10}}>Aucun accord actif. Demandez une remise exceptionnelle au DG — elle sera appliquée après approbation.</div>
        <div class="g3" style=${{marginBottom:8}}>
          <div class="fi" style=${{marginBottom:0}}><label>Remise MO %</label>
            <select value=${dvRemiseReq.pct_mo} onChange=${e=>setDvRemiseReq(r=>({...r,pct_mo:+e.target.value}))}>
              ${[0,5,10,15,20,25,30].map(p=>html`<option key=${p} value=${p}>${p}%</option>`)}
            </select>
          </div>
          <div class="fi" style=${{marginBottom:0}}><label>Remise Pièces %</label>
            <select value=${dvRemiseReq.pct_p} onChange=${e=>setDvRemiseReq(r=>({...r,pct_p:+e.target.value}))}>
              ${[0,5,10,15,20,25,30].map(p=>html`<option key=${p} value=${p}>${p}%</option>`)}
            </select>
          </div>
          <div class="fi" style=${{marginBottom:0}}><label>Motif</label>
            <input value=${dvRemiseReq.motif} onInput=${e=>setDvRemiseReq(r=>({...r,motif:e.target.value}))} placeholder="Ex: fidélisation, sinistre..."/>
          </div>
        </div>
        <button class="btn" style=${{background:'#9A5F00',color:'#fff',width:'100%'}}
          disabled=${dvRemiseReq.pct_mo===0&&dvRemiseReq.pct_p===0}
          onClick=${submitRemise}>
          📤 Soumettre la demande de remise au DG
        </button>
      </div>`}
    </div>
  </div>`;
}

function DevisPage({data,setData,user}){
  const[tab,setTab]=useState('liste');
  const[sel,setSel]=useState(null);
  const[showNew,setShowNew]=useState(false);
  const[showForfaits,setShowForfaits]=useState(false);
  const cfg=data.config||{};

  // New devis form state
  const[form,setForm]=useState({
    client_id:'',vehicule_id:'',km:'',
    symptomes:'',
    lignes:[{id:1,type:'mo',description:'Main d\'oeuvre',qte:1,pu:cfg.tarif_mo||45,remise:0}],
    validite:15,notes:'',
  });

  const devis=data.devis||[];
  const clients=data.clients||[];
  const pieces=data.pieces||[];

  // Remise request state (for SAV without accord)
  const[dvRemiseReq,setDvRemiseReq]=useState({pct_mo:5,pct_p:0,motif:''});
  const[dvRemiseSent,setDvRemiseSent]=useState(false);

  // Helper: get active accord for currently selected client
  const getAccord=(cid)=>data.accords?.find(a=>a.client_id===parseInt(cid)&&a.actif)||null;
  const formAccord=form.client_id?getAccord(form.client_id):null;
  // SAV can edit remise only if there is an accord OR if they are DG/admin
  const canEditRemise=can(user,'ALL')||!!formAccord;

  // Apply accord remises to all lines
  const applyAccordToLines=(lignes,accord)=>lignes.map(l=>({
    ...l,
    remise:accord?(l.type==='mo'?+(accord.remise_mo||0):+(accord.remise_p||0)):0
  }));

  const sf=(k)=>(v)=>setForm(f=>({...f,[k]:typeof v==='string'?v:v.target.value}));
  const[showNewDvCl,setShowNewDvCl]=useState(false);
  const[showNewDvVh,setShowNewDvVh]=useState(false);
  const[newDvCl,setNewDvCl]=useState({nom:'',tel:'',adresse:'',type:'particulier'});
  const[newDvVh,setNewDvVh]=useState({marque:'BYD',modele:'',immat:'',annee:new Date().getFullYear(),vin:''});

  const createDvClient=()=>{
    if(!newDvCl.nom){alert('Nom requis');return;}
    const id=Date.now();
    setData(d=>({...d,clients:[{id,nom:newDvCl.nom,tel:newDvCl.tel,adresse:newDvCl.adresse,type:newDvCl.type},...d.clients]}));
    setForm(f=>({...f,client_id:id,vehicule_id:''}));
    setNewDvCl({nom:'',tel:'',adresse:'',type:'particulier'});
    setShowNewDvCl(false);
  };

  const createDvVehicule=()=>{
    if(!newDvVh.modele||!newDvVh.immat){alert('Modèle et immatriculation requis');return;}
    const id='VH'+Date.now();
    setData(d=>({...d,vehicules:[{id,client_id:parseInt(form.client_id),marque:newDvVh.marque,modele:newDvVh.modele,immat:newDvVh.immat,annee:parseInt(newDvVh.annee)},...d.vehicules]}));
    setForm(f=>({...f,vehicule_id:id}));
    setNewDvVh({marque:'BYD',modele:'',immat:'',annee:new Date().getFullYear()});
    setShowNewDvVh(false);
  };

  const addLigne=(type)=>{
    const accord=getAccord(form.client_id);
    const rMo=accord?+(accord.remise_mo||0):0;
    const rP=accord?+(accord.remise_p||0):0;
    const id=Date.now();
    const ligne=type==='mo'
      ?{id,type:'mo',description:'Main d\'oeuvre',qte:1,pu:cfg.tarif_mo||45,remise:rMo}
      :type==='piece'
      ?{id,type:'piece',description:'',piece_ref:'',qte:1,pu:0,remise:rP}
      :{id,type:'forfait',description:'Forfait',qte:1,pu:0,remise:rP};
    setForm(f=>({...f,lignes:[...f.lignes,ligne]}));
  };

  const updateLigne=(id,k,v)=>setForm(f=>({...f,
    lignes:f.lignes.map(l=>{
      if(l.id!==id)return l;
      const updated={...l,[k]:v};
      if(k==='piece_ref'){
        const p=pieces.find(x=>x.ref===v);
        if(p)updated.description=p.nom,updated.pu=p.pv;
      }
      return updated;
    })
  }));

  const removeLigne=(id)=>setForm(f=>({...f,lignes:f.lignes.filter(l=>l.id!==id)}));

  const calcLigne=(l)=>{
    const brut=+(l.qte*l.pu).toFixed(3);
    const remise_amt=+(brut*(l.remise||0)/100).toFixed(3);
    return{brut,remise_amt,net:+(brut-remise_amt).toFixed(3)};
  };

  const calcTotal=(lignes)=>{
    const ht=+lignes.reduce((a,l)=>a+calcLigne(l).net,0).toFixed(3);
    const tva=+(ht*0.19).toFixed(3);
    return{ht,tva,timbre:TIMBRE_FISCAL,ttc:+(ht+tva+TIMBRE_FISCAL).toFixed(3)};
  };

  const totaux=calcTotal(form.lignes);

  const creerDevis=()=>{
    if(!form.client_id){alert('Client requis');return;}
    if(form.lignes.length===0){alert('Ajoutez au moins une ligne');return;}
    const num='DEV-'+Date.now();
    const expiration=new Date();
    expiration.setDate(expiration.getDate()+parseInt(form.validite||15));
    const d={
      id:num,client_id:parseInt(form.client_id),vehicule_id:form.vehicule_id||null,
      km:form.km?parseInt(form.km):null,
      symptomes:form.symptomes,lignes:form.lignes,notes:form.notes,
      date:new Date().toISOString().split('T')[0],
      expiration:expiration.toISOString().split('T')[0],
      statut:'en_attente',createur:user.name,
      ht:calcTotal(form.lignes).ht,tva:calcTotal(form.lignes).tva,ttc:calcTotal(form.lignes).ttc,
    };
    setData(x=>({...x,devis:[d,...(x.devis||[])]}));
    setForm({client_id:'',vehicule_id:'',km:'',symptomes:'',lignes:[{id:1,type:'mo',description:'Main d\'oeuvre',qte:1,pu:cfg.tarif_mo||45,remise:0}],validite:15,notes:''});
    setShowNew(false);setSel(num);setTab('liste');
    alert('✓ Devis '+num+' créé');
  };

  const accepter=(id)=>{
    const dv=devis.find(d=>d.id===id);
    // If devis was created from an OT, just mark accepted — don't create new OR+OT
    if(dv.ot_id){
      setData(d=>({...d,
        devis:d.devis.map(x=>x.id===id?{...x,statut:'accepte',accepte_le:new Date().toISOString()}:x),
        audit:[{id:'AU'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'acceptation_devis',module:'Devis',detail:id+' lie OT '+dv.ot_id},...(d.audit||[])],
      }));

      setSel(null);return;
    }
    // Convert to OR+OT

      id:'t'+(i+1),lib:l.description+(l.piece_ref?' ('+l.piece_ref+')':''),

    const ot={id:otId,or_id:orId,client_id:dv.client_id,vehicule_id:dv.vehicule_id,tech_id:null,bay:null,statut:'en_cours',created:new Date().toISOString(),taches,mo_h:moLigne?.qte||1,mo_tarif:moLigne?.pu||45,remise_mo:moLigne?.remise||0,remise_pieces:0,decouverte:null,valide_par:null,facture_id:null};
    setData(d=>({...d,
      devis:d.devis.map(x=>x.id===id?{...x,statut:'accepte',or_id:orId,ot_id:otId,accepte_le:new Date().toISOString()}:x),
      ors:[or,...(d.ors||[])],
      ots:[ot,...(d.ots||[])],
    }));
    alert('Devis accepte. '+orId+' et '+otId+' crees. Allez dans OTs pour assigner un technicien.');
    setSel(null);
  };

  const refuser=(id)=>{
    setData(d=>({...d,devis:d.devis.map(x=>x.id===id?{...x,statut:'refuse',refuse_le:new Date().toISOString()}:x)}));
    setSel(null);
  };

  const dupliquer=(dv)=>{
    setForm({client_id:dv.client_id,vehicule_id:dv.vehicule_id||'',km:'',symptomes:dv.symptomes||'',

      <tbody>
        ${devis.map(dv=>{
          const cl=clients.find(c=>c.id===dv.client_id);

          return html`<tr key=${dv.id} style=${{cursor:'pointer'}} onClick=${()=>setSel(dv.id)}>

function AssurancePage({data,setData,user}){
  const[tab,setTab]=useState('tous');
  const[sel,setSel]=useState(null);
  const[showNew,setShowNew]=useState(false);
  // ── Action form states (used in detail view) ─────────────
  const[expForm,setExpForm]=useState({nom:'',tel:'',date:''});
  const[pecForm,setPecForm]=useState({pec:'',franchise:'',estime:''});
  const[orLinkId,setOrLinkId]=useState('');
  const[form,setForm]=useState({
    compagnie:'',num_sinistre:'',num_police:'',
    type_sinistre:'accident',
    client_id:'',vehicule_id:'',or_id:'',
    date_sinistre:new Date().toISOString().split('T')[0],
    date_declaration:new Date().toISOString().split('T')[0],
    expert_nom:'',expert_tel:'',date_expertise:'',
    montant_estime:'',montant_pec:'',franchise:'',
    notes:'',
  });

  const assurances=data.assurances||[];
  const clients=data.clients||[];
  const isDG=can(user,'ALL');
  const isCompta=user.role==='compta';

  // ── KPIs — computed here so they are available everywhere ─
  const enCours=assurances.filter(a=>!['clos','refuse'].includes(a.statut));
  const montantPECTotal=assurances.filter(a=>['pec_recu','en_reparation','facture','clos'].includes(a.statut)).reduce((acc,a)=>acc+(a.montant_pec||0),0);
  const franchisesTotal=assurances.reduce((acc,a)=>acc+(a.franchise||0),0);

  const COMPAGNIES=['STAR Assurances','GAT Assurances','Lloyd\'s','AMI Assurances','CARTE','Maghrebia','COMAR','Autre'];
  const TYPES={accident:'Accident',bris_glace:'Bris de glace',vol:'Vol / Vandalisme',incendie:'Incendie',autre:'Autre'};
  const STATUTS={
    declaration:{c:'#9A5F00',bg:'#FDF3E3',l:'Déclarée'},
    expertise:{c:'#1255A0',bg:'#EAF1FD',l:'Expertise planifiée'},
    attente_pec:{c:'#5B4FC9',bg:'#F0EEFF',l:'Attente PEC'},
    pec_recu:{c:'#0E7A4E',bg:'#E6F4EE',l:'PEC reçu'},
    en_reparation:{c:'#00AAD2',bg:'#E0F7FF',l:'En réparation'},
    facture:{c:'#002C5F',bg:'#E8EDF5',l:'Facturé assurance'},
    clos:{c:'#0E7A4E',bg:'#E6F4EE',l:'Dossier clos'},
    refuse:{c:'#C02020',bg:'#FDECEC',l:'Refusé'},
  };

  const creer=()=>{
    if(!form.compagnie||!form.num_sinistre||!form.client_id){
      alert('Compagnie, N° sinistre et client requis');return;
    }
    const a={
      id:'ASS-'+Date.now(),
      ...form,
      client_id:parseInt(form.client_id),
      montant_estime:parseFloat(form.montant_estime)||0,
      montant_pec:parseFloat(form.montant_pec)||0,
      franchise:parseFloat(form.franchise)||0,
      statut:'declaration',
      date_creation:new Date().toISOString(),
      cree_par:user.name,
      historique:[{date:new Date().toISOString(),action:'Dossier créé',par:user.name}],
    };
    setData(d=>({...d,
      assurances:[a,...(d.assurances||[])],
      audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'creation_dossier_assurance',module:'Assurances',detail:a.id+' - '+form.compagnie+' - '+form.num_sinistre},...(d.audit||[])]
    }));
    setShowNew(false);
    setForm({compagnie:'',num_sinistre:'',num_police:'',type_sinistre:'accident',client_id:'',vehicule_id:'',or_id:'',date_sinistre:new Date().toISOString().split('T')[0],date_declaration:new Date().toISOString().split('T')[0],expert_nom:'',expert_tel:'',date_expertise:'',montant_estime:'',montant_pec:'',franchise:'',notes:''});
    setSel(a.id);setTab('tous');
    alert('Dossier '+a.id+' créé');
  };

  const changerStatut=(id,newStatut,extra={})=>{
    setData(d=>({...d,assurances:d.assurances.map(a=>{
      if(a.id!==id)return a;
      const hist=[...a.historique,{date:new Date().toISOString(),action:'Statut → '+STATUTS[newStatut]?.l,par:user.name,...(extra.note?{note:extra.note}:{})}];
      return{...a,statut:newStatut,...extra,historique:hist};
    })}));
  };

  const updateField=(id,fields)=>{
    setData(d=>({...d,assurances:d.assurances.map(a=>a.id===id?{...a,...fields,historique:[...a.historique,{date:new Date().toISOString(),action:'Mise à jour dossier',par:user.name}]}:a)}));
  };

  // Detail view
  const asel=sel?assurances.find(a=>a.id===sel):null;

    const cl=clients.find(c=>c.id===asel.client_id);
    const vh=data.vehicules?.find(v=>v.id===asel.vehicule_id);

    return html`<div>
      <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <button class="btn bg" onClick=${()=>setSel(null)}>← Retour</button>
        <span style=${{flex:1,fontSize:16,fontWeight:700}}>${asel.id}</span>
        <span class="tag" style=${{background:cs.bg,color:cs.c,fontSize:12,padding:'4px 12px'}}>${cs.l}</span>
      </div>

      <!-- Header dossier -->
      <div class="ca" style=${{marginBottom:12}}>
        <div style=${{background:'linear-gradient(135deg,#002C5F,#003d80)',padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style=${{fontSize:9,fontWeight:700,color:'#00AAD2',letterSpacing:'.12em',textTransform:'uppercase',marginBottom:4}}>DOSSIER SINISTRE</div>
            <div style=${{fontSize:16,fontWeight:700,color:'#fff'}}>${asel.compagnie}</div>
            <div style=${{fontSize:11,color:'rgba(255,255,255,.5)',marginTop:2}}>N° Sinistre : ${asel.num_sinistre}${asel.num_police?' — Police : '+asel.num_police:''}</div>
          </div>
          <div style=${{textAlign:'right'}}>
            <div style=${{fontSize:14,fontWeight:700,color:'#00AAD2'}}>${asel.id}</div>
            <div style=${{fontSize:10,color:'rgba(255,255,255,.4)',marginTop:3}}>Créé le ${asel.date_creation?new Date(asel.date_creation).toLocaleDateString('fr-FR'):'—'}</div>
          </div>
        </div>

        <!-- Info grid -->
        <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:0,borderBottom:'1px solid rgba(0,44,95,.08)'}}>
          ${[
            ['Client',cl?.nom||'—'],
            ['Véhicule',vh?(vh.marque+' '+vh.modele+' — '+vh.immat):'—'],
            ['Type sinistre',TYPES[asel.type_sinistre]||asel.type_sinistre],
            ['Date sinistre',asel.date_sinistre?new Date(asel.date_sinistre).toLocaleDateString('fr-FR'):'—'],
            ['Date déclaration',asel.date_declaration?new Date(asel.date_declaration).toLocaleDateString('fr-FR'):'—'],
            ['OR lié',asel.or_id||'Non lié'],
          ].map(([l,v])=>html`<div key=${l} style=${{padding:'10px 16px',borderRight:'1px solid rgba(0,44,95,.06)',borderBottom:'1px solid rgba(0,44,95,.06)'}}>

        </div>

        <!-- Montants -->
        <div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:0,borderBottom:'1px solid rgba(0,44,95,.08)'}}>

            <div style=${{fontSize:16,fontWeight:700,color:c}}>${parseFloat(v||0).toFixed(3)} DT</div>
          </div>`)}
        </div>

        <!-- Expert -->
        ${(asel.expert_nom||asel.date_expertise)&&html`<div style=${{padding:'10px 16px',background:'#F7F9FC',borderBottom:'1px solid rgba(0,44,95,.06)',display:'flex',gap:20}}>
          ${asel.expert_nom&&html`<div><div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',marginBottom:2}}>Expert</div><div style=${{fontSize:12,fontWeight:600}}>${asel.expert_nom}${asel.expert_tel?' — '+asel.expert_tel:''}</div></div>`}

        ${asel.notes&&html`<div style=${{padding:'10px 16px',borderBottom:'1px solid rgba(0,44,95,.06)',fontSize:12,color:'#4A5568'}}><strong>Notes : </strong>${asel.notes}</div>`}

        <!-- ACTIONS selon statut -->

                    <button class="btn bg bsm" onClick=${()=>{setSel(null);alert('Allez dans "Ordres de Réparation" pour créer un OR lié à ce dossier sinistre ('+asel.id+')');}}>📄 Créer OR</button>
                  </div>
                </div>
              </div>`}

            ${asel.statut==='en_reparation'&&html`
              <button class="btn bs bsm" onClick=${()=>{changerStatut(asel.id,'facture');alert('Marquer comme facturé — générez la facture dans le module Facturation');}}>Marquer facturé assurance →</button>`}

            ${asel.statut==='facture'&&html`
              <button class="btn bs bsm" onClick=${()=>{if(confirm('Clore ce dossier ?'))changerStatut(asel.id,'clos');}}>Clore le dossier ✓</button>`}

            ${asel.statut!=='clos'&&asel.statut!=='refuse'&&html`
              <button class="btn bd bsm" style=${{marginLeft:'auto'}} onClick=${()=>{if(confirm('Marquer ce dossier comme refusé ?'))changerStatut(asel.id,'refuse');}}>Refusé par assurance</button>`}
          </div>
        </div>
      </div>

      <!-- Historique -->
      <div class="ca">
        <div class="ch"><span class="ct">Historique du dossier</span></div>
        <div style=${{padding:'8px 16px'}}>
          ${[...asel.historique].reverse().map((h,i)=>html`<div key=${i} style=${{display:'flex',gap:12,padding:'7px 0',borderBottom:'1px solid rgba(0,44,95,.05)'}}>
            <div style=${{fontSize:11,color:'#8A99AA',flexShrink:0,minWidth:120}}>${new Date(h.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
            <div style=${{flex:1}}>
              <div style=${{fontSize:12,fontWeight:600}}>${h.action}</div>
              ${h.note&&html`<div style=${{fontSize:11,color:'#4A5568'}}>${h.note}</div>`}
            </div>
            <div style=${{fontSize:11,color:'#8A99AA'}}>${h.par}</div>
          </div>`)}
        </div>
      </div>
    </div>`;
  }

  // LIST VIEW
  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div><h2 style=${{fontSize:18,fontWeight:700}}>Gestion Assurances</h2><p style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>${assurances.length} dossiers — ${enCours.length} en cours</p></div>
      <button class="btn bp" onClick=${()=>setShowNew(true)}>+ Nouveau dossier sinistre</button>
    </div>

    <!-- KPIs -->
    <div class="kg k4" style=${{marginBottom:14}}>
      <div class="kp" style=${{borderTopColor:'#9A5F00'}}><div class="kl">Dossiers en cours</div><div class="kv" style=${{color:'#9A5F00'}}>${enCours.length}</div></div>
      <div class="kp" style=${{borderTopColor:'#5B4FC9'}}><div class="kl">En attente PEC</div><div class="kv" style=${{color:'#5B4FC9'}}>${assurances.filter(a=>a.statut==='attente_pec').length}</div></div>
      <div class="kp" style=${{borderTopColor:'#0E7A4E'}}><div class="kl">Montant PEC total</div><div class="kv" style=${{color:'#0E7A4E',fontSize:14}}>${montantPECTotal.toFixed(3)} DT</div></div>
      <div class="kp" style=${{borderTopColor:'#C02020'}}><div class="kl">Franchises client</div><div class="kv" style=${{color:'#C02020',fontSize:14}}>${franchisesTotal.toFixed(3)} DT</div></div>
    </div>

    <!-- Nouveau dossier -->
    ${showNew&&html`<div class="ca" style=${{marginBottom:14,border:'2px solid #5B4FC9',padding:16}}>
      <div style=${{fontSize:14,fontWeight:700,color:'#5B4FC9',marginBottom:14}}>Nouveau dossier sinistre</div>
      <div class="g2">
        <div class="fi"><label>Compagnie d'assurance *</label>
          <select value=${form.compagnie} onChange=${e=>setForm({...form,compagnie:e.target.value})}>
            <option value="">Sélectionner...</option>
            ${COMPAGNIES.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}
          </select>
        </div>
        <div class="fi"><label>N° de sinistre *</label><input value=${form.num_sinistre} onInput=${e=>setForm({...form,num_sinistre:e.target.value})} placeholder="SIN-2026-XXXXX"/></div>
        <div class="fi"><label>N° de police / contrat</label><input value=${form.num_police} onInput=${e=>setForm({...form,num_police:e.target.value})} placeholder="POL-XXXXXX"/></div>
        <div class="fi"><label>Type de sinistre</label>
          <select value=${form.type_sinistre} onChange=${e=>setForm({...form,type_sinistre:e.target.value})}>
            ${Object.entries(TYPES).map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Client *</label>
          <select value=${form.client_id} onChange=${e=>setForm({...form,client_id:e.target.value,vehicule_id:'',or_id:''})}>
            <option value="">Sélectionner...</option>
            ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.nom}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Véhicule</label>
          <select value=${form.vehicule_id} onChange=${e=>setForm({...form,vehicule_id:e.target.value})} disabled=${!form.client_id}>
            <option value="">Sélectionner...</option>
            ${(data.vehicules||[]).filter(v=>v.client_id===parseInt(form.client_id)).map(v=>html`<option key=${v.id} value=${v.id}>${v.marque} ${v.modele} — ${v.immat}</option>`)}
          </select>
        </div>
        <div class="fi"><label>OR / Intervention liée</label>
          <select value=${form.or_id} onChange=${e=>setForm({...form,or_id:e.target.value})} disabled=${!form.client_id}>
            <option value="">Sélectionner (optionnel)...</option>
            ${(data.ors||[]).filter(o=>o.client_id===parseInt(form.client_id)).map(o=>html`<option key=${o.id} value=${o.id}>${o.id} — ${new Date(o.date).toLocaleDateString('fr-FR')}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Date du sinistre</label><input type="date" value=${form.date_sinistre} onInput=${e=>setForm({...form,date_sinistre:e.target.value})}/></div>
        <div class="fi"><label>Date de déclaration</label><input type="date" value=${form.date_declaration} onInput=${e=>setForm({...form,date_declaration:e.target.value})}/></div>
        <div class="fi"><label>Montant estimé (DT)</label><input type="number" step="0.001" value=${form.montant_estime} onInput=${e=>setForm({...form,montant_estime:e.target.value})} placeholder="0.000"/></div>
        <div class="fi"><label>Expert désigné</label><input value=${form.expert_nom} onInput=${e=>setForm({...form,expert_nom:e.target.value})} placeholder="Nom de l'expert..."/></div>
        <div class="fi"><label>Tél expert</label><input value=${form.expert_tel} onInput=${e=>setForm({...form,expert_tel:e.target.value})} placeholder="+216 XX XXX XXX"/></div>
      </div>
      <div class="fi"><label>Notes / Circonstances</label><textarea rows="2" value=${form.notes} onInput=${e=>setForm({...form,notes:e.target.value})} placeholder="Description de l'accident, circonstances, tiers impliqués..."/></div>
      <div class="al ain" style=${{marginBottom:10}}>Les travaux ne peuvent commencer qu'après réception de la Prise En Charge (PEC) écrite de l'assurance.</div>
      <div style=${{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button class="btn bg" onClick=${()=>setShowNew(false)}>Annuler</button>
        <button class="btn bp" style=${{background:'#5B4FC9'}} onClick=${creer}>Créer le dossier →</button>
      </div>
    </div>`}

    <!-- Tabs par statut -->
    <div class="tb">${[['tous','Tous ('+assurances.length+')'],['en_cours','En cours ('+enCours.length+')'],['attente_pec','Attente PEC ('+assurances.filter(a=>a.statut==='attente_pec').length+')'],['clos','Clos']].map(([id,l])=>html`
      <button key=${id} class=${`tbn${tab===id?' ac':''}`} onClick=${()=>setTab(id)}>${l}</button>`)}</div>

    <!-- LISTE -->
    ${(tab==='tous'?assurances:tab==='en_cours'?enCours:tab==='attente_pec'?assurances.filter(a=>a.statut==='attente_pec'):assurances.filter(a=>a.statut==='clos')).map(a=>{
      const cl=clients.find(c=>c.id===a.client_id);
      const vh=data.vehicules?.find(v=>v.id===a.vehicule_id);
      const cs=STATUTS[a.statut]||STATUTS.declaration;
      const partClient=Math.max(0,a.montant_pec>0?a.montant_estime-a.montant_pec+a.franchise:a.montant_estime);
      const hasEcart=a.statut==='facture'&&a.montant_pec>0&&a.montant_estime>0&&Math.abs(a.montant_estime-a.montant_pec-a.franchise)>1;
      return html`<div key=${a.id} class="ca" style=${{marginBottom:8,padding:14,cursor:'pointer',borderLeft:'3px solid '+cs.c}} onClick=${()=>{setSel(a.id);setExpForm({nom:'',tel:'',date:''});setPecForm({pec:'',franchise:'',estime:''});setOrLinkId('');}}>
        <div style=${{display:'flex',alignItems:'flex-start',gap:12}}>
          <div style=${{width:40,height:40,borderRadius:10,background:cs.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,color:cs.c,flexShrink:0}}>ASS</div>
          <div style=${{flex:1}}>
            <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
              <span style=${{fontSize:11,fontFamily:'monospace',fontWeight:700,color:'#002C5F'}}>${a.id}</span>
              <span style=${{fontSize:11,fontWeight:700}}>${a.compagnie}</span>
              <span style=${{fontSize:10,padding:'1px 7px',borderRadius:20,background:'#F0F2F5',color:'#4A5568'}}>${TYPES[a.type_sinistre]||a.type_sinistre}</span>
            </div>
            <div style=${{fontSize:13,fontWeight:700}}>${cl?.nom||'—'} ${vh?'— '+vh.marque+' '+vh.modele+' ('+vh.immat+')':''}</div>
            <div style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>N° Sinistre: ${a.num_sinistre} — Déclaré le ${a.date_declaration?new Date(a.date_declaration).toLocaleDateString('fr-FR'):'—'}</div>
          </div>
          <div style=${{textAlign:'right',flexShrink:0}}>
            <span class="tag" style=${{background:cs.bg,color:cs.c}}>${cs.l}</span>
            ${hasEcart&&html`<span class="tag ter" style=${{fontSize:9,marginLeft:4}}>Ecart reçu</span>`}
            ${a.montant_pec>0&&html`<div style=${{fontSize:11,color:'#0E7A4E',fontWeight:700,marginTop:4}}>PEC: ${a.montant_pec.toFixed(3)} DT</div>`}
            ${partClient>0&&html`<div style=${{fontSize:11,color:'#C02020',marginTop:2}}>Client: ${partClient.toFixed(3)} DT</div>`}
          </div>
        </div>
      </div>`;
    })}
    ${assurances.length===0&&html`<div class="ca"><div class="em"><div style=${{fontSize:36,marginBottom:12}}>🏥</div><p>Aucun dossier sinistre — cliquez "+ Nouveau dossier sinistre"</p></div></div>`}
  </div>`;
}

// -- IMPAYES PAGE ------------------------------------------
function ImpayesPage({data,setData,user}){
  const[sel,setSel]=useState(null);
  const[filterAge,setFilterAge]=useState('all');
  const[relanceNote,setRelanceNote]=useState('');

  const factures=data.factures||[];
  const clients=data.clients||[];
  const now=new Date();

  // All unpaid invoices enriched
  const impayes=factures
    .filter(f=>f.statut==='en_attente'&&f.type!=='avoir')
    .map(f=>{
      const cl=clients.find(c=>c.id===f.client_id);
      const joursDue=Math.floor((now-new Date(f.date))/1000/60/60/24);
      const relances=data.relances?.filter(r=>r.facture_id===f.id)||[];
      const lastRelance=relances.sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      const joursDerniereRelance=lastRelance?Math.floor((now-new Date(lastRelance.date))/1000/60/60/24):null;
      return{...f,cl,joursDue,relances,lastRelance,joursDerniereRelance};
    })
    .sort((a,b)=>b.joursDue-a.joursDue);

  // Filter
  const filtered=impayes.filter(f=>{
    if(filterAge==='0_30') return f.joursDue<=30;
    if(filterAge==='30_60') return f.joursDue>30&&f.joursDue<=60;
    if(filterAge==='60_90') return f.joursDue>60&&f.joursDue<=90;
    if(filterAge==='90plus') return f.joursDue>90;
    return true;
  });

  // KPIs
  const total=impayes.reduce((a,f)=>a+f.ttc,0);
  const buckets=[
    {l:'0-30 jours',min:0,max:30,c:'#9A5F00'},
    {l:'31-60 jours',min:31,max:60,c:'#C06A00'},
    {l:'61-90 jours',min:61,max:90,c:'#C02020'},
    {l:'+90 jours',min:91,max:9999,c:'#8A0000'},
  ].map(b=>({...b,
    count:impayes.filter(f=>f.joursDue>=b.min&&f.joursDue<=b.max).length,
    montant:impayes.filter(f=>f.joursDue>=b.min&&f.joursDue<=b.max).reduce((a,f)=>a+f.ttc,0)
  }));

  const enregistrerRelance=(facId,type,msg)=>{
    const r={id:'REL-'+Date.now(),facture_id:facId,type,message:msg,date:new Date().toISOString(),par:user.name};
    setData(d=>({...d,
      relances:[r,...(d.relances||[])],
      audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'relance_impayes',module:'Impayes',detail:facId+' - '+type},...(d.audit||[])]
    }));
    setRelanceNote('');setSel(null);
    alert('Relance enregistrée pour '+facId);
  };

  const getAgeBadge=(jours)=>{
    if(jours<=30) return{bg:'#FDF3E3',c:'#9A5F00',l:jours+'j'};
    if(jours<=60) return{bg:'#FDECEC',c:'#C02020',l:jours+'j'};
    if(jours<=90) return{bg:'#FDECEC',c:'#C02020',l:jours+'j ⚠'};
    return{bg:'#F7C1C1',c:'#8A0000',l:jours+'j ⛔'};
  };

  const selFac=sel?impayes.find(f=>f.id===sel):null;

  // RELANCE DETAIL
  if(selFac){
    const ab=getAgeBadge(selFac.joursDue);
    const msgDefault='Madame, Monsieur '+selFac.cl?.nom+',\n\nNous nous permettons de vous rappeler que la facture '+selFac.id+' d\'un montant de '+selFac.ttc.toFixed(3)+' DT TTC, datée du '+new Date(selFac.date).toLocaleDateString('fr-FR')+', reste à ce jour impayée.\n\nNous vous serions reconnaissants de bien vouloir procéder au règlement dans les meilleurs délais.\n\nCordialement,\n'+(data.config?.nom||'Le Garage');
    return html`<div>
      <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <button class="btn bg" onClick=${()=>setSel(null)}>← Retour</button>
        <span style=${{flex:1,fontSize:16,fontWeight:700}}>${selFac.id}</span>
        <span class="tag" style=${{background:ab.bg,color:ab.c,fontSize:12,padding:'4px 12px'}}>${ab.l} sans paiement</span>
      </div>

      <!-- Recap facture -->
      <div class="ca" style=${{marginBottom:12,padding:16}}>
        <div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
          ${[
            ['Client',selFac.cl?.nom||'—'],
            ['Montant TTC',selFac.ttc.toFixed(3)+' DT'],
            ['Date facture',new Date(selFac.date).toLocaleDateString('fr-FR')],
            ['Age',selFac.joursDue+' jours'],
          ].map(([l,v])=>html`<div key=${l} style=${{textAlign:'center',padding:'10px',background:'#F7F9FC',borderRadius:8}}>
            <div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',marginBottom:4}}>${l}</div>
            <div style=${{fontSize:14,fontWeight:700}}>${v}</div>
          </div>`)}
        </div>
        ${selFac.cl?.tel&&html`<div style=${{marginTop:10,fontSize:12,color:'#4A5568'}}>Tel: <strong>${selFac.cl.tel}</strong>${selFac.cl.adresse?' — '+selFac.cl.adresse:''}</div>`}
      </div>

      <!-- Historique relances -->
      ${selFac.relances.length>0&&html`<div class="ca" style=${{marginBottom:12}}>
        <div class="ch"><span class="ct">Historique des relances</span></div>
        ${selFac.relances.map((r,i)=>html`<div key=${i} style=${{display:'flex',gap:12,padding:'9px 14px',borderBottom:'1px solid rgba(0,44,95,.05)'}}>
          <div style=${{width:8,height:8,borderRadius:'50%',background:'#1255A0',marginTop:5,flexShrink:0}}/>
          <div style=${{flex:1}}>
            <div style=${{display:'flex',justifyContent:'space-between',marginBottom:3}}>
              <span style=${{fontSize:11,fontWeight:700,color:'#1255A0'}}>${r.type}</span>
              <span style=${{fontSize:10,color:'#8A99AA'}}>${new Date(r.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
            </div>
            ${r.message&&html`<div style=${{fontSize:11,color:'#4A5568',background:'#F7F9FC',padding:'6px 8px',borderRadius:6,marginTop:4,whiteSpace:'pre-wrap',fontFamily:'monospace'}}>${r.message.slice(0,120)}${r.message.length>120?'...':''}</div>`}
            <div style=${{fontSize:10,color:'#8A99AA',marginTop:3}}>Par: ${r.par}</div>
          </div>
        </div>`)}
      </div>`}

      <!-- Actions relance -->
      <div class="ca" style=${{padding:16}}>
        <div style=${{fontSize:13,fontWeight:700,marginBottom:14}}>Enregistrer une relance</div>
        <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:14}}>
          ${[
            {type:'Appel téléphonique',icon:'Tel',c:'#1255A0'},
            {type:'SMS envoyé',icon:'SMS',c:'#0E7A4E'},
            {type:'Email envoyé',icon:'Mail',c:'#5B4FC9'},
            {type:'Courrier recommandé',icon:'AR',c:'#9A5F00'},
            {type:'Mise en demeure',icon:'MED',c:'#C02020'},
            {type:'Contact direct',icon:'Direct',c:'#002C5F'},
          ].map(r=>html`<button key=${r.type} class="btn bg bsm"
            style=${{border:'1.5px solid rgba(0,44,95,.1)',padding:'8px',textAlign:'center',borderRadius:9,cursor:'pointer',fontSize:11}}
            onClick=${()=>{if(confirm('Enregistrer: "'+r.type+'" pour '+selFac.id+' ?'))enregistrerRelance(selFac.id,r.type,'');}}>
            <div style=${{fontSize:16,marginBottom:3,color:r.c,fontWeight:700}}>${r.icon}</div>
            <div style=${{fontSize:10}}>${r.type}</div>
          </button>`)}
        </div>
        <div class="fi"><label>Relance avec message personnalisé (email / courrier)</label>
          <textarea rows="6" value=${relanceNote||msgDefault} onInput=${e=>setRelanceNote(e.target.value)} style=${{fontFamily:'monospace',fontSize:11}}/>
        </div>
        <div style=${{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
          <button class="btn bp" onClick=${()=>enregistrerRelance(selFac.id,'Email/Courrier',relanceNote||msgDefault)}>Enregistrer la relance écrite</button>
        </div>
        <div class="al awn" style=${{marginTop:10,fontSize:11}}>
          Passé 90 jours sans paiement, envisager : mise en demeure par huissier, blocage du service, signalement STEG/SONEDE si B2B.
        </div>
      </div>
    </div>`;
  }

  // LISTE
  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div>
        <h2 style=${{fontSize:18,fontWeight:700}}>Suivi impayés & Relances</h2>
        <p style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>${impayes.length} facture${impayes.length>1?'s':''} impayée${impayes.length>1?'s':''} — ${total.toFixed(3)} DT TTC</p>
      </div>
    </div>

    <!-- Aging buckets -->
    <div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}}>
      ${buckets.map(b=>html`<div key=${b.l} style=${{background:'#fff',border:'0.5px solid rgba(0,44,95,.1)',borderRadius:12,padding:'12px 14px',borderTop:'3px solid '+b.c,cursor:'pointer'}}
        onClick=${()=>setFilterAge(filterAge===('0_30'===b.l.slice(0,4)?'0_30':b.l.startsWith('31')?'30_60':b.l.startsWith('61')?'60_90':'90plus')?'all':b.l.startsWith('0')?'0_30':b.l.startsWith('31')?'30_60':b.l.startsWith('61')?'60_90':'90plus')}>
        <div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>${b.l}</div>
        <div style=${{fontSize:22,fontWeight:700,color:b.c}}>${b.count}</div>
        <div style=${{fontSize:11,color:b.c,marginTop:3,fontWeight:500}}>${b.montant.toFixed(3)} DT</div>
      </div>`)}
    </div>

    <!-- Summary bar -->
    ${total>0&&html`<div class="ca" style=${{marginBottom:12,padding:'12px 16px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <span style=${{fontSize:12,fontWeight:700}}>Répartition des créances</span>
        <span style=${{fontSize:11,color:'#8A99AA',marginLeft:'auto'}}>Total: ${total.toFixed(3)} DT TTC</span>
      </div>
      <div style=${{height:20,borderRadius:6,overflow:'hidden',display:'flex'}}>
        ${buckets.map(b=>b.montant>0?html`<div key=${b.l} style=${{width:Math.round(b.montant/total*100)+'%',background:b.c}} title=${b.l+': '+b.montant.toFixed(3)+' DT'}/>`:null)}
      </div>
      <div style=${{display:'flex',gap:12,marginTop:6,flexWrap:'wrap'}}>
        ${buckets.filter(b=>b.count>0).map(b=>html`<span key=${b.l} style=${{fontSize:10,color:b.c,display:'flex',alignItems:'center',gap:4}}>
          <span style=${{width:8,height:8,borderRadius:2,background:b.c,display:'inline-block'}}></span>
          ${b.l}: ${Math.round(b.montant/total*100)}%
        </span>`)}
      </div>
    </div>`}

    <!-- Filter bar -->
    <div class="fb" style=${{marginBottom:12}}>
      ${[['all','Tous ('+impayes.length+')'],['0_30','0-30j ('+buckets[0].count+')'],['30_60','31-60j ('+buckets[1].count+')'],['60_90','61-90j ('+buckets[2].count+')'],['90plus','+90j ('+buckets[3].count+')']].map(([k,l])=>html`
        <button key=${k} class=${`fbn${filterAge===k?' ac':''}`} onClick=${()=>setFilterAge(k)}>${l}</button>`)}
    </div>

    <!-- Liste -->
    ${filtered.length===0?html`<div class="ca"><div class="em"><p>Aucune facture impayée dans cette tranche — bonne gestion !</p></div></div>`:filtered.map(f=>{
      const ab=getAgeBadge(f.joursDue);
      const relanceRecente=f.joursDerniereRelance!==null&&f.joursDerniereRelance<=7;
      return html`<div key=${f.id} class="ca" style=${{marginBottom:8,padding:14,cursor:'pointer',borderLeft:'3px solid '+ab.c}} onClick=${()=>setSel(f.id)}>
        <div style=${{display:'flex',alignItems:'center',gap:12}}>

              <span style=${{fontSize:11,fontFamily:'monospace',fontWeight:700,color:'#002C5F'}}>${f.id}</span>
              ${f.relances.length>0?html`<span style=${{fontSize:9,padding:'1px 6px',borderRadius:10,background:'#EAF1FD',color:'#1255A0'}}>${f.relances.length} relance${f.relances.length>1?'s':''}</span>`:html`<span style=${{fontSize:9,padding:'1px 6px',borderRadius:10,background:'#FDF3E3',color:'#9A5F00'}}>Pas encore relancé</span>`}
              ${relanceRecente&&html`<span style=${{fontSize:9,padding:'1px 6px',borderRadius:10,background:'#E6F4EE',color:'#0E7A4E'}}>Relancé il y a ${f.joursDerniereRelance}j</span>`}
            </div>
            <div style=${{fontSize:13,fontWeight:700}}>${f.cl?.nom||'—'}</div>
            <div style=${{fontSize:11,color:'#4A5568',marginTop:2}}>
              Facturé le ${new Date(f.date).toLocaleDateString('fr-FR')}
              ${f.cl?.tel?html` — Tel: <strong>${f.cl.tel}</strong>`:''}
            </div>
          </div>
          <div style=${{textAlign:'right',flexShrink:0}}>
            <div style=${{fontSize:20,fontWeight:700,color:ab.c}}>${f.ttc.toFixed(3)} DT</div>
            <div style=${{marginTop:4}}>
              <span class="tag" style=${{background:ab.bg,color:ab.c}}>${ab.l}</span>
            </div>
            <div style=${{fontSize:10,color:'#8A99AA',marginTop:4}}>Cliquer pour relancer →</div>
          </div>
        </div>
      </div>`;
    })}
  </div>`;
}

// -- RDV PAGE -----------------------------------------------
function RDVPage({data,setData,user}){
  const[showNew,setShowNew]=useState(false);
  const[form,setForm]=useState({client_id:'',vehicule_id:'',date:'',heure:'09:00',motif:'',notes:'',bay:''});
  const sf=(k)=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const rdvs=data.rdvs||[];
  const now=new Date();
  const today=now.toISOString().split('T')[0];
  const[filterDate,setFilterDate]=useState(today);

  const vhsForClient=form.client_id?(data.vehicules||[]).filter(v=>v.client_id===parseInt(form.client_id)):[];

  const save=()=>{
    if(!form.client_id||!form.date||!form.heure||!form.motif){alert('Client, date, heure et motif requis');return;}
    const cl=data.clients.find(c=>c.id===parseInt(form.client_id));
    const vh=data.vehicules.find(v=>v.id===form.vehicule_id);
    const rdv={id:'RDV-'+Date.now(),client_id:parseInt(form.client_id),vehicule_id:form.vehicule_id||null,client_nom:cl?.nom||'',vehicule_lib:vh?vh.marque+' '+vh.modele+' '+vh.immat:'',date:form.date,heure:form.heure,motif:form.motif,notes:form.notes,bay:form.bay||null,statut:'confirme',cree_par:user.name,cree_le:new Date().toISOString()};
    setData(d=>({...d,rdvs:[rdv,...(d.rdvs||[])]}));
    setForm({client_id:'',vehicule_id:'',date:'',heure:'09:00',motif:'',notes:'',bay:''});
    setShowNew(false);
    alert('✓ RDV créé — '+cl?.nom+' le '+new Date(form.date).toLocaleDateString('fr-FR')+' à '+form.heure);
  };

  const annuler=(id)=>{
    if(!confirm('Annuler ce rendez-vous ?'))return;
    setData(d=>({...d,rdvs:d.rdvs.map(r=>r.id===id?{...r,statut:'annule'}:r)}));
  };

  const convertToOR=(rdv)=>{
    setData(d=>({...d,rdvs:d.rdvs.map(r=>r.id===rdv.id?{...r,statut:'converti'}:r)}));
    alert('Allez dans Ordres de Réparation pour créer l\'OR → '+rdv.client_nom);
  };

  const HEURES=['07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];
  const MOTIFS=['Vidange & révision','Freinage','Climatisation','Diagnostic','Électronique','Carrosserie','Contrôle technique','Pneus','Distribution','Autre'];

  const rdvsToday=rdvs.filter(r=>r.date===filterDate&&r.statut!=='annule');
  const rdvsUpcoming=rdvs.filter(r=>r.date>today&&r.statut==='confirme').sort((a,b)=>a.date.localeCompare(b.date)||a.heure.localeCompare(b.heure));
  const rdvsPast=rdvs.filter(r=>r.date<today).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);

  const ST_RDV={confirme:{c:'#1255A0',bg:'#EAF1FD',l:'Confirmé'},annule:{c:'#C02020',bg:'#FDECEC',l:'Annulé'},converti:{c:'#0E7A4E',bg:'#E6F4EE',l:'Converti OR ✓'}};

  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div><h2 style=${{fontSize:18,fontWeight:700}}>Rendez-vous clients</h2><p style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>${rdvsUpcoming.length} RDV à venir · ${rdvsToday.length} ce jour</p></div>
      <button class="btn bp" onClick=${()=>setShowNew(!showNew)}>+ Nouveau RDV</button>
    </div>

    ${showNew&&html`<div class="ca" style=${{marginBottom:14,padding:16,border:'2px solid #00AAD2'}}>
      <div style=${{fontSize:13,fontWeight:700,marginBottom:12,color:'#002C5F'}}>Nouveau rendez-vous</div>
      <div class="g2">
        <div class="fi"><label>Client *</label>
          <select value=${form.client_id} onChange=${e=>setForm({...form,client_id:e.target.value,vehicule_id:''})}>
            <option value="">Sélectionner...</option>
            ${(data.clients||[]).map(cl=>html`<option key=${cl.id} value=${cl.id}>${cl.nom}${cl.tel?' — '+cl.tel:''}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Véhicule</label>
          <select value=${form.vehicule_id} onChange=${sf('vehicule_id')} disabled=${!form.client_id}>
            <option value="">Sélectionner...</option>
            ${vhsForClient.map(v=>html`<option key=${v.id} value=${v.id}>${v.marque} ${v.modele} — ${v.immat}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Date *</label><input type="date" value=${form.date} min=${today} onInput=${sf('date')}/></div>
        <div class="fi"><label>Heure *</label>
          <select value=${form.heure} onChange=${sf('heure')}>
            ${HEURES.map(h=>html`<option key=${h} value=${h}>${h}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Motif *</label>
          <select value=${form.motif} onChange=${sf('motif')}>
            <option value="">Sélectionner...</option>
            ${MOTIFS.map(m=>html`<option key=${m} value=${m}>${m}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Bay (optionnel)</label>
          <select value=${form.bay} onChange=${sf('bay')}>
            <option value="">Non assigné</option>
            ${[1,2,3,4,5,6].map(b=>html`<option key=${b} value=${b}>Bay ${b}</option>`)}
          </select>
        </div>
        <div class="fi" style=${{gridColumn:'1/-1'}}><label>Notes</label><input value=${form.notes} onInput=${sf('notes')} placeholder="Observations, préparations spéciales..."/></div>
      </div>
      <div style=${{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button class="btn bg" onClick=${()=>setShowNew(false)}>Annuler</button>
        <button class="btn bs" onClick=${save}>✓ Confirmer RDV</button>
      </div>
    </div>`}

    <!-- Today's schedule -->
    <div class="ca" style=${{marginBottom:14}}>
      <div class="ch" style=${{background:'#002C5F'}}>
        <span class="ct" style=${{color:'#fff'}}>📅 Planning du jour</span>
        <input type="date" value=${filterDate} onInput=${e=>setFilterDate(e.target.value)} style=${{padding:'4px 8px',borderRadius:7,border:'1px solid rgba(255,255,255,.3)',background:'rgba(255,255,255,.1)',color:'#fff',fontSize:11,outline:'none'}}/>
      </div>
      <div style=${{padding:12}}>
        ${rdvsToday.length===0?html`<div class="em" style=${{padding:'20px 0'}}><p>Aucun RDV pour cette date</p></div>`:
        html`<div style=${{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
          ${rdvsToday.sort((a,b)=>a.heure.localeCompare(b.heure)).map(rdv=>html`<div key=${rdv.id} style=${{background:'#F7F9FC',borderRadius:10,padding:'11px 14px',border:'1.5px solid rgba(0,170,210,.2)',borderLeft:'4px solid #00AAD2'}}>
            <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <span style=${{fontSize:16,fontWeight:900,color:'#002C5F',fontFamily:'monospace'}}>${rdv.heure}</span>
              ${rdv.bay&&html`<span class="tag tin" style=${{fontSize:9}}>Bay ${rdv.bay}</span>`}
              <span class="tag" style=${{background:ST_RDV[rdv.statut]?.bg,color:ST_RDV[rdv.statut]?.c,fontSize:9,marginLeft:'auto'}}>${ST_RDV[rdv.statut]?.l||rdv.statut}</span>
            </div>
            <div style=${{fontSize:13,fontWeight:700}}>${rdv.client_nom}</div>
            <div style=${{fontSize:11,color:'#4A5568',marginTop:2}}>${rdv.vehicule_lib||'Véhicule non spécifié'}</div>
            <div style=${{fontSize:11,color:'#00AAD2',marginTop:2,fontWeight:600}}>${rdv.motif}</div>
            ${rdv.notes&&html`<div style=${{fontSize:10,color:'#8A99AA',marginTop:2,fontStyle:'italic'}}>${rdv.notes}</div>`}
            <div style=${{display:'flex',gap:5,marginTop:8}}>
              ${rdv.statut==='confirme'&&html`
                <button class="btn bs bsm" style=${{fontSize:10}} onClick=${()=>convertToOR(rdv)}>→ Créer OR</button>
                <button class="btn bd bsm" style=${{fontSize:10}} onClick=${()=>annuler(rdv.id)}>✕ Annuler</button>`}
            </div>
          </div>`)}
        </div>`}
      </div>
    </div>

    <!-- Upcoming -->
    ${rdvsUpcoming.length>0&&html`<div class="ca" style=${{marginBottom:14}}>
      <div class="ch"><span class="ct">RDV à venir (${rdvsUpcoming.length})</span></div>
      <div class="tw"><table>
        <thead><tr><th>Date</th><th>Heure</th><th>Client</th><th>Véhicule</th><th>Motif</th><th>Bay</th><th>Statut</th><th></th></tr></thead>
        <tbody>${rdvsUpcoming.map(rdv=>html`<tr key=${rdv.id}>
          <td style=${{fontWeight:700,color:'#002C5F'}}>${new Date(rdv.date).toLocaleDateString('fr-FR')}</td>
          <td style=${{fontFamily:'monospace',fontWeight:700,color:'#00AAD2'}}>${rdv.heure}</td>
          <td style=${{fontWeight:600}}>${rdv.client_nom}</td>
          <td style=${{fontSize:11,color:'#4A5568'}}>${rdv.vehicule_lib||'—'}</td>
          <td style=${{fontSize:11}}>${rdv.motif}</td>
          <td>${rdv.bay?html`<span class="tag tin" style=${{fontSize:9}}>B${rdv.bay}</span>`:'—'}</td>
          <td><span class="tag" style=${{background:ST_RDV[rdv.statut]?.bg,color:ST_RDV[rdv.statut]?.c}}>${ST_RDV[rdv.statut]?.l||rdv.statut}</span></td>
          <td><div style=${{display:'flex',gap:4}}>
            <button class="btn bs bsm" onClick=${()=>convertToOR(rdv)}>→ OR</button>
            <button class="btn bd bsm" onClick=${()=>annuler(rdv.id)}>✕</button>
          </div></td>
        </tr>`)}
        </tbody>
      </table></div>
    </div>`}

    <!-- Past RDVs summary -->
    ${rdvsPast.length>0&&html`<div class="ca">
      <div class="ch"><span class="ct" style=${{color:'#8A99AA'}}>Historique récent</span></div>
      <div class="tw"><table>
        <thead><tr><th>Date</th><th>Client</th><th>Motif</th><th>Statut</th></tr></thead>
        <tbody>${rdvsPast.map(rdv=>html`<tr key=${rdv.id} style=${{opacity:.7}}>
          <td style=${{fontSize:11,color:'#8A99AA'}}>${new Date(rdv.date).toLocaleDateString('fr-FR')} ${rdv.heure}</td>
          <td>${rdv.client_nom}</td>
          <td style=${{fontSize:11}}>${rdv.motif}</td>
          <td><span class="tag" style=${{background:ST_RDV[rdv.statut]?.bg,color:ST_RDV[rdv.statut]?.c,fontSize:9}}>${ST_RDV[rdv.statut]?.l||rdv.statut}</span></td>
        </tr>`)}
        </tbody>
      </table></div>
    </div>`}
  </div>`;
}

// ── buildDossierHTML — standalone, no htm context ────────────────────────────
function buildDossierHTML(data, periode){
  const cfg=data.config||{};
  const nomGarage=cfg.nom||'AutoPro';
  const mf=cfg.mf||'—';
  const moisLabel=new Date(periode+'-01').toLocaleString('fr-FR',{month:'long',year:'numeric'});
  const moisLabelCap=moisLabel.charAt(0).toUpperCase()+moisLabel.slice(1);

  const facturesMois=(data.factures||[]).filter(f=>(f.date||'').startsWith(periode));
  const tvaColl=facturesMois.reduce((a,f)=>a+(f.tva||0),0);
  const htVentes=facturesMois.reduce((a,f)=>a+(f.ht||0),0);
  const ttcVentes=facturesMois.reduce((a,f)=>a+(f.ttc||0),0);
  const encaisse=facturesMois.filter(f=>f.statut==='paye'||f.statut==='payee').reduce((a,f)=>a+(f.ttc||0),0);
  const impayesMois=facturesMois.filter(f=>f.statut!=='payee').reduce((a,f)=>a+(f.ttc||0),0);

  const rowsVentes=facturesMois.map(f=>{
    const cl=(data.clients||[]).find(c=>c.id===f.client_id);
    const statut=f.statut==='paye'||f.statut==='payee'?'<span style="color:#0E7A4E;font-weight:700">Payee</span>':'<span style="color:#9A5F00">En attente</span>';
    return '<tr><td>'+f.id+'</td><td>'+(f.date||'')+'</td><td>'+(cl?cl.nom:'—')+'</td>'
      +'<td style="text-align:right">'+((f.ht||0).toFixed(3))+'</td>'
      +'<td style="text-align:right;color:#9A5F00">'+((f.tva||0).toFixed(3))+'</td>'
      +'<td style="text-align:right;font-weight:700">'+((f.ttc||0).toFixed(3))+'</td>'
      +'<td style="text-align:center">'+statut+'</td></tr>';
  }).join('');

  const bcsMois=(data.bcs||[]).filter(bc=>(bc.date||'').startsWith(periode));
  const htAchats=bcsMois.reduce((a,bc)=>a+((bc.lignes||[]).reduce((s,l)=>s+(+(l.qte||0))*(+(l.prix||0)),0)),0);
  const tvaDeduct=htAchats*0.19;

  const rowsAchats=bcsMois.map(bc=>{
    const total=(bc.lignes||[]).reduce((s,l)=>s+(+(l.qte||0))*(+(l.prix||0)),0);
    return '<tr><td>'+bc.id+'</td><td>'+(bc.date||'')+'</td><td>'+(bc.fournisseur||'—')+'</td>'
      +'<td>'+((bc.lignes||[]).length)+' ligne(s)</td>'
      +'<td style="text-align:right">'+total.toFixed(3)+'</td>'
      +'<td style="text-align:right;color:#9A5F00">'+(total*0.19).toFixed(3)+'</td>'
      +'<td style="text-align:right;font-weight:700">'+(total*1.19).toFixed(3)+'</td></tr>';
  }).join('');

  const tvaNette=tvaColl-tvaDeduct;

  const caisseMois=(data.caisse||[]).filter(c=>(c.date||'').slice(0,7)===periode);
  const entreesCaisse=caisseMois.filter(c=>c.type==='entree').reduce((a,c)=>a+(c.montant||0),0);
  const sortiesCaisse=caisseMois.filter(c=>c.type==='sortie').reduce((a,c)=>a+(c.montant||0),0);
  const soldeCaisse=entreesCaisse-sortiesCaisse;
  const rowsCaisse=caisseMois.map(c=>'<tr><td>'+(c.date||'')+'</td><td>'+(c.lib||'—')+'</td>'
    +'<td style="text-align:right;color:'+(c.type==='entree'?'#0E7A4E':'#C02020')+'">'+(c.type==='entree'?'+':'-')+(c.montant||0).toFixed(3)+'</td>'
    +'<td>'+(c.type==='entree'?'Entree':'Sortie')+'</td>'
    +'<td>'+(c.createur||'')+'</td></tr>').join('');

  const employes=data.employes||[];
  const rowsPaie=employes.map(e=>{
    const p=calcPaie(e.salaire||0);
    return '<tr><td>'+(e.mat||'')+'</td><td style="font-weight:700">'+e.nom+'</td><td>'+(e.poste||'')+'</td>'
      +'<td style="text-align:right">'+p.brut.toFixed(3)+'</td>'
      +'<td style="text-align:right;color:#C02020">'+p.cnss.toFixed(3)+'</td>'
      +'<td style="text-align:right;color:#C02020">'+p.css.toFixed(3)+'</td>'
      +'<td style="text-align:right;color:#C02020">'+p.irpp.toFixed(3)+'</td>'
      +'<td style="text-align:right;font-weight:700;color:#0E7A4E">'+p.net.toFixed(3)+'</td>'
      +'<td style="text-align:right;color:#5B4FC9">'+p.cnss_pat.toFixed(3)+'</td></tr>';

  const totBrut=employes.reduce((a,e)=>a+(e.salaire||0),0);

function exportCSV(rows,headers,filename){
  const lines=[headers.join(';'),...rows.map(r=>r.map(v=>(v===null||v===undefined?'':String(v).replace(/;/g,',')).trim()).join(';'))];
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename+'.csv';a.click();URL.revokeObjectURL(url);
}

function printHTMLReport(title,htmlContent){
  const win=window.open('','_blank','width=900,height=700');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>${title}</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;padding:28px;font-size:11px}
  h1{font-size:18px;font-weight:900;color:#002C5F;margin-bottom:4px}

  table{width:100%;border-collapse:collapse;margin-bottom:20px}
  th{background:#002C5F;color:#fff;padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase}
  td{padding:6px 10px;border-bottom:1px solid #E5E7EA}
  .total td{font-weight:900;background:#F7F9FC}

  </style></head><body>${htmlContent}<div class="footer">Généré par AutoPro ERP — ${new Date().toLocaleString('fr-FR')}</div></body></html>`);

window.addEventListener('load',function(){
  try{
    var root=document.getElementById('root');
    if(!root){console.error('No root');return;}
    render(html`<${App}/>`,root);
  }catch(err){
    console.error('RENDER ERROR:',err);
    document.getElementById('root').innerHTML=
      '<div style="padding:40px;font-family:sans-serif;background:#fff;min-height:100vh">'
      +'<div style="background:#FDECEC;border:1px solid #F7C1C1;border-radius:8px;padding:20px;max-width:600px">'
      +'<h2 style="color:#C02020;margin:0 0 12px">Erreur ERP</h2>'
      +'<p style="font-family:monospace;font-size:13px;color:#333">'+err.message+'</p>'
      +'<p style="margin-top:12px;font-size:12px;color:#666">Ouvrez la Console Safari pour plus de détails</p>'
      +'<button onclick="sessionStorage.clear();location.reload()" style="margin-top:16px;padding:10px 20px;background:#002C5F;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">Retour sélection société</button>'
      +'</div></div>';

});
