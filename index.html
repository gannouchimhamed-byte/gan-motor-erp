// ── Validation Tunisie ────────────────────────────────────────────────────────
const validateTel=(v)=>{
  // Tunisie: 8 chiffres, optionnel +216 devant
  const clean=v.replace(/[\s\-\.\(\)]/g,'');
  return /^(\+216)?[0-9]{8}$/.test(clean);
};
const formatTel=(v)=>{
  const clean=v.replace(/[^0-9]/g,'').slice(-8);
  if(clean.length===8) return clean.slice(0,2)+' '+clean.slice(2,5)+' '+clean.slice(5);
  return v;
};
const validateImmat=(v)=>{
  // Format tunisien: 123 TUN 4567 ou 123RS4567 (ancien)
  return /^[0-9]{1,4}\s?(TUN|RS|TN)\s?[0-9]{1,4}$/i.test(v.trim());
};
const validateMF=(v)=>{
  // MF tunisien: 7 chiffres / lettre / lettre / lettre / 2 chiffres
  return /^[0-9]{7}\/[A-Z]\/[A-Z]\/[A-Z]\/[0-9]{3}$/.test(v.trim().toUpperCase());
};

// ── calcPaie — Barème IRPP Tunisie 2025 (Loi de Finances 2025) ───────────────
const calcPaie=(salaireBrut)=>{
  const s=+salaireBrut||0;
  // Cotisations salariales
  const cnss   = +(s*0.0918).toFixed(3);   // CNSS salarié 9.18%
  const css    = +(s*0.01).toFixed(3);     // CSS 1%
  // Déduction forfaitaire revenus 2/3 (plafonnée)
  const deductForf = +Math.min(s*2/3, 666.667).toFixed(3);
  // Revenu imposable mensuel
  const ri = +Math.max(0, s - cnss - css - deductForf).toFixed(3);
  // Revenu annuel imposable
  const ra = ri * 12;
  // Barème IRPP 2025 tranches annuelles
  let ia = 0;
  if(ra > 100000)      ia = 28750 + (ra-100000)*0.35;
  else if(ra > 50000)  ia = 13750 + (ra-50000)*0.30;
  else if(ra > 20000)  ia = 4750  + (ra-20000)*0.25;
  else if(ra > 10000)  ia = 1750  + (ra-10000)*0.30;
  else if(ra > 5000)   ia = 500   + (ra-5000)*0.25;
  else if(ra > 1500)   ia = (ra-1500)*0.14;
  const irpp   = +Math.max(0, ia/12).toFixed(3);
  const net    = +(s - cnss - css - irpp).toFixed(3);
  // Charges patronales
  const cnss_pat = +(s*0.1657).toFixed(3);  // CNSS patronal 16.57%
  const at_pat   = +(s*0.005).toFixed(3);   // AT/AM 0.5%
  const cout_total = +(s + cnss_pat + at_pat).toFixed(3);
  return{brut:s,cnss,css,irpp,net,ri,ra,cnss_pat,at_pat,cout_total};
};
const TIMBRE_FISCAL=1.000;
// ── calcF — Calcul facture OT, précision 3 décimales (millime TN) ────────────
const calcF=(ot,pieces)=>{
  const d3=n=>+n.toFixed(3);
  // Main d'oeuvre
  const mb  = d3((ot.mo_h||0)*(ot.mo_tarif||0));
  const mr  = d3(mb*(ot.remise_mo||0)/100);
  const mn  = d3(mb-mr);
  // Lignes pièces (devis accepté ou tâches faites)
  const srcLignes = ot.devis_lignes||ot.taches.filter(t=>t.piece_ref&&t.fait);
  const ls=srcLignes.map(t=>{
    const p=pieces.find(x=>x.ref===(t.piece_ref||t.ref));
    if(!p&&!t.pu)return null;
    const q=+(t.qte_piece||t.qte||1);
    const pu=+(t.pu||p?.pv||0);
    const pmb=d3(pu*q);
    const pra=d3(pmb*(+(t.remise||ot.remise_pieces||0))/100);
    return{ref:p?.ref||t.ref||'',lib:p?.nom||t.lib||t.description||'',qte:q,pu,rp:+(t.remise||ot.remise_pieces||0),pmn:d3(pmb-pra)};
  }).filter(Boolean);
  const pt  = d3(ls.reduce((a,l)=>a+l.pmn,0));
  const ht  = d3(mn+pt);
  const tva = d3(ht*0.19);
  const ttc = d3(ht+tva+TIMBRE_FISCAL);
  return{mb,mr,mn,ls,pt,ht,tva,timbre:TIMBRE_FISCAL,ttc};
};

  {prefix:'LGXCE4CG',marque:'BYD',modele:'King',annee_base:2024},
  {prefix:'KMHD',marque:'Hyundai',modele:'i30',annee_base:2018},
  {prefix:'KMHJ',marque:'Hyundai',modele:'Tucson',annee_base:2020},
  {prefix:'KMHK',marque:'Hyundai',modele:'Elantra',annee_base:2021},
];
const decodeVIN=(vin)=>{
  if(!vin||vin.length<8)return null;
  const match=VIN_DB.find(v=>vin.toUpperCase().startsWith(v.prefix));
  if(!match)return null;
  // Year encoding: position 10 (index 9), chars A=1980,B=1981,...
  const YR_MAP={A:2010,B:2011,C:2012,D:2013,E:2014,F:2015,G:2016,H:2017,J:2018,K:2019,L:2020,M:2021,N:2022,P:2023,R:2024,S:2025,T:2026};
  const yr=vin.length>=10?YR_MAP[vin[9].toUpperCase()]||match.annee_base:match.annee_base;
  return{marque:match.marque,modele:match.modele,annee:yr};
};

function ImportBlock({title,fields,status,preview,imported,onParse}){
  const[mapping,setMapping]=useState({});
  const[cols,setCols]=useState([]);
  const[rows,setRows]=useState([]);
  const[error,setError]=useState('');

  const parseFile=(file)=>{
    setError('');
    const reader=new FileReader();
    const isCSV=file.name.toLowerCase().endsWith('.csv');

    reader.onload=(e)=>{
      try{
        let sheetRows=[];
        if(isCSV){
          // Simple CSV parser
          const text=e.target.result;
          const lines=text.split('\n').filter(l=>l.trim());
          const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
          sheetRows=lines.slice(1).map(line=>{
            const vals=line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));
            const obj={};
            headers.forEach((h,i)=>obj[h]=vals[i]||'');
            return obj;
          });
        } else {
          // Excel via SheetJS
          const data=new Uint8Array(e.target.result);
          const wb=XLSX.read(data,{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          sheetRows=XLSX.utils.sheet_to_json(ws,{defval:''});
        }

        if(sheetRows.length===0){setError('Fichier vide ou format non reconnu');return;}
        const headers=Object.keys(sheetRows[0]);
        setCols(headers);
        setRows(sheetRows);

        // Auto-mapping: fuzzy match column headers to expected fields
        const autoMap={};
        fields.forEach(f=>{
          const fk=f.key.toLowerCase();
          const fl=f.label.toLowerCase();
          const match=headers.find(h=>{
            const hl=h.toLowerCase().replace(/[_\-\s]/g,'');
            const fkn=fk.replace(/[_\-\s]/g,'');
            return hl===fkn||hl.includes(fkn)||fkn.includes(hl)||
              fl.split(' ').some(w=>w.length>3&&hl.includes(w.toLowerCase()));
          });
          if(match)autoMap[f.key]=match;
        });
        setMapping(autoMap);
      }catch(err){
        setError('Erreur de lecture : '+err.message);
      }
    };

    if(file.name.toLowerCase().endsWith('.csv')){
      reader.readAsText(file,'UTF-8');
    } else {
      reader.readAsArrayBuffer(file);
    }
  };

  const handleDrop=(e)=>{
    e.preventDefault();
    const file=e.dataTransfer?.files[0]||e.target.files[0];
    if(file)parseFile(file);
  };

  const doImport=()=>{
    const required=fields.filter(f=>f.required);
    const missing=required.filter(f=>!mapping[f.key]);
    if(missing.length>0){setError('Colonnes requises non mappées : '+missing.map(f=>f.label).join(', '));return;}
    onParse(rows,mapping);
  };

  if(status==='done')return html`<div class="al aok" style=${{marginBottom:0}}>
    ✓ <strong>${imported} enregistrements importés</strong> avec succès.
    <button onClick=${()=>{setCols([]);setRows([]);setMapping({});}} style=${{marginLeft:10,background:'none',border:'none',color:'#0E7A4E',cursor:'pointer',fontWeight:700,fontSize:12}}>Modifier</button>
  </div>`;

  return html`<div>
    <!-- Drop zone -->
    ${rows.length===0&&html`<div
      onDragOver=${e=>e.preventDefault()}
      onDrop=${handleDrop}
      style=${{border:'2px dashed rgba(0,44,95,.2)',borderRadius:12,padding:'28px 20px',textAlign:'center',cursor:'pointer',background:'#F7F9FC',marginBottom:12}}
      onClick=${()=>document.getElementById('file-import-'+title.replace(/\s/g,'')).click()}>
      <div style=${{fontSize:28,marginBottom:8}}>📂</div>
      <div style=${{fontSize:13,fontWeight:700,color:'#002C5F',marginBottom:4}}>Glissez votre fichier ici</div>
      <div style=${{fontSize:11,color:'#8A99AA'}}>Excel (.xlsx) ou CSV — Première ligne = en-têtes de colonnes</div>
      <input id=${'file-import-'+title.replace(/\s/g,'')} type="file" accept=".xlsx,.xls,.csv"
        style=${{display:'none'}} onChange=${handleDrop}/>
      <div style=${{marginTop:12,display:'inline-block',padding:'6px 16px',background:'#002C5F',color:'#fff',borderRadius:8,fontSize:12,fontWeight:700}}>Parcourir</div>
    </div>`}

    <!-- Error -->
    ${error&&html`<div class="al aer" style=${{marginBottom:10}}>${error}</div>`}

    <!-- Column mapping -->
    ${rows.length>0&&html`<div>
      <div style=${{fontSize:12,fontWeight:700,color:'#002C5F',marginBottom:8}}>
        📊 ${rows.length} lignes détectées — Mappez vos colonnes :
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:12}}>
        ${fields.map(f=>html`<div key=${f.key} style=${{display:'flex',alignItems:'center',gap:6,padding:'6px 8px',background:'#F7F9FC',borderRadius:8,border:'1px solid rgba(0,44,95,.08)'}}>
          <span style=${{fontSize:11,fontWeight:700,color:f.required?'#C02020':'#4A5568',minWidth:110,flexShrink:0}}>
            ${f.required?'* ':''}${f.label}
          </span>
          <select style=${{flex:1,padding:'4px 8px',border:'1.5px solid rgba(0,44,95,.15)',borderRadius:7,fontSize:11,outline:'none',background:mapping[f.key]?'#fff':'#FFF8F0'}}
            value=${mapping[f.key]||''} onChange=${e=>setMapping(m=>({...m,[f.key]:e.target.value}))}>
            <option value="">— ignorer —</option>
            ${cols.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}
          </select>
        </div>`)}
      </div>

      <!-- Preview table -->
      <div style=${{fontSize:11,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',marginBottom:6}}>Aperçu (5 premières lignes)</div>
      <div style=${{overflowX:'auto',marginBottom:12,borderRadius:8,border:'1px solid rgba(0,44,95,.1)'}}>
        <table style=${{width:'100%',borderCollapse:'collapse',fontSize:11}}>
          <thead><tr style=${{background:'#F0F2F5'}}>
            ${fields.filter(f=>mapping[f.key]).map(f=>html`<th key=${f.key} style=${{padding:'6px 10px',textAlign:'left',fontWeight:700,color:'#4A5568',borderBottom:'1px solid rgba(0,44,95,.1)',whiteSpace:'nowrap'}}>${f.label}</th>`)}
          </tr></thead>
          <tbody>
            ${rows.slice(0,5).map((r,i)=>html`<tr key=${i} style=${{borderBottom:'1px solid rgba(0,44,95,.04)'}}>
              ${fields.filter(f=>mapping[f.key]).map(f=>html`<td key=${f.key} style=${{padding:'5px 10px',color:'#0D1829',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${(r[mapping[f.key]]||'').toString()}</td>`)}
            </tr>`)}
          </tbody>
        </table>
      </div>

      <button onClick=${doImport}
        style=${{width:'100%',padding:'10px',border:'none',borderRadius:9,background:'#002C5F',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>
        ✓ Importer ${rows.length} enregistrements
      </button>
    </div>`}
  </div>`;
}

    const mkInit = n => (n||'?').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();

    const users = [];
    // DG always first
    users.push({
      id:'dg',role:'dg',
      name: cfg.dg_nom || 'Directeur Général',
      initials: mkInit(cfg.dg_nom||'DG'),
      password: cfg.dg_pass || 'ganmotor2026',
      color: colors.dg,
      label: labels.dg,
    });
    // Real employees
    emps.filter(e=>e.nom).forEach(e => {
      users.push({
        id: e.id || e.nom.replace(/\s/g,'').toLowerCase(),

        color: colors[e.role] || '#4A5568',
        label: labels[e.role] || e.role,
      });
    });
    return users;
  };

  const users = buildUsers();
  const[selId, setSelId] = useState(null);
  const[pass, setPass] = useState('');
  const[err, setErr] = useState('');
  const sel = users.find(u => u.id === selId) || null;

  const doLogin = () => {
    if(!sel){ setErr('Sélectionnez un utilisateur'); return; }
    if(!pass.trim()){ setErr('Mot de passe requis'); return; }

    setErr('');
    onLogin({...sel, loginAt: new Date().toISOString()});

    padding:'10px 12px', borderRadius:10, cursor:'pointer',
    display:'flex', alignItems:'center', gap:8, transition:'all .15s',

      </div>

      <div style=${{background:'#fff',borderRadius:18,padding:28,boxShadow:'0 24px 64px rgba(0,0,0,.35)'}}>
        <div style=${{fontSize:15,fontWeight:700,color:'#002C5F',marginBottom:4}}>Connexion</div>
        <div style=${{fontSize:12,color:'#8A99AA',marginBottom:18}}>Choisissez votre profil puis entrez votre mot de passe</div>

        <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
          ${users.map(u => {
            const isActive = selId === u.id;
            return html`<div key=${u.id}
              onClick=${() => { setSelId(u.id); setPass(''); setErr(''); }}
              style=${{...cardStyle,
                border:'2px solid '+(isActive ? u.color : 'rgba(0,44,95,.09)'),
                background: isActive ? u.color+'15' : '#F7F9FC',
              }}>
              <div style=${{width:34,height:34,borderRadius:9,background:u.color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>${u.initials}</div>
              <div>
                <div style=${{fontSize:11,fontWeight:700,color:'#0D1829',lineHeight:1.3}}>${u.name.split(' ')[0]}</div>
                <div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',letterSpacing:'.04em'}}>${u.label}</div>
              </div>
            </div>`;
          })}
        </div>

        ${sel ? html`<div style=${{marginBottom:12}}>
          <div style=${{fontSize:11,fontWeight:700,color:'#4A5568',marginBottom:6}}>
            Mot de passe pour <strong>${sel.name}</strong>
            <span style=${{marginLeft:6,fontSize:10,color:'#8A99AA',fontWeight:400}}>(${sel.label})</span>
          </div>
          <input

            onKeyDown=${e => e.key==='Enter' && doLogin()}
            style=${{width:'100%',padding:'11px 14px',border:'2px solid '+(err?'#C02020':'rgba(0,44,95,.12)'),borderRadius:10,fontSize:14,outline:'none',background:'#F7F9FC',boxSizing:'border-box'}}

          />

        ${err ? html`<div style=${{fontSize:12,color:'#C02020',marginBottom:10,padding:'8px 11px',background:'#FDECEC',borderRadius:8,border:'1px solid rgba(192,32,32,.2)'}}>⚠ ${err}</div>` : null}

      <div style=${{textAlign:'center',marginTop:16,fontSize:10,color:'rgba(255,255,255,.2)'}}>
        Données synchronisées avec le cloud · Supabase
      </div>
    </div>
  </div>`;
}


function App(){
  const USER_KEY = 'gm_erp_user';
  const DATA_KEY = 'gm_erp_data'; // kept for ERP component compatibility

  const safeRead = (key, fallback) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e) { return fallback; }
  };

  const[data, setDataRaw] = useState(INIT);
  const[user, setUser] = useState(() => safeRead(USER_KEY, null));
  const[loading, setLoading] = useState(true);
  const[saveStatus, setSaveStatus] = useState('idle'); // idle | saving | saved | error
  const isInitial = useRef(true);
  const saveTimer = useRef(null);

  // ── Load data from Supabase on startup ─────────────────────────────────
  useEffect(() => {
    (async () => {
      const remote = await loadFromSupabase();
      if(remote && remote.config){
        setDataRaw({...INIT, ...remote});
      } else {
        // No remote data — check localStorage fallback
        const local = safeRead(DATA_KEY, null);
        if(local && local.config){
          setDataRaw({...INIT, ...local});
          // Migrate localStorage data to Supabase
          await saveToSupabase({...INIT, ...local});
        } else {
          setDataRaw(INIT);
        }
      }
      isInitial.current = false;
      setLoading(false);
    })();
  }, []);

  // ── Sync data to Supabase on every change (debounced 500ms) ────────────
  const setData = useCallback((updater) => {
    setDataRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      return next;
    });
  }, []);

  useEffect(() => {
    if(isInitial.current || loading) return;
    // Also keep localStorage as offline fallback
    try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); } catch(e){}
    // Debounced Supabase sync
    clearTimeout(saveTimer.current);
    setSaveStatus('saving');
    saveTimer.current = setTimeout(async () => {
      await saveToSupabase(data);
      setSaveStatus('saved');
      setTimeout(() => setSaveStatus('idle'), 2000);
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  const login = u => {
    try { localStorage.setItem(USER_KEY, JSON.stringify(u)); } catch(e){}
    setUser(u);
  };

  const logout = () => {
    try { localStorage.removeItem(USER_KEY); } catch(e){}
    setUser(null);
  };

  // ── LOADING SCREEN ─────────────────────────────────────────────────────
  if(loading){
    return html`<div style=${{minHeight:'100vh',background:'linear-gradient(135deg,#001325,#002C5F)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <div style=${{fontSize:44,fontWeight:900,color:'#fff',letterSpacing:-2}}>GAN<span style=${{color:'#00AAD2'}}>Motor</span></div>
      <div style=${{display:'flex',alignItems:'center',gap:10}}>
        <div style=${{width:20,height:20,border:'3px solid rgba(0,170,210,.3)',borderTop:'3px solid #00AAD2',borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
        <span style=${{color:'rgba(255,255,255,.5)',fontSize:13}}>Connexion à la base de données...</span>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>`;
  }

  // ── ONBOARDING — first time only (no config) ──────────────────────────────
  if(!data.config){
    return html`<${Onboarding} onFinish=${async cfg => {
      const mkPass = nom => (nom.split(' ')[0]||'user').toLowerCase()+'123';
      const emps = (cfg.employes||[]).filter(e=>e.nom).map((e,i)=>({
        id: 'EMP'+Date.now()+i,
        mat: 'EMP-'+new Date().getFullYear()+'-'+String(i+1).padStart(3,'0'),
        nom: e.nom.trim(),
        poste: e.poste||'Employé',
        role: e.role||'tech',
        tel: e.tel||'',
        password: mkPass(e.nom),
        contrat: 'CDI',
        salaire: e.salaire||1200,
        embauche: new Date().toISOString().split('T')[0],
        conges_solde: 18,
      }));
      const newData = {...INIT, config:{...cfg, created:new Date().toISOString()}, employes:emps};
      // Save to Supabase immediately
      await saveToSupabase(newData);
      try { localStorage.setItem(DATA_KEY, JSON.stringify(newData)); } catch(e){}
      setDataRaw(newData);
    }}/>`;  
  }

  // ── LOGIN ─────────────────────────────────────────────────────────────────
  if(!user){
    return html`<${LoginPage} data=${data} onLogin=${login}/>`;
  }

  // ── SAVE STATUS INDICATOR ──────────────────────────────────────────────
  const statusBadge = saveStatus !== 'idle' ? html`<div style=${{position:'fixed',bottom:12,right:12,padding:'6px 14px',borderRadius:20,fontSize:11,fontWeight:600,zIndex:9999,
    background:saveStatus==='saving'?'rgba(0,170,210,.15)':saveStatus==='saved'?'rgba(14,122,78,.15)':'rgba(192,32,32,.15)',
    color:saveStatus==='saving'?'#00AAD2':saveStatus==='saved'?'#0E7A4E':'#C02020',
    border:'1px solid '+(saveStatus==='saving'?'rgba(0,170,210,.3)':saveStatus==='saved'?'rgba(14,122,78,.3)':'rgba(192,32,32,.3)'),
    transition:'all .3s'}}>
    ${saveStatus==='saving'?'☁ Synchronisation...':saveStatus==='saved'?'✓ Sauvegardé':'⚠ Erreur sync'}
  </div>` : null;

  // ── ERP ───────────────────────────────────────────────────────────────────
  return html`<div>
    ${statusBadge}
    <${ERP} user=${user} data=${data} setData=${setData} onLogout=${logout} DATA_KEY=${DATA_KEY} USER_KEY=${USER_KEY}/>
  </div>`;
},
        role: e.role||'tech',
        tel: e.tel||'',
        password: mkPass(e.nom),
        contrat: 'CDI',
        salaire: e.salaire||1200,
        embauche: new Date().toISOString().split('T')[0],
        conges_solde: 18,
      }));
      // Save immediately to localStorage then update state
      const newData = {...INIT, config:{...cfg, created:new Date().toISOString()}, employes:emps};
      try { localStorage.setItem(DATA_KEY, JSON.stringify(newData)); } catch(e){}
      setData(newData);
    }}/>`;
  }

  // ── LOGIN ─────────────────────────────────────────────────────────────────
  if(!user){
    return html`<${LoginPage} data=${data} onLogin=${login}/>`;
  }

  // ── ERP ───────────────────────────────────────────────────────────────────
  return html`<${ERP} user=${user} data=${data} setData=${setData} onLogout=${logout} DATA_KEY=${DATA_KEY} USER_KEY=${USER_KEY}/>`;
}

      <div style=${{width:192,background:'#fff',borderRight:'1px solid rgba(0,44,95,.07)',overflowY:'auto',flexShrink:0,padding:'6px 0'}}>
        ${nav.map(sec=>html`
          <div key=${sec.s}>
            <div style=${{fontSize:9,fontWeight:700,color:'#B0BBC8',padding:'10px 14px 3px',textTransform:'uppercase',letterSpacing:'.12em'}}>${sec.s}</div>
            ${sec.it.map(item=>{
              const act=page===item.id&&!otId,badge=item.b?gb(item.b):0;
              return html`
                <div key=${item.id} onClick=${()=>go(item.id)}
                  style=${{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',cursor:'pointer',fontSize:12,color:act?'#002C5F':'#5A6478',borderRadius:9,margin:'1px 6px',background:act?'#EAF1FD':'transparent',fontWeight:act?700:400}}>
                  <span style=${{fontSize:13,width:18,textAlign:'center',flexShrink:0}}>${item.i}</span>

}

// -- STATUS COLORS -----------------------------------------
const ST={
  diagnostic:   {bg:'#EAF1FD',col:'#1255A0',l:'🔍 Diagnostic',ord:1},
  a_devis:      {bg:'#FDF3E3',col:'#9A5F00',l:'📋 À devis',ord:2},
  devis_envoye: {bg:'#FEF9EC',col:'#7A5800',l:'📝 Devis envoyé',ord:3},
  en_cours:     {bg:'#E8F4FD',col:'#0066CC',l:'🔧 En cours',ord:4},
  termine_tech: {bg:'#FDF3E3',col:'#9A5F00',l:'⏳ À valider CA',ord:5},
  valide_ca:    {bg:'#E6F4EE',col:'#0E7A4E',l:'✅ Validé CA',ord:6},
  facture:      {bg:'#F0EEFF',col:'#5B4FC9',l:'🧾 Facturé',ord:7},
  ouvert:       {bg:'#F0F2F5',col:'#8A99AA',l:'En attente',ord:0},
  approuve:     {bg:'#E6F4EE',col:'#0E7A4E',l:'✓ Approuvé',ord:4},
};

// -- DASHBOARD ---------------------------------------------
function Dashboard({user,data,setData,go,openOT}){
  const pending=data.alertes.filter(a=>a.statut==='pending');
  const low=data.pieces.filter(p=>p.stock<=p.min);
  const myOTs=user.role==='tech'?data.ots.filter(o=>o.tech_id===user.id):data.ots;
  const now=new Date();
  const todayStr=now.toISOString().split('T')[0];
  const currentMonth=now.toISOString().slice(0,7);
  const resolve=(id,dec)=>setData(d=>({...d,alertes:d.alertes.map(a=>a.id===id?{...a,statut:dec}:a)}));

  // ── REAL FINANCIAL CALCULATIONS ──────────────────────────
  const factures=data.factures||[];
  const caisse=data.caisse||[];
  const bcs=data.bcs||[];
  const ventes=data.ventes||[];
  const avances=data.avances||[];
  const paiementsComm=data.paiements_comm||[];
  const facturesBYD=data.factures_byd||[];

  // Revenue: only from paid invoices (encaissé = réel)
  const facPayees=factures.filter(f=>f.statut==='payee'&&f.type!=='avoir');
  const facPayeesMois=facPayees.filter(f=>(f.paye_le||f.date).startsWith(currentMonth));
  const facPayeesAujourdhui=facPayees.filter(f=>(f.paye_le||f.date).startsWith(todayStr));

  const CA_mois=facPayeesMois.reduce((a,f)=>a+(f.ht||f.ttc/1.19),0);
  const CA_today=facPayeesAujourdhui.reduce((a,f)=>a+(f.ht||f.ttc/1.19),0);
  const TVA_mois=facPayeesMois.reduce((a,f)=>a+(f.tva||f.ttc-f.ttc/1.19),0);
  const TTC_mois=facPayeesMois.reduce((a,f)=>a+f.ttc,0);

  // Breakdown SAV vs Pieces
  const CA_mo=facPayeesMois.reduce((a,f)=>{
    const ot=data.ots.find(o=>o.id===f.ot_id);
    if(!ot)return a;
    const cf=calcF(ot,data.pieces);
    return a+cf.mn;
  },0);
  const CA_pieces=CA_mois-CA_mo;

  // Commissions BYD received this month
  const comm_byd_mois=facturesBYD.filter(f=>f.statut==='paye'&&(f.paye_le||f.date).startsWith(currentMonth)).reduce((a,f)=>a+f.montant,0);
  const comm_byd_total=facturesBYD.filter(f=>f.statut==='paye').reduce((a,f)=>a+f.montant,0);
  const comm_byd_attente=facturesBYD.filter(f=>f.statut==='en_attente').reduce((a,f)=>a+f.montant,0);

  // Total revenue (SAV + commissions BYD)
  const REVENU_TOTAL_MOIS=CA_mois+comm_byd_mois;

  // Charges: validated BCs non-piece this month
  const charges_mois=bcs.filter(b=>b.statut==='valide_compta'&&b.type!=='pieces'&&b.date.startsWith(currentMonth)).reduce((a,b)=>a+b.lignes.reduce((s,l)=>s+l.qte*l.prix,0),0);
  const achats_pieces_mois=bcs.filter(b=>b.statut==='valide_compta'&&b.type==='pieces'&&b.date.startsWith(currentMonth)).reduce((a,b)=>a+b.lignes.reduce((s,l)=>s+l.qte*l.prix,0),0);
  const masse_sal=data.employes.reduce((a,e)=>a+e.salaire,0);
  const charges_sociales=masse_sal*0.1957;
  const total_charges=charges_mois+achats_pieces_mois+masse_sal+charges_sociales;

  // Gross margin
  const RESULTAT_MOIS=REVENU_TOTAL_MOIS-total_charges;
  const MARGE_PCT=REVENU_TOTAL_MOIS>0?Math.round(RESULTAT_MOIS/REVENU_TOTAL_MOIS*100):0;

  // Cash position
  const caisse_entrees=caisse.filter(m=>m.type==='entree').reduce((a,m)=>a+m.montant,0);
  const caisse_sorties=caisse.filter(m=>m.type==='sortie').reduce((a,m)=>a+m.montant,0);
  const SOLDE_CAISSE=caisse_entrees-caisse_sorties;

  // Receivables (unpaid invoices)
  const CREANCES=factures.filter(f=>f.statut==='en_attente'&&f.type!=='avoir').reduce((a,f)=>a+f.ttc,0);
  const CREANCES_30J=factures.filter(f=>f.statut==='en_attente'&&f.type!=='avoir'&&(new Date()-new Date(f.date))/86400000>30).reduce((a,f)=>a+f.ttc,0);

  // Stock value
  const VALEUR_STOCK=data.pieces.reduce((a,p)=>a+p.stock*p.pa,0);

  // OTs stats today
  const ots_today=data.ots.filter(o=>o.created&&o.created.startsWith(todayStr));
  const ots_en_cours=data.ots.filter(o=>o.statut==='en_cours'||o.statut==='ouvert');
  const ots_factured_mois=data.ots.filter(o=>o.statut==='facture'&&(o.created||'').startsWith(currentMonth));

  // ── IT AUDIT CONTROLS ─────────────────────────────────────
  const auditAlerts=[];
  // 1. Factures without payment but OT is facture
  const facSansOT=factures.filter(f=>f.type!=='avoir'&&f.ot_id&&!data.ots.find(o=>o.id===f.ot_id));
  if(facSansOT.length>0) auditAlerts.push({level:'error',msg:facSansOT.length+' facture(s) sans OT associé — risque intégrité données'});
  // 2. OT valide_ca without invoice
  const otsSansFacture=data.ots.filter(o=>o.statut==='valide_ca'&&!data.factures.find(f=>f.ot_id===o.id));
  if(otsSansFacture.length>0) auditAlerts.push({level:'warn',msg:otsSansFacture.length+' OT(s) validés CA sans facture générée'});
  // 3. Caisse imbalance check
  const caisse_from_fac=facPayees.reduce((a,f)=>a+f.ttc,0);
  const caisse_entrees_fac=caisse.filter(m=>m.type==='entree'&&m.lib.startsWith('Enc')).reduce((a,m)=>a+m.montant,0);
  // 4. BCs pending for more than 7 days
  const bcVieux=bcs.filter(b=>b.statut==='pending'&&(new Date()-new Date(b.date))/86400000>7);
  if(bcVieux.length>0) auditAlerts.push({level:'warn',msg:bcVieux.length+' BC(s) en attente de validation DG depuis plus de 7 jours'});
  // 5. Avances not decaissed
  const avancesNonDec=avances.filter(a=>a.statut==='approved'&&!a.decaisse);
  if(avancesNonDec.length>0) auditAlerts.push({level:'info',msg:avancesNonDec.length+' avance(s) approuvée(s) non encore décaissée(s) — voir Caisse'});
  // 6. Creances > 30j
  if(CREANCES_30J>0) auditAlerts.push({level:'warn',msg:'Créances > 30 jours : '+CREANCES_30J.toFixed(3)+' DT — relance client requise'});

  if(user.role!=='dg') return html`<div>
    <div style=${{background:'linear-gradient(135deg,#002C5F,#003d80)',borderRadius:14,padding:'14px 18px',marginBottom:14,display:'flex',alignItems:'center',gap:14}}>
      <div style=${{width:44,height:44,borderRadius:12,background:user.color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13,flexShrink:0}}>${user.initials}</div>
      <div style=${{flex:1}}>
        <div style=${{fontSize:16,fontWeight:700,color:'#fff'}}>Bonjour, ${(getLiveUsers().find(u=>u.id===user.id)||user).name}</div>
        <div style=${{fontSize:11,color:'rgba(255,255,255,.45)',marginTop:2}}>${pending.length>0?html`<span style=${{color:'#FF8080'}}>⚡ ${pending.length} en attente - </span>`:''} ${myOTs.length} OT${myOTs.length>1?'s':''}</div>
      </div>
      <div style=${{textAlign:'right'}}><div style=${{fontSize:22,fontWeight:700,color:'#00AAD2'}}>${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div><div style=${{fontSize:10,color:'rgba(255,255,255,.3)',marginTop:2}}>${now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div>
    </div>
    <div class="kg k3" style=${{marginBottom:14}}>
      <div class="kp" style=${{borderTopColor:'#00AAD2'}}><div class="kl">En cours</div><div class="kv" style=${{color:'#00AAD2'}}>${ots_en_cours.length}</div></div>
      <div class="kp" style=${{borderTopColor:'#9A5F00'}}><div class="kl">A valider CA</div><div class="kv" style=${{color:'#9A5F00'}}>${data.ots.filter(o=>o.statut==='termine_tech').length}</div></div>
      <div class="kp" style=${{borderTopColor:'#0E7A4E'}}><div class="kl">Factures du jour</div><div class="kv" style=${{color:'#0E7A4E'}}>${CA_today.toFixed(3)} DT</div></div>
    </div>
    ${pending.length>0&&html`<div class="ca" style=${{marginBottom:14,border:'1.5px solid rgba(226,75,74,.3)'}}>
      <div class="ch"><span style=${{fontSize:11,fontWeight:700,color:'#C02020',textTransform:'uppercase',letterSpacing:'.08em'}}>Validations requises</span></div>
      ${pending.map(a=>html`<div key=${a.id} style=${{display:'flex',alignItems:'center',gap:10,padding:'8px 14px',borderBottom:'1px solid rgba(0,44,95,.05)'}}>
        <div class="dot" style=${{background:a.type==='remise'?'#9A5F00':'#C02020'}}/>
        <div style=${{flex:1}}><div style=${{fontSize:12,fontWeight:700}}>${a.titre}</div><div style=${{fontSize:11,color:'#8A99AA'}}>${a.msg}</div></div>
      </div>`)}
    </div>`}
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      <div class="ca"><div class="ch"><span class="ct">OTs du jour</span><button class="btn bg bsm" onClick=${()=>go('ot')}>Tous →</button></div>
        ${myOTs.slice(0,5).map(ot=>{const cl=data.clients.find(c=>c.id===ot.client_id);const vh=data.vehicules.find(v=>v.id===ot.vehicule_id);const cs=ST[ot.statut]||{bg:'#F0F2F5',col:'#8A99AA',l:ot.statut};const done=ot.taches.filter(t=>t.fait).length;return html`<div key=${ot.id} class="li" onClick=${()=>openOT(ot.id)}><div style=${{width:30,height:30,borderRadius:8,background:cs.col,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,flexShrink:0}}>${ot.id.slice(-3)}</div><div style=${{flex:1,minWidth:0}}><div style=${{fontSize:11,fontWeight:700,color:'#002C5F'}}>${ot.id} - ${vh?.modele}</div><div style=${{fontSize:10,color:'#8A99AA'}}>${cl?.nom}</div><div class="pb"><div class="pf" style=${{width:Math.round(done/(ot.taches.length||1)*100)+'%',background:done===ot.taches.length?'#0E7A4E':'#00AAD2'}}/></div></div><span class="tag" style=${{background:cs.bg,color:cs.col,fontSize:9}}>${cs.l}</span></div>`;})}</div>
      <div class="ca"><div class="ch"><span class="ct">Stock OEM</span><button class="btn bg bsm" onClick=${()=>go('st')}>Stock →</button></div>
        ${low.length===0?html`<div style=${{padding:'12px 14px',fontSize:12,color:'#0E7A4E'}}>Tous les stocks OK</div>`:low.slice(0,4).map(p=>html`<div key=${p.id} class="li"><div class="dot" style=${{background:p.stock===0?'#C02020':'#9A5F00'}}/><div style=${{flex:1}}><div style=${{fontSize:12,fontWeight:600}}>${p.nom}</div><div style=${{fontSize:10,color:'#8A99AA',fontFamily:'monospace'}}>${p.ref}</div></div><span class="tag" style=${{background:p.stock===0?'#FDECEC':'#FDF3E3',color:p.stock===0?'#C02020':'#9A5F00',fontSize:9}}>${p.stock}/${p.min}</span></div>`)}
      </div>
    </div>
  </div>`;

  // ── DG FULL FINANCIAL DASHBOARD ───────────────────────────
  return html`<div>
    <!-- Header -->
    <div style=${{background:'linear-gradient(135deg,#002C5F,#001F42)',borderRadius:14,padding:'14px 18px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
      <div style=${{width:44,height:44,borderRadius:12,background:'#C02020',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13,flexShrink:0}}>DG</div>
      <div style=${{flex:1}}>
        <div style=${{fontSize:16,fontWeight:700,color:'#fff'}}>Tableau de bord — ${(getLiveUsers().find(u=>u.id===user.id)||user).name}</div>
        <div style=${{fontSize:11,color:'rgba(255,255,255,.4)',marginTop:2}}>Données réelles • Mise à jour en temps réel • ${now.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
      <div style=${{textAlign:'right'}}>
        <div style=${{fontSize:22,fontWeight:700,color:'#00AAD2'}}>${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div>
        ${pending.length>0&&html`<div style=${{fontSize:10,color:'#FF8080',marginTop:2}}>⚡ ${pending.length} validation${pending.length>1?'s':''} en attente</div>`}
      </div>
    </div>

    <!-- IT AUDIT ALERTS -->
    ${auditAlerts.length>0&&html`<div class="ca" style=${{marginBottom:14,border:'1.5px solid rgba(226,75,74,.25)'}}>
      <div style=${{padding:'10px 14px',background:'rgba(192,32,32,.04)',borderBottom:'1px solid rgba(226,75,74,.15)'}}>
        <span style=${{fontSize:11,fontWeight:700,color:'#C02020',textTransform:'uppercase',letterSpacing:'.08em'}}>Controles Audit — ${auditAlerts.length} point${auditAlerts.length>1?'s':''}</span>
      </div>
      ${auditAlerts.map((a,i)=>html`<div key=${i} style=${{display:'flex',alignItems:'center',gap:10,padding:'7px 14px',borderBottom:'1px solid rgba(0,44,95,.04)'}}>
        <div style=${{width:7,height:7,borderRadius:'50%',background:a.level==='error'?'#C02020':a.level==='warn'?'#9A5F00':'#1255A0',flexShrink:0}}/>
        <div style=${{fontSize:12,color:a.level==='error'?'#C02020':a.level==='warn'?'#9A5F00':'#4A5568'}}>${a.msg}</div>
      </div>`)}
    </div>`}

    <!-- SECTION 1: P&L CE MOIS -->
    <div style=${{fontSize:11,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:10}}>Compte de résultat — ${now.toLocaleString('fr-FR',{month:'long',year:'numeric'})}</div>
    <div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:8}}>
      ${[
        {l:'CA SAV HT',v:CA_mois,c:'#0E7A4E',sub:'Encaissé réel',icon:'↑'},
        {l:'Comm. BYD reçues',v:comm_byd_mois,c:'#1255A0',sub:'Ventes véhicules',icon:'↑'},
        {l:'Charges totales',v:total_charges,c:'#C02020',sub:'Salaires + achats',icon:'↓'},
        {l:'Résultat net',v:RESULTAT_MOIS,c:RESULTAT_MOIS>=0?'#0E7A4E':'#C02020',sub:'Marge '+MARGE_PCT+'%',icon:RESULTAT_MOIS>=0?'✓':'⚠'},
      ].map(k=>html`<div key=${k.l} style=${{background:'#fff',border:'0.5px solid rgba(0,44,95,.1)',borderRadius:12,padding:'12px 14px',borderTop:'3px solid '+k.c}}>
        <div style=${{fontSize:10,color:'#8A99AA',marginBottom:4,textTransform:'uppercase',letterSpacing:'.06em'}}>${k.l}</div>
        <div style=${{fontSize:18,fontWeight:700,color:k.c}}>${Math.abs(k.v).toFixed(3)} DT</div>
        <div style=${{fontSize:10,color:'#8A99AA',marginTop:3}}>${k.icon} ${k.sub}</div>
      </div>`)}
    </div>

    <!-- Revenue bar -->
    ${REVENU_TOTAL_MOIS>0&&html`<div class="ca" style=${{padding:'12px 16px',marginBottom:12}}>
      <div style=${{fontSize:11,fontWeight:700,marginBottom:10}}>Decomposition du chiffre d'affaires</div>
      ${[
        {l:'MO Atelier',v:CA_mo,c:'#002C5F'},
        {l:'Pieces OEM',v:CA_pieces,c:'#00AAD2'},
        {l:'Comm. BYD',v:comm_byd_mois,c:'#0E7A4E'},
      ].map(item=>html`<div key=${item.l} style=${{display:'flex',alignItems:'center',gap:10,marginBottom:7}}>
        <div style=${{width:90,fontSize:11,color:'#4A5568',flexShrink:0}}>${item.l}</div>
        <div style=${{flex:1,height:16,background:'#F0F2F5',borderRadius:4,overflow:'hidden'}}>
          <div style=${{height:'100%',width:REVENU_TOTAL_MOIS>0?Math.round(item.v/REVENU_TOTAL_MOIS*100)+'%':'0%',background:item.c,borderRadius:4,transition:'width .5s'}}/>
        </div>
        <div style=${{width:90,fontSize:11,fontWeight:700,color:item.c,textAlign:'right'}}>${item.v.toFixed(3)} DT</div>
        <div style=${{width:35,fontSize:10,color:'#8A99AA',textAlign:'right'}}>${REVENU_TOTAL_MOIS>0?Math.round(item.v/REVENU_TOTAL_MOIS*100):0}%</div>
      </div>`)}
      <div style=${{borderTop:'1px solid rgba(0,44,95,.08)',paddingTop:8,marginTop:4,display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:700}}>
        <span>Total revenus</span><span style=${{color:'#002C5F'}}>${REVENU_TOTAL_MOIS.toFixed(3)} DT</span>
      </div>
    </div>`}

    <!-- SECTION 2: TRESORERIE & CREANCES -->
    <div style=${{fontSize:11,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:10}}>Trésorerie & Créances</div>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:12}}>
      <div style=${{background:'#fff',border:'0.5px solid rgba(0,44,95,.1)',borderRadius:12,padding:'14px 16px',borderTop:'3px solid #5B4FC9'}}>
        <div style=${{fontSize:10,color:'#8A99AA',marginBottom:4,textTransform:'uppercase',letterSpacing:'.06em'}}>Solde caisse</div>
        <div style=${{fontSize:22,fontWeight:700,color:SOLDE_CAISSE>=0?'#5B4FC9':'#C02020'}}>${SOLDE_CAISSE.toFixed(3)} DT</div>
        <div style=${{fontSize:10,color:'#8A99AA',marginTop:4}}>Entrees: ${caisse_entrees.toFixed(0)} — Sorties: ${caisse_sorties.toFixed(0)}</div>
      </div>
      <div style=${{background:'#fff',border:'0.5px solid rgba(0,44,95,.1)',borderRadius:12,padding:'14px 16px',borderTop:'3px solid '+(CREANCES>0?'#9A5F00':'#0E7A4E')}}>
        <div style=${{fontSize:10,color:'#8A99AA',marginBottom:4,textTransform:'uppercase',letterSpacing:'.06em'}}>Creances clients</div>
        <div style=${{fontSize:22,fontWeight:700,color:CREANCES>0?'#9A5F00':'#0E7A4E'}}>${CREANCES.toFixed(3)} DT</div>
        <div style=${{fontSize:10,color:CREANCES_30J>0?'#C02020':'#8A99AA',marginTop:4}}>
          ${CREANCES_30J>0?'⚠ '+CREANCES_30J.toFixed(3)+' DT > 30 jours':'Toutes recentes'}
        </div>
      </div>
      <div style=${{background:'#fff',border:'0.5px solid rgba(0,44,95,.1)',borderRadius:12,padding:'14px 16px',borderTop:'3px solid #1255A0'}}>
        <div style=${{fontSize:10,color:'#8A99AA',marginBottom:4,textTransform:'uppercase',letterSpacing:'.06em'}}>Comm. BYD en attente</div>

      </div>

    <div style=${{fontSize:11,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:10}}>Activite atelier & stock</div>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>

        <div class="ch"><span class="ct">OTs — Etat du parc</span><button class="btn bg bsm" onClick=${()=>go('ot')}>Voir →</button></div>
        <div style=${{padding:'8px 14px'}}>
          ${[

    ?pieces.filter(p=>!p.compatible_models||p.compatible_models.length===0||p.compatible_models.some(m=>m.toLowerCase()===vhModele.toLowerCase()))
    :pieces;

  const updLigne=(id,k,v)=>setLignes(ls=>ls.map(l=>{
    if(l.id!==id)return l;
    const u={...l,[k]:v};
    if(k==='piece_ref'&&v){
      const p=pieces.find(x=>x.ref===v);
      if(p){u.description=p.nom;u.pu=p.pv;}

  const addLigne=(type)=>{
    const rMo=accord?+(accord.remise_mo||0):0;

    <!-- Lignes devis -->

      <div class="ch">
        <span class="ct">Lignes du devis</span>

          </div>

          </div>
          <div style=${{paddingTop:18}}><button class="btn bd bsm" onClick=${()=>setLignes(ls=>ls.filter(x=>x.id!==l.id))} style=${{padding:'6px 8px'}}>✕</button></div>
        </div>`)}
      </div>
      <!-- Totaux -->
      <div style=${{borderTop:'2px solid #002C5F',margin:'0 12px 12px',paddingTop:8}}>
        ${[['HT',ht.toFixed(3)+' DT','#0D1829'],['TVA 19%',tva.toFixed(3)+' DT','#8A99AA'],['Timbre',TIMBRE_FISCAL.toFixed(3)+' DT','#9A5F00']].map(([l,v,c])=>html`

    <button class="btn bp" style=${{width:'100%',padding:14,fontSize:14,fontWeight:700}} onClick=${doSave}>
      ✓ Valider et envoyer le devis au client →

  </div>`;

function OTDetail({ot,data,setData,user,onBack}){
  const[tab,setTab]=useState('taches');
  const[caChecks,setCaChecks]=useState({});
  const[timer,setTimer]=useState(0);
  const[timerOn,setTimerOn]=useState(false);
  const[remisePct,setRemisePct]=useState('');
  const[decouverte,setDecouverte]=useState('');
  useEffect(()=>{if(tab==='validation'&&!timerOn)setTimerOn(true);},[tab]);
  useEffect(()=>{if(!timerOn)return;const t=setInterval(()=>setTimer(x=>x+1),1000);return()=>clearInterval(t);},[timerOn]);
  if(!ot)return html`<div style=${{padding:20,color:'#8A99AA'}}>OT introuvable</div>`;
  const cl=data.clients.find(c=>c.id===ot.client_id),vh=data.vehicules.find(v=>v.id===ot.vehicule_id),tech=USERS.find(u=>u.id===ot.tech_id);
  const done=ot.taches.filter(t=>t.fait).length,allDone=done===ot.taches.length;
  const clCount=Object.values(caChecks).filter(Boolean).length,canValidCA=clCount>=6&&timer>=10;
  // ── Workflow status flags ──────────────────────────────────────────────────
  const isValide   = ot.statut==='valide_ca'||ot.statut==='facture';
  const isDiag     = ot.statut==='diagnostic';
  const isADevis   = ot.statut==='a_devis';
  const isDevisEnv = ot.statut==='devis_envoye';
  const isEnCours  = ot.statut==='en_cours';

  // Devis accepté pour cet OT ?
  const devisAccepte=!!(data.devis||[]).find(d=>d.ot_id===ot.id&&d.statut==='accepte');

  // ── Role-based permissions ──────────────────────────────────────────────
  // CHEF: adds tasks+pieces during diagnostic, sends to SAV for devis, validates CA
  const isChefOrDG  = user.role==='chef'||can(user,'ALL');
  const isRecepOrDG = user.role==='reception'||can(user,'ALL');

  // Chef can edit tasks+pieces only during diagnostic
  const canEditDiag = isChefOrDG && isDiag;
  // Chef sends to SAV once diagnostic is done
  const canSendToSAV = isChefOrDG && isDiag;
  // Reception creates devis when OT is a_devis
  const canCreateDevis = isRecepOrDG && isADevis;
  // Reception marks client approval (after devis accepted)
  const canApprove = isRecepOrDG && isDevisEnv && devisAccepte;
  // Tech executes tasks only when en_cours
  const canToggle  = isEnCours && ((user.role==='tech'&&ot.tech_id===user.id)||isChefOrDG);
  // Chef validates CA
  const canCA      = isChefOrDG && ot.statut==='termine_tech';
  // Reception invoices only after valide_ca + devis accepted
  const canFacture = isValide && !ot.facture_id && devisAccepte;
  const cf=useMemo(()=>calcF(ot,data.pieces),[ot,data.pieces]);
  const cs=ST[ot.statut]||{bg:'#F0F2F5',col:'#8A99AA',l:ot.statut};

  const toggleTask=tId=>{
    if(!canToggle)return;
    setData(d=>({...d,ots:d.ots.map(o=>{
      if(o.id!==ot.id)return o;
      const taches=o.taches.map(t=>t.id===tId?{...t,fait:!t.fait,fait_le:!t.fait?new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):null}:t);
      // Only advance to termine_tech if all done, stay en_cours otherwise
      const newStatut=taches.every(t=>t.fait)?'termine_tech':'en_cours';
      return{...o,taches,statut:newStatut};
    })}));
  };

  // ── Chef: Diagnostic terminé → envoyer au SAV pour devis ─────────────────
  const doSendToSAV=()=>{
    if(ot.taches.length===0){alert('Ajoutez au moins une tâche avant d\'envoyer au SAV');return;}
    setData(d=>({...d,
      ots:d.ots.map(o=>o.id===ot.id?{...o,statut:'a_devis',diag_par:user.name,diag_le:new Date().toISOString()}:o),
      alertes:[{id:'AL'+Date.now(),type:'devis_requis',statut:'pending',ot_id:ot.id,titre:'Devis à créer — '+ot.id,msg:'Diagnostic terminé par '+user.name+' — '+ot.taches.length+' tâche(s), '+ot.taches.filter(t=>t.piece_ref).length+' pièce(s)',demande_par:user.name,demande_le:new Date().toISOString()},...(d.alertes||[])],
      audit:[{id:'AU'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'diagnostic_termine',module:'OT',detail:ot.id},...(d.audit||[])],
    }));
    alert('✓ Diagnostic envoyé au SAV. La réception va créer le devis.');
  };

  // ── Réception: Devis envoyé → en attente accord client ────────────────────
  const doSendDevis=()=>{
    genDevis();
    setData(d=>({...d,
      ots:d.ots.map(o=>o.id===ot.id?{...o,statut:'devis_envoye'}:o),
      audit:[{id:'AU'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'devis_envoye_client',module:'OT',detail:ot.id},...(d.audit||[])],
    }));
  };

  // ── Réception: Accord client → réserver pièces → lancer travaux ──────────
  const doApprouver=()=>{
    const pieceReservations=[];
    ot.taches.filter(t=>t.piece_ref).forEach(t=>{
      pieceReservations.push({id:'RES'+Date.now()+Math.random().toString(36).slice(2),ot_id:ot.id,task_id:t.id,piece_ref:t.piece_ref,qte:t.qte_piece||1,date:new Date().toISOString(),type:'reservation'});
    });
    const mvts=pieceReservations.map(r=>{
      const p=data.pieces.find(x=>x.ref===r.piece_ref);
      return{id:'MVT'+Date.now()+Math.random().toString(36).slice(2),ref:r.piece_ref,nom:p?.nom||r.piece_ref,type:'reservation',qte:r.qte,stock_avant:p?.stock||0,stock_apres:Math.max(0,(p?.stock||0)-r.qte),ot_id:ot.id,date:new Date().toISOString(),user:user.name,motif:'Réservé — accord client OT '+ot.id};
    });
    setData(d=>({...d,
      ots:d.ots.map(o=>o.id===ot.id?{...o,statut:'en_cours',approuve_le:new Date().toISOString(),approuve_par:user.name}:o),
      reservations:[...pieceReservations,...(d.reservations||[])],
      mouvements:[...mvts,...(d.mouvements||[])],
      audit:[{id:'AU'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'accord_client_pieces_reservees',module:'OT',detail:ot.id+' — '+pieceReservations.length+' pièce(s)'},...(d.audit||[])],
    }));
    alert('✓ Accord enregistré. '+pieceReservations.length+' pièce(s) réservée(s). Le technicien peut commencer.');
  };
  const doValidateCA=()=>{
    // Auto-deduct stock for all tasks that are done and have a piece_ref
    const mvts=[];
    const pieceUpdates={};
    ot.taches.filter(t=>t.fait&&t.piece_ref).forEach(t=>{
      const qte=t.qte_piece||1;
      pieceUpdates[t.piece_ref]=(pieceUpdates[t.piece_ref]||0)+qte;
    });
    setData(d=>{
      // Build movement records & updated pieces
      const newPieces=d.pieces.map(p=>{
        const qte=pieceUpdates[p.ref];
        if(!qte)return p;
        const newStock=Math.max(0,p.stock-qte);
        mvts.push({id:'MVT'+Date.now()+p.ref,piece_id:p.id,ref:p.ref,nom:p.nom,type:'sortie',qte,stock_avant:p.stock,stock_apres:newStock,motif:'OT validé CA — '+ot.id,date:new Date().toISOString(),user:user.name});
        return{...p,stock:newStock};
      });
      // Clear reservations for this OT (consumed)
      const remainingRes=(d.reservations||[]).filter(r=>r.ot_id!==ot.id);
      return{...d,
        ots:d.ots.map(o=>o.id===ot.id?{...o,statut:'valide_ca',valide_par:user.name,valide_le:new Date().toISOString()}:o),
        pieces:newPieces,
        reservations:remainingRes,
        mouvements:[...mvts,...(d.mouvements||[])],
        alertes:[{id:'A'+Date.now(),type:'info',titre:'Véhicule prêt — '+ot.id,msg:vh?.modele+' - '+cl?.nom+(Object.keys(pieceUpdates).length>0?' — '+Object.keys(pieceUpdates).length+' pièce(s) déduites du stock':''),statut:'info'},...d.alertes],
        audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'validation_ca_stock',module:'OT',detail:ot.id+' — '+Object.keys(pieceUpdates).length+' pièces déduites'},...(d.audit||[])],
      };
    });
    // Auto-draft BC for pieces that fall below minimum after deduction
    setTimeout(()=>{
      setData(d=>{
        const lowPieces=d.pieces.filter(p=>p.stock<=p.min&&pieceUpdates[p.ref]);
        if(lowPieces.length===0)return d;
        const bcDraft={
          id:'BC-DRAFT-'+Date.now(),
          date:new Date().toISOString().split('T')[0],
          fournisseur:'BYD TN (auto)',
          motif:'Réapprovisionnement auto — OT '+ot.id,
          type:'pieces',
          lignes:lowPieces.map(p=>({id:Date.now()+Math.random(),description:p.nom,piece_id:p.id,qte:Math.max(p.min*2-p.stock,1),prix:p.pa,prix_bc:p.pa})),
          statut:'pending',
          createur_id:user.id,
          createur:user.name,
          auto_draft:true,
        };
        return{...d,
          bcs:[bcDraft,...(d.bcs||[])],
          alertes:[{id:'A'+Date.now(),type:'stock',titre:'BC auto-créé — Stock critique après OT '+ot.id,msg:lowPieces.map(p=>p.ref+' ('+p.stock+'/'+p.min+')').join(', '),statut:'pending'},...d.alertes],
        };
      });
    },100);
  };
  const doRemise=()=>{
    if(!remisePct)return;
    const pct=parseInt(remisePct);
    const impact=(ot.mo_h*ot.mo_tarif*pct/100).toFixed(3);
    // SAV: create pending request — DG must approve before remise is applied
    setData(d=>({...d,alertes:[{
      id:'A'+Date.now(),
      type:'remise',
      ot_id:ot.id,
      remise_pct:pct,
      titre:'Demande remise '+pct+'% MO — '+ot.id,
      msg:user.name+' — '+cl?.nom+' — Impact: -'+impact+' DT',
      statut:'pending',
      demande_par:user.name,
      demande_le:new Date().toISOString(),
    },...d.alertes]}));
    alert('✓ Demande envoyée au DG — en attente d\'approbation. La remise sera appliquée uniquement après validation.');
    setRemisePct('');
  };
  const doDecouverte=()=>{
    if(!decouverte)return;
    setData(d=>({...d,ots:d.ots.map(o=>o.id===ot.id?{...o,decouverte}:o),alertes:[{id:'A'+Date.now(),type:'decouverte',titre:'Découverte — '+ot.id,msg:decouverte,statut:'pending'},...d.alertes]}));
    alert("✓ Signalé au Chef d Atelier");
  };
  // ── CRÉER DEVIS DEPUIS OT ───────────────────────────────────────────────
  const existingDevis=data.devis?.find(d=>d.ot_id===ot.id);
  // SAV opens devis creation form pre-filled with chef tasks
  const [showDevisForm,setShowDevisForm]=useState(false);
  const genDevis=()=>{ setShowDevisForm(true); };

  const genFac=()=>{
    // Anti-double-billing guard
    const alreadyFactured=data.factures.find(f=>f.ot_id===ot.id&&f.type!=='avoir');
    if(alreadyFactured){alert('⚠ Cet OT a déjà été facturé ('+alreadyFactured.id+'). Impossible de créer une seconde facture.');return;}
    if(ot.statut!=='valide_ca'){alert('⚠ L\'OT doit être validé par le Chef Atelier avant facturation.');return;}
    if(!devisAccepte){alert('⚠ Un devis accepté est requis avant facturation.');return;}
    const facId=genId('FAC-');
    const rc=data.config?.rc||'';
    const mf=data.config?.mf||'';
    const cl=data.clients?.find(c=>c.id===ot.client_id);
    const vh=data.vehicules?.find(v=>v.id===ot.vehicule_id);
    setData(d=>({...d,
      ots:d.ots.map(o=>o.id===ot.id?{...o,statut:'facture',facture_id:facId}:o),
      factures:[{
        id:facId,ot_id:ot.id,client_id:ot.client_id,vehicule_id:ot.vehicule_id,
        client_nom:cl?.nom||'',client_mf:cl?.mf||'',client_adresse:cl?.adresse||'',
        vehicule_immat:vh?.immat||'',vehicule_modele:(vh?.marque||'')+' '+(vh?.modele||''),
        garage_mf:mf,garage_rc:rc,
        date:new Date().toISOString().split('T')[0],
        ht:cf.ht,tva:cf.tva,ttc:cf.ttc,timbre:TIMBRE_FISCAL,
        statut:'en_attente',mode_paiement:'',type:'facture',
        facture_par:user.name,
      },...d.factures],
      audit:[{id:genId('AU-'),ts:new Date().toISOString(),user:user.name,role:user.role,action:'generation_facture',module:'Factures',detail:facId+' — OT '+ot.id+' — '+cf.ttc.toFixed(3)+' DT TTC'},...(d.audit||[])],
    }));
    alert('✓ Facture '+facId+' générée — '+cf.ttc.toFixed(3)+' DT TTC');
  };

  // ── COUT DE REVIENT ─────────────────────────────────────
  const calcCoutRevient=()=>{
    // 1. Cout main d'oeuvre au coût réel (salaire chargé / nb heures travaillées/mois)
    const techEmp=data.employes?.find(e=>e.id===ot.tech_id||(e.role==='tech'&&e.nom===tech?.name));
    const salaireMensuel=techEmp?.salaire||1500;
    const coutChargeHeure=((salaireMensuel*1.1957)/173).toFixed(3); // 173h = mois standard
    const coutMO=parseFloat(coutChargeHeure)*ot.mo_h;

    // 2. Cout pieces au prix d'achat (PA)
    const coutPieces=ot.taches.filter(t=>t.fait&&t.piece_ref).reduce((a,t)=>{
      const p=data.pieces.find(x=>x.ref===t.piece_ref);
      return a+(p?p.pa*(t.qte_piece||1):0);
    },0);

    // 3. Total cout de revient
    const coutTotal=coutMO+coutPieces;

    // 4. Prix de vente HT (ce qu'on facture)
    const prixVenteHT=cf.ht;

    // 5. Marge brute
    const marge=prixVenteHT-coutTotal;
    const margePct=prixVenteHT>0?Math.round(marge/prixVenteHT*100):0;

    return{coutChargeHeure:parseFloat(coutChargeHeure),coutMO,coutPieces,coutTotal,prixVenteHT,marge,margePct,techEmp,salaireMensuel};
  };
  const cr=calcCoutRevient();

  const accordClient=data.accords?.find(a=>a.client_id===ot.client_id&&a.actif);
  const canRequestRemise=(user.role==='reception'&&!accordClient&&!isValide)||(!isValide&&can(user,'ALL'));
  const remiseTabLabel=can(user,'ALL')?'Remise DG':'Demande remise';
  const TABS=[
    {id:'taches',l:'Tâches ('+done+'/'+ot.taches.length+')'},
    {id:'pieces',l:'Pièces OEM'},
    {id:'devis',l:existingDevis?'📝 Devis ✓':'📝 Devis'},
    {id:'facture',l:'Aperçu facture'},
    ...((can(user,'ALL')||user.role==='compta')?[{id:'cout',l:'Coût de revient'}]:[]),
    ...(canCA?[{id:'validation',l:'Validation CA'}]:[]),
    ...(isValide?[{id:'validation',l:'CA ✓'}]:[]),
    ...(canRequestRemise?[{id:'remise',l:remiseTabLabel}]:[]),
    ...(!isValide?[{id:'decouverte',l:'Découverte'}]:[]),
  ];

  // ── SAV Devis Creation Form (overlay) ─────────────────────────────────────
  if(showDevisForm){
    const accord=data.accords?.find(a=>a.client_id===ot.client_id&&a.actif);
    const initLignes=[
      {id:1,type:'mo',description:'Main d\'oeuvre',qte:ot.mo_h||1,pu:ot.mo_tarif||45,remise:ot.remise_mo||0,piece_ref:''},
      ...ot.taches.map((t,i)=>({id:i+2,type:'piece',description:t.lib,qte:1,pu:0,piece_ref:'',remise:ot.remise_pieces||0})),
    ];
    return html`<${DevisFormOT}
      ot=${ot} cl=${cl} vh=${vh}
      data=${data}
      initLignes=${initLignes}
      accord=${accord}
      user=${user}
      onSave=${(lignes,notes,validite)=>{
        const dvId='DEV-'+Date.now();
        const exp=new Date(); exp.setDate(exp.getDate()+validite);
        const ht=+lignes.reduce((a,l)=>a+(l.qte*(l.pu||0)*(1-(l.remise||0)/100)),0).toFixed(3);
        const tva=+(ht*0.19).toFixed(3);
        // Reserve pieces
        const pieceLines=lignes.filter(l=>l.piece_ref);
        const reservations=pieceLines.map(l=>({id:'RES'+Date.now()+Math.random().toString(36).slice(2),ot_id:ot.id,piece_ref:l.piece_ref,qte:l.qte,date:new Date().toISOString(),type:'reservation'}));
        const mvts=pieceLines.map(l=>{
          const p=data.pieces.find(x=>x.ref===l.piece_ref);
          return{id:'MVT'+Date.now()+Math.random().toString(36).slice(2),ref:l.piece_ref,nom:p?.nom||l.piece_ref,type:'reservation',qte:l.qte,stock_avant:p?.stock||0,stock_apres:Math.max(0,(p?.stock||0)-l.qte),ot_id:ot.id,date:new Date().toISOString(),user:user.name,motif:'Réservé pour devis '+dvId};
        });
        setData(d=>({...d,
          devis:[{id:dvId,ot_id:ot.id,or_id:ot.or_id,client_id:ot.client_id,vehicule_id:ot.vehicule_id,
            lignes,notes,date:new Date().toISOString().split('T')[0],
            expiration:exp.toISOString().split('T')[0],
            statut:'en_attente',createur:user.name,ht,tva,ttc:+(ht+tva+TIMBRE_FISCAL).toFixed(3),
          },...(d.devis||[])],
          ots:d.ots.map(o=>o.id===ot.id?{...o,devis_id:dvId,statut:'devis_envoye'}:o),
          reservations:[...reservations,...(d.reservations||[])],
          mouvements:[...mvts,...(d.mouvements||[])],
          audit:[{id:'AU'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'creation_devis_sav',module:'OT',detail:dvId+' — '+lignes.length+' lignes'},...(d.audit||[])],
        }));
        setShowDevisForm(false);
        alert('✓ Devis '+dvId+' créé et envoyé au client. OT passé en "Devis envoyé".');
      }}
      onCancel=${()=>setShowDevisForm(false)}
    />`;
  }

  return html`<div>
    <button class="btn bg" style=${{marginBottom:14}} onClick=${onBack}>← Retour</button>
    <div class="ca" style=${{marginBottom:12,padding:'14px 16px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:12}}>
        <div style=${{flex:1}}>
          <div style=${{fontSize:17,fontWeight:700}}>${ot.id} — ${vh?.marque} ${vh?.modele}</div>
          <div style=${{fontSize:12,color:'#8A99AA',marginTop:3}}>${cl?.nom} - ${vh?.immat} - Bay ${ot.bay||'?'} - ${tech?.name||'Non assigné'}</div>
        </div>
        <span class="tag" style=${{background:cs.bg,color:cs.col,fontSize:12,padding:'4px 12px'}}>${cs.l}</span>
      </div>
      ${cl?.type==='b2b'&&html`<div class="al ain" style=${{marginTop:10,marginBottom:0}}>🤝 Client B2B - Remises : -${ot.remise_mo||0}% MO - -${ot.remise_pieces||0}% pièces</div>`}
    </div>

    <!-- ── WORKFLOW STEPPER ──────────────────────────────────────────────── -->
    <div style=${{background:'#fff',border:'1px solid rgba(0,44,95,.08)',borderRadius:12,padding:'12px 16px',marginBottom:12,overflowX:'auto'}}>
      <div style=${{display:'flex',alignItems:'center',minWidth:580}}>
        ${(()=>{
          const STEPS=[
            {s:'diagnostic',   l:'Diagnostic', who:'Chef'},
            {s:'a_devis',      l:'À devis',    who:'SAV'},
            {s:'devis_envoye', l:'Devis envoyé',who:'SAV'},
            {s:'en_cours',     l:'En cours',   who:'Tech'},
            {s:'termine_tech', l:'Terminé',    who:'Chef'},
            {s:'valide_ca',    l:'Validé CA',  who:'Chef'},
            {s:'facture',      l:'Facturé',    who:'SAV'},
          ];
          const ORDER=STEPS.map(x=>x.s);
          const curIdx=ORDER.indexOf(ot.statut);
          return STEPS.map((step,i)=>{
            const cfg=ST[step.s]||{col:'#8A99AA'};
            const isCur=ot.statut===step.s;
            const isDone=curIdx>i;
            return html`<div key=${step.s} style=${{display:'flex',alignItems:'center',flex:1}}>
              <div style=${{textAlign:'center',flex:1,minWidth:60}}>
                <div style=${{width:26,height:26,borderRadius:'50%',margin:'0 auto 3px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800,
                  background:isCur?cfg.col:isDone?'#0E7A4E':'#E5E7EA',
                  color:isCur||isDone?'#fff':'#8A99AA',
                  boxShadow:isCur?'0 0 0 3px '+cfg.col+'40':'none'
                }}>${isDone?'✓':(i+1)}</div>
                <div style=${{fontSize:9,fontWeight:isCur?800:500,color:isCur?cfg.col:isDone?'#0E7A4E':'#8A99AA',lineHeight:1.2}}>${step.l}</div>
                <div style=${{fontSize:8,color:'#C8D0DA',marginTop:1}}>${step.who}</div>
              </div>
              ${i<6&&html`<div style=${{width:16,height:2,background:isDone?'#0E7A4E':'#E5E7EA',flexShrink:0,marginBottom:18}}/>`}
            </div>`;
          });
        })()}
      </div>
    </div>

    <!-- ── ACTION BANNER PER STATUS ────────────────────────────────────────── -->
    ${isDiag&&isChefOrDG&&html`
      <div class="ca" style=${{marginBottom:12,border:'2px solid #1255A0',overflow:'hidden'}}>
        <div style=${{background:'linear-gradient(135deg,#1255A0,#0066CC)',padding:'10px 16px',display:'flex',alignItems:'center',gap:10}}>
          <span style=${{fontSize:18}}>🔍</span>
          <div style=${{flex:1,color:'#fff'}}>
            <div style=${{fontSize:13,fontWeight:700}}>Phase diagnostic — Chef Atelier</div>
            <div style=${{fontSize:11,opacity:.8}}>Ajoutez les tâches et pièces nécessaires dans l'onglet Tâches, puis envoyez au SAV</div>
          </div>
        </div>
        <div style=${{padding:'10px 16px'}}>
          <button class="btn" style=${{background:'#1255A0',color:'#fff',width:'100%',padding:11,fontSize:13,fontWeight:700}}
            onClick=${doSendToSAV}>
            ✓ Diagnostic terminé — Envoyer au SAV pour devis →
          </button>
        </div>
      </div>`}

    ${isADevis&&isRecepOrDG&&html`
      <div class="ca" style=${{marginBottom:12,border:'2px solid #9A5F00',overflow:'hidden'}}>
        <div style=${{background:'linear-gradient(135deg,#9A5F00,#C07800)',padding:'10px 16px',display:'flex',alignItems:'center',gap:10}}>
          <span style=${{fontSize:18}}>📋</span>
          <div style=${{flex:1,color:'#fff'}}>
            <div style=${{fontSize:13,fontWeight:700}}>À traiter — Réception SAV</div>
            <div style=${{fontSize:11,opacity:.8}}>Diagnostic terminé par ${ot.diag_par||'le chef atelier'} — Créez et envoyez le devis au client</div>
          </div>
        </div>
        <div style=${{padding:'10px 16px'}}>
          <button class="btn" style=${{background:'#9A5F00',color:'#fff',width:'100%',padding:11,fontSize:13,fontWeight:700}}
            onClick=${doSendDevis}>
            📝 Générer le devis et l'envoyer au client →
          </button>
        </div>
      </div>`}

    ${isADevis&&!isRecepOrDG&&html`
      <div class="al awn" style=${{marginBottom:12}}>📋 Diagnostic terminé — En attente que le SAV génère le devis</div>`}

    ${isDevisEnv&&html`
      <div class="ca" style=${{marginBottom:12,border:'2px solid #7A5800',overflow:'hidden'}}>
        <div style=${{background:'linear-gradient(135deg,#7A5800,#9A6F00)',padding:'10px 16px',display:'flex',alignItems:'center',gap:10}}>
          <span style=${{fontSize:18}}>⏳</span>
          <div style=${{flex:1,color:'#fff'}}>
            <div style=${{fontSize:13,fontWeight:700}}>Devis envoyé — En attente accord client</div>
            <div style=${{fontSize:11,opacity:.8}}>Allez dans l'onglet 📝 Devis pour enregistrer la réponse du client</div>
          </div>
        </div>
        ${devisAccepte&&isRecepOrDG&&html`<div style=${{padding:'10px 16px'}}>
          <button class="btn bs" style=${{width:'100%',padding:11,fontSize:13,fontWeight:700}} onClick=${doApprouver}>
            ✓ Client a accepté — Réserver les pièces et lancer les travaux →
          </button>
        </div>`}
        ${!devisAccepte&&html`<div style=${{padding:'10px 14px',fontSize:11,color:'#7A5800'}}>
          Marquez l'accord dans l'onglet 📝 Devis, puis le bouton pour lancer les travaux apparaîtra ici.
        </div>`}
      </div>`}

    ${isEnCours&&html`<div class="al aok" style=${{marginBottom:12}}>✅ Accord client confirmé — Pièces réservées — Technicien en cours d'intervention</div>`}

    <div class="tb">${TABS.map(t=>html`<button key=${t.id} class=${`tbn${tab===t.id?' ac':''}`} onClick=${()=>setTab(t.id)}>${t.l}</button>`)}</div>

    ${tab==='taches'&&html`<div>
      <div class="ca" style=${{marginBottom:10,padding:'12px 16px',display:'flex',alignItems:'center',gap:14}}>

    carrosserie:{av_gauche:false,av_droit:false,ar_gauche:false,ar_droit:false,toit:false,capot:false,coffre:false,pare_brise:false},
    interieur:{propre:true,odeur:false,sieges_ok:true,tableau_bord_ok:true},

    notes_etat:'',
    photos_notes:'',
  });
  // Array-based damage state (synced with fiche.carrosserie)
  const[damage,setDamage]=useState([]);
  const isDamaged=(z)=>damage.includes(z);
  const toggleDamage=(zone)=>{
    setDamage(prev=>{
      const next=prev.includes(zone)?prev.filter(z=>z!==zone):[...prev,zone];
      setFiche(f=>({...f,carrosserie:{...f.carrosserie,[zone]:next.includes(zone)}}));
      return next;
    });
  };
  // ── Photo state ──────────────────────────────────────────────────────────
  const[orPhotos,setOrPhotos]=useState([]); // [{id,name,dataUrl,size,ts}]
  const[photoLoading,setPhotoLoading]=useState(false);

  const compressPhoto=(file,cb)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1200;
      let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.75);
      URL.revokeObjectURL(url);
      cb({id:'ph'+Date.now()+Math.random().toString(36).slice(2),name:file.name,dataUrl,size:Math.round(dataUrl.length*0.75/1024),ts:new Date().toISOString()});
    };
    img.src=url;
  };

  const addPhotos=(files)=>{
    setPhotoLoading(true);
    let pending=files.length;
    Array.from(files).forEach(f=>{
      compressPhoto(f,ph=>{
        setOrPhotos(prev=>[...prev,ph]);
        pending--;
        if(pending===0)setPhotoLoading(false);
      });
    });
  };

  const removePhoto=(id)=>setOrPhotos(prev=>prev.filter(p=>p.id!==id));

  const[err,setErr]=useState('');
  const[showNewCl,setShowNewCl]=useState(false);

  const vhc=form.client_id?data.vehicules.filter(v=>v.client_id===parseInt(form.client_id)):[];

  const createClient=()=>{
