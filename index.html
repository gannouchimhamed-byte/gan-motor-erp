function StockPage({data,setData,user}){
  const canCost=can(user,'ALL')||user.role==='compta'||user.role==='chef';
  const canEdit=can(user,'ALL')||user.role==='reception';
  const pieces=data.pieces||[];
  const low=pieces.filter(p=>p.stock<=p.min);

  const[tab,setTab]=useState('stock');
  const[sel,setSel]=useState(null);
  const[showAdd,setShowAdd]=useState(false);
  const[showFourn,setShowFourn]=useState(false);
  const[showNewPiece,setShowNewPiece]=useState(false);
  const[editPiece,setEditPiece]=useState(null);
  const[search,setSearch]=useState('');
  const[ajust,setAjust]=useState({type:'entree',qte:'',motif:'',piece_id:''});
  const[newFourn,setNewFourn]=useState({piece_id:'',nom:'',ref_fourn:'',pa:'',delai:'',principal:false});
  const[newPiece,setNewPiece]=useState({ref:'',nom:'',pa:'',pv:'',stock:'0',min:'2',oem:true,categorie:'',compatible_models:[]});
  const[invSession,setInvSession]=useState(null);
  const[invLignes,setInvLignes]=useState({});
  const[showRetour,setShowRetour]=useState(false);
  const[retourForm,setRetourForm]=useState({piece_id:'',qte:'1',or_id:'',motif:'Retour client',notes:''});
  const[reserveForm,setReserveForm]=useState({piece_id:'',qte:'1',ot_id:'',notes:''});
  const[showReserve,setShowReserve]=useState(false);
  const[editMin,setEditMin]=useState(null);
  const[editMinVal,setEditMinVal]=useState('');

  const MOTIFS_ECART=['Casse deterioration','Vol disparition','Erreur comptage','Retour client non enregistre','Consommation interne','Erreur reception BC','Autre'];
  const CATEGORIES=['Filtration','Freinage','Distribution','Huiles Fluides','Electricite','Carrosserie','Pneumatiques','Suspension','Transmission','Refroidissement','Autre'];

  const mouvements=data.mouvements||[];
  const fournisseurs=data.fournisseurs||[];
  const reservations=data.reservations||[];

  // Quick search filter
  const filteredPieces=search.trim()
    ?pieces.filter(p=>p.ref.toLowerCase().includes(search.toLowerCase())||p.nom.toLowerCase().includes(search.toLowerCase()))
    :pieces;

  // Stock disponible (total - reservé)
  const stockDispo=(pieceId)=>{
    const p=pieces.find(x=>x.id===pieceId);
    if(!p)return 0;
    // Support both old (piece_id+statut=active) and new (piece_ref) reservation formats
    const res=reservations.filter(r=>
      (r.piece_id===pieceId&&r.statut==='active')||
      (r.piece_ref===p.ref&&r.type!=='consomme')
    ).reduce((a,r)=>a+r.qte,0);
    return Math.max(0,p.stock-res);
  };
  const stockDispoByRef=(ref)=>{
    const p=pieces.find(x=>x.ref===ref);
    return p?stockDispo(p.id):0;
  };

  const CATEGORIES_LIST=CATEGORIES;

  const doAjust=()=>{
    if(!ajust.piece_id||!ajust.qte||!ajust.motif){alert('Tous les champs requis');return;}
    const p=pieces.find(x=>x.id===ajust.piece_id);
    if(!p)return;
    const qte=parseInt(ajust.qte);
    if(ajust.type==='sortie'&&p.stock<qte){alert('Stock insuffisant ('+p.stock+' disponible)');return;}
    const newStock=ajust.type==='entree'?p.stock+qte:p.stock-qte;
    const mvt={id:'MVT'+Date.now(),piece_id:p.id,ref:p.ref,nom:p.nom,type:ajust.type,qte,stock_avant:p.stock,stock_apres:newStock,motif:ajust.motif,date:new Date().toISOString(),user:user.name};
    setData(d=>({...d,pieces:d.pieces.map(x=>x.id===p.id?{...x,stock:newStock}:x),mouvements:[mvt,...(d.mouvements||[])]}));
    setAjust({type:'entree',qte:'',motif:'',piece_id:''});setShowAdd(false);
    alert('Mouvement enregistre. Nouveau stock: '+newStock);
  };

  const doFourn=()=>{
    if(!newFourn.piece_id||!newFourn.nom){alert('Piece et fournisseur requis');return;}
    const f={id:'F'+Date.now(),...newFourn,pa:parseFloat(newFourn.pa)||0,delai:parseInt(newFourn.delai)||7};
    setData(d=>({...d,fournisseurs:[f,...(d.fournisseurs||[])]}));
    setNewFourn({piece_id:'',nom:'',ref_fourn:'',pa:'',delai:'',principal:false});setShowFourn(false);
  };

  const savePiece=()=>{
    if(!newPiece.ref||!newPiece.nom||!newPiece.pa||!newPiece.pv){alert('Reference, designation, prix achat et prix vente requis');return;}
    const existing=pieces.find(p=>p.ref===newPiece.ref&&(!editPiece||p.id!==editPiece));
    if(existing){alert('Reference deja existante: '+newPiece.ref);return;}
    if(parseFloat(newPiece.pv)<=parseFloat(newPiece.pa)){if(!confirm('Prix vente inferieur ou egal au prix achat. Confirmer ?'))return;}
    if(editPiece){
      setData(d=>({...d,pieces:d.pieces.map(p=>p.id===editPiece?{...p,ref:newPiece.ref,nom:newPiece.nom,pa:parseFloat(newPiece.pa),pv:parseFloat(newPiece.pv),min:parseInt(newPiece.min)||2,oem:newPiece.oem,categorie:newPiece.categorie,compatible_models:newPiece.compatible_models}:p)}));
      alert('Piece modifiee');
    } else {
      const piece={id:'P'+Date.now(),ref:newPiece.ref,nom:newPiece.nom,pa:parseFloat(newPiece.pa),pv:parseFloat(newPiece.pv),stock:parseInt(newPiece.stock)||0,min:parseInt(newPiece.min)||2,oem:newPiece.oem,categorie:newPiece.categorie,compatible_models:newPiece.compatible_models||[]};
      const mvt=piece.stock>0?[{id:'MVT'+Date.now(),piece_id:piece.id,ref:piece.ref,nom:piece.nom,type:'entree',qte:piece.stock,stock_avant:0,stock_apres:piece.stock,motif:'Stock initial creation',date:new Date().toISOString(),user:user.name}]:[];
      setData(d=>({...d,pieces:[piece,...d.pieces],mouvements:[...mvt,...(d.mouvements||[])]}));
      alert('Piece creee: '+piece.nom);
    }
    setNewPiece({ref:'',nom:'',pa:'',pv:'',stock:'0',min:'2',oem:true,categorie:'',compatible_models:[]});
    setShowNewPiece(false);setEditPiece(null);
  };

  const startEditPiece=(p)=>{
    setNewPiece({ref:p.ref,nom:p.nom,pa:p.pa,pv:p.pv,stock:p.stock,min:p.min,oem:p.oem,categorie:p.categorie||'',compatible_models:p.compatible_models||[]});
    setEditPiece(p.id);setShowNewPiece(true);setShowAdd(false);setShowFourn(false);
    window.scrollTo(0,0);
  };

  // ── INVENTAIRE ──────────────────────────────────────────
  const demarrerInventaire=()=>{
    if(!confirm('Demarrer un inventaire physique ? Comptez chaque piece avant de saisir.'))return;
    const init={};
    pieces.forEach(p=>{init[p.id]={stock_reel:'',motif:'',motif_autre:''};});
    setInvLignes(init);
    setInvSession({date:new Date().toISOString(),par:user.name});
    setTab('inventaire');
  };

  const updateInvLigne=(id,val)=>setInvLignes(l=>({...l,[id]:val}));

  const validerInventaire=()=>{
    const comptes=pieces.map(p=>{
      const l=invLignes[p.id]||{};
      const reel=parseInt(l.stock_reel);
      if(isNaN(reel))return null;
      return{piece_id:p.id,ref:p.ref,nom:p.nom,stock_theorique:p.stock,stock_reel:reel,ecart:reel-p.stock,motif:l.motif||'',motif_autre:l.motif_autre||''};
    }).filter(Boolean);
    const avecEcart=comptes.filter(l=>l.ecart!==0);
    const manqueMotif=avecEcart.filter(l=>!l.motif);
    if(manqueMotif.length>0){alert('Motif obligatoire pour: '+manqueMotif.map(l=>l.ref).join(', '));return;}
    if(!confirm(comptes.length+' pieces comptees, '+avecEcart.length+' ecarts. Valider et ajuster le stock ?'))return;
    const ts=new Date().toISOString();
    const newMvts=avecEcart.map(l=>({id:'MVT'+Date.now()+Math.random(),piece_id:l.piece_id,ref:l.ref,nom:l.nom,type:l.ecart>0?'entree':'sortie',qte:Math.abs(l.ecart),stock_avant:l.stock_theorique,stock_apres:l.stock_reel,motif:'Inventaire — '+(l.motif==='Autre'?l.motif_autre:l.motif),inventaire_id:'INV-'+ts.slice(0,10),date:ts,user:user.name}));
    const inv={id:'INV-'+ts.slice(0,10),date:ts,par:user.name,total_comptes:comptes.length,total_ecarts:avecEcart.length,lignes:comptes,statut:'valide'};
    setData(d=>({...d,pieces:d.pieces.map(p=>{const l=comptes.find(x=>x.piece_id===p.id);return l?{...p,stock:l.stock_reel}:p;}),mouvements:[...newMvts,...(d.mouvements||[])],inventaires:[inv,...(d.inventaires||[])],audit:[{id:'A'+Date.now(),ts,user:user.name,role:user.role,action:'inventaire',module:'Stock',detail:inv.id+' '+comptes.length+' pieces '+avecEcart.length+' ecarts'},...(d.audit||[])]}));
    setInvSession(null);setInvLignes({});setTab('stock');
    alert('Inventaire valide! '+avecEcart.length+' ajustement(s) effectue(s)');
  };

  // ── RETOUR PIECE ─────────────────────────────────────────
  const doRetour=()=>{
    if(!retourForm.piece_id||!retourForm.qte){alert('Piece et quantite requises');return;}
    const p=pieces.find(x=>x.id===retourForm.piece_id);
    if(!p)return;
    const qte=parseInt(retourForm.qte)||1;
    const newStock=p.stock+qte;
    const mvt={id:'MVT'+Date.now(),piece_id:p.id,ref:p.ref,nom:p.nom,type:'entree',qte,stock_avant:p.stock,stock_apres:newStock,motif:'Retour client — '+retourForm.motif+(retourForm.or_id?' — OR: '+retourForm.or_id:''),notes:retourForm.notes,date:new Date().toISOString(),user:user.name};
    setData(d=>({...d,pieces:d.pieces.map(x=>x.id===p.id?{...x,stock:newStock}:x),mouvements:[mvt,...(d.mouvements||[])]}));
    setRetourForm({piece_id:'',qte:'1',or_id:'',motif:'Retour client',notes:''});setShowRetour(false);
    alert('Retour enregistre. Nouveau stock '+p.nom+': '+newStock+' u.');
  };

  // ── RESERVATION ──────────────────────────────────────────
  const doReserver=()=>{
    if(!reserveForm.piece_id||!reserveForm.ot_id){alert('Piece et OT requis');return;}
    const p=pieces.find(x=>x.id===reserveForm.piece_id);
    if(!p)return;
    const qte=parseInt(reserveForm.qte)||1;
    const dispo=stockDispo(reserveForm.piece_id);
    if(dispo<qte){alert('Stock disponible insuffisant: '+dispo+' u. (stock total: '+p.stock+', deja reserve: '+(p.stock-dispo)+')');return;}
    const r={id:'RES'+Date.now(),piece_id:reserveForm.piece_id,ot_id:reserveForm.ot_id,qte,notes:reserveForm.notes,date:new Date().toISOString(),par:user.name,statut:'active'};
    setData(d=>({...d,reservations:[r,...(d.reservations||[])]}));
    setReserveForm({piece_id:'',qte:'1',ot_id:'',notes:''});setShowReserve(false);
    alert('Piece reservee pour OT '+r.ot_id+' — Stock dispo restant: '+(dispo-qte));
  };

  const libererReservation=(id)=>{
    setData(d=>({...d,reservations:d.reservations.map(r=>r.id===id?{...r,statut:'liberee',liberee_le:new Date().toISOString()}:r)}));
  };

  const saveMin=(id)=>{
    const v=parseInt(editMinVal);
    if(isNaN(v)||v<0){alert('Valeur invalide');return;}
    setData(d=>({...d,pieces:d.pieces.map(p=>p.id===id?{...p,min:v}:p)}));
    setEditMin(null);setEditMinVal('');
  };

  return html`<div>
    <!-- Header -->
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div>
        <h2 style=${{fontSize:18,fontWeight:700}}>Stock OEM</h2>
        <p style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>${pieces.length} references — ${low.length} alertes — ${reservations.filter(r=>r.statut==='active').length} reservations actives</p>
      </div>
      <div style=${{display:'flex',gap:6,flexWrap:'wrap'}}>
        ${canEdit&&html`
          <button class="btn bg bsm" onClick=${()=>{setShowRetour(!showRetour);setShowAdd(false);setShowFourn(false);setShowNewPiece(false);setShowReserve(false);}}>Retour piece</button>
          <button class="btn bg bsm" onClick=${()=>{setShowReserve(!showReserve);setShowAdd(false);setShowFourn(false);setShowNewPiece(false);setShowRetour(false);}}>Reserver piece</button>
          <button class="btn bg bsm" onClick=${()=>{setShowFourn(!showFourn);setShowAdd(false);setShowNewPiece(false);setShowRetour(false);setShowReserve(false);}}>+ Fournisseur</button>
          <button class="btn bg bsm" onClick=${()=>{setShowAdd(!showAdd);setShowFourn(false);setShowNewPiece(false);setShowRetour(false);setShowReserve(false);}}>+ Mouvement</button>
          <button class="btn bg bsm" style=${{background:'#5B4FC9',color:'#fff',border:'none'}} onClick=${demarrerInventaire}>Inventaire physique</button>
          <button class="btn bp bsm" onClick=${()=>{setShowNewPiece(true);setShowAdd(false);setShowFourn(false);setEditPiece(null);setNewPiece({ref:'',nom:'',pa:'',pv:'',stock:'0',min:'2',oem:true,categorie:'',compatible_models:[]});setShowRetour(false);setShowReserve(false);}}>+ Nouvelle piece</button>`}
      </div>
    </div>

    <!-- Search bar -->
    <div style=${{position:'relative',marginBottom:12}}>
      <input value=${search} onInput=${e=>setSearch(e.target.value)} placeholder="Recherche rapide : reference OEM, designation..." style=${{width:'100%',padding:'9px 14px 9px 36px',border:'1.5px solid rgba(0,44,95,.15)',borderRadius:10,fontSize:13}}/>
      <span style=${{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#8A99AA',fontSize:14}}>🔍</span>
      ${search&&html`<button onClick=${()=>setSearch('')} style=${{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'#8A99AA',fontSize:16}}>✕</button>`}
    </div>
    ${search&&html`<div style=${{fontSize:11,color:'#1255A0',marginBottom:8,marginTop:-6}}>${filteredPieces.length} resultat(s) pour "${search}"</div>`}

    <!-- KPIs -->
    <div class="kg k4" style=${{marginBottom:12}}>
      <div class="kp" style=${{borderTopColor:'#002C5F'}}><div class="kl">References</div><div class="kv" style=${{color:'#002C5F'}}>${pieces.length}</div></div>
      <div class="kp" style=${{borderTopColor:'#C02020'}}><div class="kl">Alertes</div><div class="kv" style=${{color:'#C02020'}}>${low.length}</div></div>
      <div class="kp" style=${{borderTopColor:'#5B4FC9'}}><div class="kl">Reserves</div><div class="kv" style=${{color:'#5B4FC9'}}>${reservations.filter(r=>r.statut==='active').length}</div></div>
      ${canCost&&html`<div class="kp" style=${{borderTopColor:'#0E7A4E'}}><div class="kl">Valeur stock</div><div class="kv" style=${{color:'#0E7A4E',fontSize:13}}>${pieces.reduce((a,p)=>a+p.stock*p.pa,0).toFixed(0)} DT</div></div>`}
    </div>

    <!-- Retour piece form -->
    ${showRetour&&html`<div class="ca" style=${{marginBottom:12,border:'2px solid #9A5F00',padding:16}}>
      <div style=${{fontSize:13,fontWeight:700,color:'#9A5F00',marginBottom:12}}>Retour piece client</div>
      <div class="g2">
        <div class="fi"><label>Piece *</label>
          <select value=${retourForm.piece_id} onChange=${e=>setRetourForm({...retourForm,piece_id:e.target.value})}>
            <option value="">Selectionner...</option>
            ${pieces.map(p=>html`<option key=${p.id} value=${p.id}>${p.ref} — ${p.nom}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Quantite</label><input type="number" min="1" value=${retourForm.qte} onInput=${e=>setRetourForm({...retourForm,qte:e.target.value})}/></div>
        <div class="fi"><label>OR / Facture d origine</label>
          <select value=${retourForm.or_id} onChange=${e=>setRetourForm({...retourForm,or_id:e.target.value})}>
            <option value="">Optionnel...</option>
            ${(data.ors||[]).map(o=>html`<option key=${o.id} value=${o.id}>${o.id} — ${new Date(o.date).toLocaleDateString('fr-FR')}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Motif</label>
          <select value=${retourForm.motif} onChange=${e=>setRetourForm({...retourForm,motif:e.target.value})}>
            ${['Retour client','Piece non utilisee','Piece defectueuse','Mauvaise commande','Garantie'].map(m=>html`<option key=${m} value=${m}>${m}</option>`)}
          </select>
        </div>
      </div>
      <div class="fi"><label>Notes</label><input value=${retourForm.notes} onInput=${e=>setRetourForm({...retourForm,notes:e.target.value})} placeholder="Observations..."/></div>
      <div style=${{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button class="btn bg" onClick=${()=>setShowRetour(false)}>Annuler</button>
        <button class="btn bsm" style=${{background:'#9A5F00',color:'#fff',border:'none',padding:'8px 16px',borderRadius:8,cursor:'pointer'}} onClick=${doRetour}>Enregistrer retour</button>
      </div>
    </div>`}

    <!-- Reservation form -->
    ${showReserve&&html`<div class="ca" style=${{marginBottom:12,border:'2px solid #5B4FC9',padding:16}}>
      <div style=${{fontSize:13,fontWeight:700,color:'#5B4FC9',marginBottom:12}}>Reserver une piece pour un OT</div>
      <div class="g2">
        <div class="fi"><label>Piece *</label>
          <select value=${reserveForm.piece_id} onChange=${e=>setReserveForm({...reserveForm,piece_id:e.target.value})}>
            <option value="">Selectionner...</option>
            ${pieces.map(p=>{const dispo=stockDispo(p.id);return html`<option key=${p.id} value=${p.id} disabled=${dispo<=0}>${p.ref} — ${p.nom} (dispo: ${dispo}/${p.stock})</option>`;})}
          </select>
          ${reserveForm.piece_id&&html`<div style=${{fontSize:11,marginTop:3,color:'#5B4FC9'}}>Stock disponible: ${stockDispo(reserveForm.piece_id)} u.</div>`}
        </div>
        <div class="fi"><label>Quantite</label><input type="number" min="1" value=${reserveForm.qte} onInput=${e=>setReserveForm({...reserveForm,qte:e.target.value})}/></div>
        <div class="fi"><label>OT concerne *</label>
          <select value=${reserveForm.ot_id} onChange=${e=>setReserveForm({...reserveForm,ot_id:e.target.value})}>
            <option value="">Selectionner...</option>
            ${(data.ots||[]).filter(o=>o.statut!=='facture').map(o=>{const v=data.vehicules?.find(x=>x.id===o.vehicule_id);return html`<option key=${o.id} value=${o.id}>${o.id} — ${v?.modele||'?'}</option>`;})}</select>
        </div>
        <div class="fi"><label>Notes</label><input value=${reserveForm.notes} onInput=${e=>setReserveForm({...reserveForm,notes:e.target.value})} placeholder="Ex: Pour revision 90k..."/></div>
      </div>
      <div style=${{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button class="btn bg" onClick=${()=>setShowReserve(false)}>Annuler</button>
        <button class="btn bsm" style=${{background:'#5B4FC9',color:'#fff',border:'none',padding:'8px 16px',borderRadius:8,cursor:'pointer'}} onClick=${doReserver}>Reserver</button>
      </div>
    </div>`}

    <!-- Mouvement form -->
    ${showAdd&&html`<div class="ca" style=${{marginBottom:12,border:'2px solid #00AAD2',padding:16}}>
      <div class="g3">
        <div class="fi"><label>Type</label><select value=${ajust.type} onChange=${e=>setAjust({...ajust,type:e.target.value})}><option value="entree">Entree</option><option value="sortie">Sortie</option></select></div>
        <div class="fi"><label>Piece</label>
          <select value=${ajust.piece_id} onChange=${e=>setAjust({...ajust,piece_id:e.target.value})}>
            <option value="">Selectionner...</option>
            ${pieces.map(p=>html`<option key=${p.id} value=${p.id}>${p.ref} — ${p.nom} (${p.stock})</option>`)}
          </select>
        </div>
        <div class="fi"><label>Quantite</label><input type="number" min="1" value=${ajust.qte} onInput=${e=>setAjust({...ajust,qte:e.target.value})}/></div>
      </div>
      <div class="fi"><label>Motif *</label><input value=${ajust.motif} onInput=${e=>setAjust({...ajust,motif:e.target.value})} placeholder="Ajustement, casse, correction..."/></div>
      <div style=${{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button class="btn bg" onClick=${()=>setShowAdd(false)}>Annuler</button>
        <button class="btn bs" onClick=${doAjust}>Enregistrer</button>
      </div>
    </div>`}

    <!-- Fournisseur form -->
    ${showFourn&&html`<div class="ca" style=${{marginBottom:12,border:'2px solid #5B4FC9',padding:16}}>
      <div class="g2">
        <div class="fi"><label>Piece *</label>
          <select value=${newFourn.piece_id} onChange=${e=>setNewFourn({...newFourn,piece_id:e.target.value})}>
            <option value="">Selectionner...</option>
            ${pieces.map(p=>html`<option key=${p.id} value=${p.id}>${p.ref} — ${p.nom}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Nom fournisseur *</label><input value=${newFourn.nom} onInput=${e=>setNewFourn({...newFourn,nom:e.target.value})} placeholder="BYD TN, Autoparts..."/></div>
        <div class="fi"><label>Ref fournisseur</label><input value=${newFourn.ref_fourn} onInput=${e=>setNewFourn({...newFourn,ref_fourn:e.target.value})}/></div>
        <div class="fi"><label>PA fournisseur</label><input type="number" step="0.001" value=${newFourn.pa} onInput=${e=>setNewFourn({...newFourn,pa:e.target.value})}/></div>
        <div class="fi"><label>Delai livraison (j)</label><input type="number" value=${newFourn.delai} onInput=${e=>setNewFourn({...newFourn,delai:e.target.value})}/></div>
        <div class="fi" style=${{display:'flex',alignItems:'center',gap:8,paddingTop:20}}>
          <input type="checkbox" checked=${newFourn.principal} onChange=${e=>setNewFourn({...newFourn,principal:e.target.checked})} style=${{width:18,height:18}}/>
          <label style=${{textTransform:'none',letterSpacing:0,marginBottom:0,fontSize:12}}>Fournisseur principal</label>
        </div>
      </div>
      <div style=${{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button class="btn bg" onClick=${()=>setShowFourn(false)}>Annuler</button>
        <button class="btn bp" onClick=${doFourn}>Ajouter</button>
      </div>
    </div>`}

    <!-- Nouvelle piece form -->
    ${showNewPiece&&html`<div class="ca" style=${{marginBottom:12,border:'2px solid #002C5F',padding:16}}>
      <div style=${{fontSize:13,fontWeight:700,marginBottom:4,color:'#002C5F'}}>${editPiece?'Modifier la piece':'Nouvelle piece'}</div>
      <div class="g2">
        <div class="fi">
          <label>Reference OEM *</label>
          <input value=${newPiece.ref} onInput=${e=>setNewPiece({...newPiece,ref:e.target.value.toUpperCase()})} placeholder="26300-35503..." style=${{fontFamily:'monospace'}}/>
          ${newPiece.ref&&pieces.find(p=>p.ref===newPiece.ref&&(!editPiece||p.id!==editPiece))&&html`<div style=${{fontSize:10,color:'#C02020',marginTop:3}}>Reference deja existante</div>`}
        </div>
        <div class="fi"><label>Designation *</label><input value=${newPiece.nom} onInput=${e=>setNewPiece({...newPiece,nom:e.target.value})} placeholder="Filtre a huile BYD Atto 3..."/></div>
        <div class="fi">
          <label>Prix achat HT *</label>
          <input type="number" step="0.001" value=${newPiece.pa} onInput=${e=>setNewPiece({...newPiece,pa:e.target.value})}/>
        </div>
        <div class="fi">
          <label>Prix vente HT *</label>
          <input type="number" step="0.001" value=${newPiece.pv} onInput=${e=>setNewPiece({...newPiece,pv:e.target.value})}/>
          ${newPiece.pa&&newPiece.pv&&html`<div style=${{fontSize:10,marginTop:3,color:parseFloat(newPiece.pv)>parseFloat(newPiece.pa)?'#0E7A4E':'#C02020'}}>Marge: ${parseFloat(newPiece.pa)>0?Math.round((parseFloat(newPiece.pv)-parseFloat(newPiece.pa))/parseFloat(newPiece.pv)*100):0}%</div>`}
        </div>
        ${!editPiece&&html`<div class="fi"><label>Stock initial</label><input type="number" min="0" value=${newPiece.stock} onInput=${e=>setNewPiece({...newPiece,stock:e.target.value})}/></div>`}
        <div class="fi">
          <label>Seuil alerte min</label>
          <input type="number" min="0" value=${newPiece.min} onInput=${e=>setNewPiece({...newPiece,min:e.target.value})}/>
          <div style=${{fontSize:10,color:'#8A99AA',marginTop:2}}>Alerte si stock inferieur ou egal</div>
        </div>
        <div class="fi"><label>Categorie</label>
          <select value=${newPiece.categorie} onChange=${e=>setNewPiece({...newPiece,categorie:e.target.value})}>
            <option value="">Selectionner...</option>
            ${CATEGORIES.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}
          </select>
        </div>
        <div class="fi">

  const[recepForm,setRecepForm]=useState({});

  const isDG=can(user,'ALL');

  const ST2={
    pending:{c:'#9A5F00',bg:'#FDF3E3',l:'En attente DG'},
    valide:{c:'#1255A0',bg:'#EAF1FD',l:'Valide DG'},
    recu:{c:'#5B4FC9',bg:'#F0EEFF',l:'Recu SAV'},
    valide_compta:{c:'#0E7A4E',bg:'#E6F4EE',l:'Complet'},
    refuse:{c:'#C02020',bg:'#FDECEC',l:'Refuse'},
  };
  const BC_TYPES={
    pieces:{l:'Pieces OEM Stock',i:'P'},
    charges:{l:'Charges Fournitures',i:'C'},
    equipement:{l:'Equipement atelier',i:'E'},
    autre:{l:'Autre',i:'A'},
  };

  const addLigne=()=>setNewBC(b=>({...b,lignes:[...b.lignes,{id:Date.now(),description:'',piece_id:'',qte:1,prix:0}]}));
  const updLigne=(id,k,v)=>setNewBC(b=>({...b,lignes:b.lignes.map(l=>l.id===id?{...l,[k]:v}:l)}));
  const delLigne=id=>setNewBC(b=>({...b,lignes:b.lignes.filter(l=>l.id!==id)}));
  const totalNew=newBC.lignes.reduce((a,l)=>a+parseFloat(l.qte||0)*parseFloat(l.prix||0),0);

  const creerBC=()=>{
    if(!newBC.fournisseur){alert('Fournisseur requis');return;}
    if(!newBC.lignes[0]||!newBC.lignes[0].description){alert('Au moins une ligne requise');return;}
    const bc={id:'BC-'+Date.now(),date:new Date().toISOString().split('T')[0],fournisseur:newBC.fournisseur,motif:newBC.motif,type:newBC.type,lignes:newBC.lignes.map(l=>({...l,qte:parseFloat(l.qte)||1,prix:parseFloat(l.prix)||0,prix_bc:parseFloat(l.prix)||0,piece_id:l.piece_id||null})),statut:'pending',createur_id:user.id,createur:user.name};
    setData(d=>({...d,bcs:[bc,...(d.bcs||[])],alertes:[{id:'A'+Date.now(),type:'bc',titre:'Nouveau BC — '+bc.fournisseur,msg:user.name+' - '+(BC_TYPES[bc.type]?.l||'')+ ' - '+totalNew.toFixed(3)+' DT',statut:'pending'},...d.alertes],audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'creation_bc',module:'BC',detail:bc.id+' - '+bc.fournisseur},...(d.audit||[])]}));
    setNewBC({fournisseur:'',motif:'',type:'pieces',lignes:[{id:1,description:'',piece_id:'',qte:1,prix:0}]});
    setShowNew(false);
    alert('BC soumis au DG pour validation');
  };

  const valider=id=>{
    const bc=(data.bcs||[]).find(b=>b.id===id);
    if(!isDG){alert('Seul le DG peut valider');return;}
    if(bc.createur_id===user.id){alert('Separation des fonctions: vous avez cree ce BC');return;}
    setData(d=>({...d,bcs:d.bcs.map(b=>b.id===id?{...b,statut:'valide',valide_par:user.name,valide_le:new Date().toISOString()}:b)}));
    alert('BC valide — SAV peut receptionner');
  };

  const refuser=id=>{
    if(!isDG){alert('Seul le DG peut refuser');return;}
    if(!confirm('Refuser ce BC ?'))return;
    setData(d=>({...d,bcs:d.bcs.map(b=>b.id===id?{...b,statut:'refuse',refuse_par:user.name}:b)}));
  };

  const ouvrirReception=(bc)=>{
    if(user.role!=='reception'&&!isDG){alert('Seule la reception SAV peut receptionner');return;}
    const lignes=(bc.lignes||[]).map(l=>{
      const piece=(data.pieces||[]).find(p=>p.id===l.piece_id);
      return{piece_id:l.piece_id,piece_nom:piece?.nom||l.description||'—',piece_ref:piece?.ref||'',qte_bc:l.qte,qte_recue:l.qte,prix_bc:l.prix_bc||l.prix||0,ecart_note:''};
    });
    setRecepForm(f=>({...f,[bc.id]:{lignes,num_bl:'',num_fac_fourn:'',notes:''}}));
    setShowRecep(bc.id);
  };

  const confirmerReception=(id)=>{
    const bc=(data.bcs||[]).find(b=>b.id===id);
    const rf=recepForm[id];
    if(!rf){alert('Formulaire non initialise');return;}
    if(!rf.num_bl&&bc.type==='pieces'){alert('N° bon de livraison requis');return;}
    const hasEcart=rf.lignes.some(l=>parseInt(l.qte_recue)!==parseInt(l.qte_bc));
    if(hasEcart&&!confirm('Ecart detecte. Confirmer la reception avec ces ecarts ?'))return;
    setData(d=>({...d,bcs:d.bcs.map(b=>b.id===id?{...b,statut:'recu',recu_par:user.name,recu_le:new Date().toISOString(),num_bl:rf.num_bl,num_fac_fourn:rf.num_fac_fourn,notes_reception:rf.notes,lignes_recues:rf.lignes,has_ecart:hasEcart}:b),audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'reception_bc',module:'BC',detail:id+(hasEcart?' ECART':' conforme')},...(d.audit||[])]}));
    setShowRecep(null);
    alert('Reception enregistree. Le comptable peut valider.');
  };

  const validerC=id=>{
    const bc=(data.bcs||[]).find(b=>b.id===id);
    if(!isCompta&&!isDG){alert('Seul le comptable peut valider');return;}
    const lignesEffectives=bc.lignes_recues||bc.lignes||[];
    const total=lignesEffectives.reduce((a,l)=>a+(l.qte_recue||l.qte)*(l.prix_bc||l.prix||0),0);
    const newMvts=bc.type==='pieces'?lignesEffectives.filter(l=>(l.qte_recue||l.qte)>0).map(l=>{
      const piece=(data.pieces||[]).find(p=>p.id===l.piece_id);
      const qte=parseInt(l.qte_recue||l.qte);
      return{id:'MVT'+Date.now()+'-'+l.piece_id+'-'+Math.random(),piece_id:l.piece_id,ref:piece?.ref||'',nom:piece?.nom||l.piece_nom||l.description||'',type:'entree',qte,stock_avant:piece?.stock||0,stock_apres:(piece?.stock||0)+qte,motif:'Reception BC',bc_id:id,fournisseur:bc.fournisseur,num_bl:bc.num_bl||'',prix_achat:l.prix_bc||l.prix||0,valide_par:user.name,date:new Date().toISOString(),user:user.name};
    }):[];
    setData(d=>({...d,
      bcs:d.bcs.map(b=>b.id===id?{...b,statut:'valide_compta',valide_compta_par:user.name,valide_compta_le:new Date().toISOString()}:b),
      pieces:bc.type==='pieces'?d.pieces.map(p=>{
        const l=lignesEffectives.find(x=>x.piece_id===p.id);
        const qte=l?parseInt(l.qte_recue||l.qte):0;
        const newPa=l&&(l.prix_bc||l.prix)&&(l.prix_bc||l.prix)!==p.pa?(l.prix_bc||l.prix):p.pa;
        return l&&qte>0?{...p,stock:p.stock+qte,pa:newPa}:p;
      }):d.pieces,
      mouvements:[...newMvts,...(d.mouvements||[])],
      caisse:bc.type!=='pieces'?[{id:'CM'+Date.now(),date:new Date().toISOString(),type:'sortie',montant:total,lib:'BC '+id+' - '+bc.fournisseur,createur:user.name},...(d.caisse||[])]:d.caisse,
      audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'validation_compta_bc',module:'BC',detail:id+' - '+(bc.type==='pieces'?newMvts.length+' mvts':total.toFixed(3)+' DT')},...(d.audit||[])]
    }));
    alert('Validation comptable OK. '+(bc.type==='pieces'?newMvts.length+' mouvement(s) stock crees':'Sortie caisse enregistree'));
  };

  const bcs=data.bcs||[];
  const pending=bcs.filter(b=>b.statut==='pending');

  const RecepModal=({bc})=>{
    const rf=recepForm[bc.id]||{lignes:[],num_bl:'',num_fac_fourn:'',notes:''};
    const hasEcart=rf.lignes.some(l=>parseInt(l.qte_recue||0)!==parseInt(l.qte_bc));
    const totalRecu=rf.lignes.reduce((a,l)=>a+(parseInt(l.qte_recue||0))*(l.prix_bc||0),0);
    const totalBC=bc.lignes?.reduce((a,l)=>a+l.qte*l.prix,0)||0;
    return html`<div style=${{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.5)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style=${{background:'#fff',borderRadius:14,width:'100%',maxWidth:680,maxHeight:'88vh',overflow:'auto'}}>
        <div style=${{background:'linear-gradient(135deg,#002C5F,#003d80)',padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style=${{fontSize:9,fontWeight:700,color:'#00AAD2',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:2}}>RECEPTION SAV</div>
            <div style=${{fontSize:14,fontWeight:700,color:'#fff'}}>${bc.id} — ${bc.fournisseur}</div>
          </div>
          <button class="btn bsm" style=${{background:'rgba(255,255,255,.15)',color:'#fff',border:'none'}} onClick=${()=>setShowRecep(null)}>Annuler</button>
        </div>
        <div style=${{padding:16}}>
          <div class="g2" style=${{marginBottom:12}}>
            <div class="fi"><label>N° Bon de livraison *</label><input value=${rf.num_bl} onInput=${e=>setRecepForm(f=>({...f,[bc.id]:{...rf,num_bl:e.target.value}}))} placeholder="BL-2026-XXXX"/></div>
            <div class="fi"><label>N° Facture fournisseur</label><input value=${rf.num_fac_fourn} onInput=${e=>setRecepForm(f=>({...f,[bc.id]:{...rf,num_fac_fourn:e.target.value}}))} placeholder="FAC-XXXX"/></div>
          </div>
          <div style=${{fontSize:11,fontWeight:700,color:'#4A5568',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Verification piece par piece</div>
          ${rf.lignes.map((l,i)=>{
            const ecart=parseInt(l.qte_bc)-parseInt(l.qte_recue||0);
            const conforme=ecart===0;
            return html`<div key=${i} style=${{border:'1.5px solid '+(conforme?'rgba(0,44,95,.1)':'#E24B4A'),borderRadius:10,padding:12,marginBottom:8,background:conforme?'#fff':'#FEEBEB'}}>
              <div style=${{display:'flex',alignItems:'center',gap:12}}>
                <div style=${{flex:1}}>
                  <div style=${{fontSize:12,fontWeight:700}}>${l.piece_nom}</div>
                  ${l.piece_ref&&html`<div style=${{fontSize:10,fontFamily:'monospace',color:'#00AAD2'}}>${l.piece_ref}</div>`}
                </div>
                <div style=${{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
                  <div style=${{textAlign:'center'}}><div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',marginBottom:2}}>Commande</div><div style=${{fontSize:15,fontWeight:700,color:'#002C5F'}}>${l.qte_bc}</div></div>
                  <div style=${{color:'#8A99AA'}}>→</div>
                  <div style=${{textAlign:'center'}}><div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',marginBottom:2}}>Recu</div>
                    <input type="number" min="0" value=${l.qte_recue} onInput=${e=>{const nl=[...rf.lignes];nl[i]={...nl[i],qte_recue:e.target.value};setRecepForm(f=>({...f,[bc.id]:{...rf,lignes:nl}}));}} style=${{width:55,textAlign:'center',fontSize:15,fontWeight:700,border:'2px solid '+(conforme?'rgba(0,44,95,.15)':'#E24B4A'),borderRadius:6,padding:'3px',color:conforme?'#0E7A4E':'#C02020'}}/>
                  </div>
                  ${!conforme&&html`<div style=${{background:'#C02020',color:'#fff',fontSize:10,fontWeight:700,padding:'3px 7px',borderRadius:6}}>${ecart>0?'-'+ecart:'+'+Math.abs(ecart)}</div>`}
                </div>
              </div>
              ${!conforme&&html`<div class="fi" style=${{marginTop:6,marginBottom:0}}>
                <label style=${{fontSize:10,color:'#C02020'}}>Motif ecart</label>
                <input value=${l.ecart_note||''} onInput=${e=>{const nl=[...rf.lignes];nl[i]={...nl[i],ecart_note:e.target.value};setRecepForm(f=>({...f,[bc.id]:{...rf,lignes:nl}}));}} placeholder="Rupture, colis endommage..."/>
              </div>`}
            </div>`;
          })}
          <div class="g2" style=${{margin:'10px 0'}}>
            <div style=${{textAlign:'center',padding:10,background:'#F7F9FC',borderRadius:8}}>
              <div style=${{fontSize:10,color:'#8A99AA',marginBottom:3}}>Total commande</div>
              <div style=${{fontSize:16,fontWeight:700,color:'#002C5F'}}>${totalBC.toFixed(3)} DT</div>
            </div>
            <div style=${{textAlign:'center',padding:10,background:hasEcart?'#FEEBEB':'#E6F4EE',borderRadius:8,border:'1px solid '+(hasEcart?'#F7C1C1':'#9FE1CB')}}>
              <div style=${{fontSize:10,color:'#8A99AA',marginBottom:3}}>Total recu</div>
              <div style=${{fontSize:16,fontWeight:700,color:hasEcart?'#C02020':'#0E7A4E'}}>${totalRecu.toFixed(3)} DT</div>
            </div>
          </div>
          <div class="fi"><label>Observations</label><textarea rows="2" value=${rf.notes} onInput=${e=>setRecepForm(f=>({...f,[bc.id]:{...rf,notes:e.target.value}}))} placeholder="Colis OK, livraison partielle..."/></div>
          <div style=${{display:'flex',gap:8,justifyContent:'flex-end',marginTop:10}}>
            <button class="btn bg" onClick=${()=>setShowRecep(null)}>Annuler</button>
            <button class="btn bs" style=${{background:'#002C5F'}} onClick=${()=>confirmerReception(bc.id)}>${hasEcart?'Confirmer avec ecarts':'Confirmer — Tout conforme'}</button>
          </div>
        </div>
      </div>
    </div>`;
  };

  return html`<div>
    ${showRecep&&bcs.find(b=>b.id===showRecep)&&html`<${RecepModal} bc=${bcs.find(b=>b.id===showRecep)}/>`}
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div>
        <h2 style=${{fontSize:18,fontWeight:700}}>Bons de Commande</h2>
        <p style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>${bcs.length} BCs — ${pending.length} en attente DG</p>
      </div>
      ${canCreate&&html`<button class="btn bp bsm" onClick=${()=>setShowNew(!showNew)}>+ Nouveau BC</button>`}
    </div>

    <div class="al ain" style=${{marginBottom:12,fontSize:11}}>
      Regle 3 documents: BC cree → Validation DG → Reception SAV (verification) → Validation comptable → Stock mis a jour. Le createur ne peut pas valider son propre BC.
    </div>

    ${showNew&&html`<div class="ca" style=${{marginBottom:14,border:'2px solid #002C5F',padding:16}}>
      <div style=${{fontSize:14,fontWeight:700,marginBottom:12}}>Nouveau Bon de Commande</div>
      <div class="g2" style=${{marginBottom:10}}>
        <div class="fi"><label>Fournisseur *</label><input value=${newBC.fournisseur} onInput=${e=>setNewBC({...newBC,fournisseur:e.target.value})} placeholder="Nom du fournisseur..."/></div>
        <div class="fi"><label>Type</label>
          <select value=${newBC.type} onChange=${e=>setNewBC({...newBC,type:e.target.value})}>
            ${Object.entries(BC_TYPES).map(([k,v])=>html`<option key=${k} value=${k}>${v.i} ${v.l}</option>`)}
          </select>
        </div>
        <div class="fi" style=${{gridColumn:'1/-1'}}><label>Motif / Justification</label><input value=${newBC.motif} onInput=${e=>setNewBC({...newBC,motif:e.target.value})} placeholder="Ex: Demande SAV, rupture stock filtre..."/></div>
      </div>
      <div style=${{fontSize:11,fontWeight:700,color:'#4A5568',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Lignes</div>
      ${newBC.lignes.map((l,i)=>html`
        <div key=${l.id} style=${{display:'grid',gridTemplateColumns:'2fr 0.6fr 1fr auto',gap:8,marginBottom:6,alignItems:'end'}}>
          <div class="fi" style=${{marginBottom:0}}>
            ${i===0?html`<label>Description *</label>`:''}
            ${newBC.type==='pieces'?html`<select value=${l.piece_id||''} onChange=${e=>{const p=(data.pieces||[]).find(x=>x.id===e.target.value);updLigne(l.id,'piece_id',e.target.value);if(p){updLigne(l.id,'description',p.nom);updLigne(l.id,'prix',p.pa);}}}><option value="">Selectionner piece...</option>${(data.pieces||[]).map(p=>html`<option key=${p.id} value=${p.id}>${p.ref} — ${p.nom}</option>`)}</select>`:''}
            <input value=${l.description} onInput=${e=>updLigne(l.id,'description',e.target.value)} placeholder="Description..." style=${{marginTop:newBC.type==='pieces'?4:0}}/>
          </div>
          <div class="fi" style=${{marginBottom:0}}>${i===0?html`<label>Qte</label>`:''}<input type="number" min="1" value=${l.qte} onInput=${e=>updLigne(l.id,'qte',e.target.value)}/></div>
          <div class="fi" style=${{marginBottom:0}}>${i===0?html`<label>Prix unit. HT</label>`:''}<input type="number" step="0.001" value=${l.prix} onInput=${e=>updLigne(l.id,'prix',e.target.value)}/></div>
          <div style=${{paddingTop:i===0?20:0}}>${newBC.lignes.length>1?html`<button class="btn bd bsm" onClick=${()=>delLigne(l.id)}>x</button>`:''}</div>
        </div>`)}
      <button onClick=${addLigne} style=${{width:'100%',padding:7,border:'1.5px dashed rgba(0,44,95,.15)',borderRadius:8,background:'transparent',color:'#1255A0',fontSize:12,cursor:'pointer',marginBottom:10}}>+ Ligne</button>
      <div style=${{display:'flex',justifyContent:'space-between',padding:'8px 0',borderTop:'1px solid rgba(0,44,95,.08)'}}>
        <span style=${{fontSize:13}}>Total HT</span><span style=${{fontSize:15,fontWeight:700,color:'#002C5F'}}>${totalNew.toFixed(3)} DT</span>
      </div>
      <div style=${{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button class="btn bg" onClick=${()=>setShowNew(false)}>Annuler</button>
        <button class="btn bp" onClick=${creerBC}>Soumettre au DG</button>
      </div>
    </div>`}

    <div class="tb">${[['liste','Tous ('+bcs.length+')'],['pending_dg','Attente DG ('+pending.length+')']].map(([id,l])=>html`
      <button key=${id} class=${`tbn${tab===id?' ac':''}`} onClick=${()=>setTab(id)}>${l}</button>`)}</div>

    ${(tab==='liste'?bcs:pending).map(bc=>{
      const cs=ST2[bc.statut]||{c:'#8A99AA',bg:'#F0F2F5',l:bc.statut};
      const total=bc.lignes?.reduce((a,l)=>a+l.qte*l.prix,0)||0;
      const typeInfo=BC_TYPES[bc.type]||{l:'Autre',i:'A'};
      return html`<div key=${bc.id} class="ca" style=${{marginBottom:8,padding:14}}>
        <div style=${{display:'flex',alignItems:'flex-start',gap:10}}>
          <div style=${{flex:1}}>
            <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
              <span style=${{fontSize:11,fontWeight:700,color:'#002C5F',fontFamily:'monospace'}}>${bc.id}</span>
              <span style=${{fontSize:10,padding:'2px 7px',borderRadius:20,background:'#F0F2F5',color:'#4A5568'}}>${typeInfo.i} ${typeInfo.l}</span>
              ${bc.has_ecart&&html`<span class="tag ter" style=${{fontSize:9}}>Ecart recu</span>`}
            </div>
            <div style=${{fontSize:13,fontWeight:700}}>${bc.fournisseur}</div>
            ${bc.motif&&html`<div style=${{fontSize:11,color:'#4A5568',marginTop:2}}>${bc.motif}</div>`}
            <div style=${{fontSize:11,color:'#8A99AA',marginTop:3}}>${new Date(bc.date).toLocaleDateString('fr-FR')} — ${bc.createur||'?'}${bc.num_bl?' — BL: '+bc.num_bl:''}</div>
            <div style=${{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
              ${[{label:'Cree',done:true,by:bc.createur},{label:'Valide DG',done:['valide','recu','valide_compta'].includes(bc.statut),by:bc.valide_par},{label:'Recu SAV',done:['recu','valide_compta'].includes(bc.statut),by:bc.recu_par},{label:'Compta',done:bc.statut==='valide_compta',by:bc.valide_compta_par}].map((step,i)=>html`
                <div key=${i} style=${{fontSize:9,padding:'2px 7px',borderRadius:20,background:step.done?'#E6F4EE':'#F0F2F5',color:step.done?'#0E7A4E':'#8A99AA'}}>
                  ${step.done?'✓':'○'} ${step.label}${step.done&&step.by?' ('+step.by+')':''}
                </div>`)}
            </div>
            ${bc.statut==='recu'&&bc.has_ecart&&html`<div class="al aer" style=${{marginTop:6,fontSize:11}}>Ecart de reception — verifier avant validation comptable</div>`}
            ${bc.statut==='recu'&&!bc.has_ecart&&html`<div style=${{fontSize:11,color:'#0E7A4E',marginTop:4}}>Reception conforme — pret pour validation comptable</div>`}
          </div>
          <div style=${{textAlign:'right',flexShrink:0}}>
            <div style=${{fontSize:16,fontWeight:700,color:'#002C5F'}}>${total.toFixed(3)} DT</div>
            <span class="tag" style=${{background:cs.bg,color:cs.c,marginTop:4,display:'inline-block'}}>${cs.l}</span>
          </div>
        </div>
        ${bc.lignes?.length>0&&html`<div style=${{marginTop:8,paddingTop:8,borderTop:'1px solid rgba(0,44,95,.06)'}}>
          ${bc.lignes.map((l,i)=>html`<div key=${i} style=${{display:'flex',justifyContent:'space-between',fontSize:11,padding:'2px 0',color:'#4A5568'}}>
            <span>${l.description}</span><span>${l.qte} x ${parseFloat(l.prix||0).toFixed(3)} = <strong>${(l.qte*l.prix).toFixed(3)} DT</strong></span>
          </div>`)}
        </div>`}
        <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginTop:10}}>
          ${bc.statut==='pending'&&isDG&&bc.createur_id!==user.id&&html`
            <button class="btn bp bsm" onClick=${()=>valider(bc.id)}>Valider (DG)</button>
            <button class="btn bd bsm" onClick=${()=>refuser(bc.id)}>Refuser</button>`}
          ${bc.statut==='pending'&&isDG&&bc.createur_id===user.id&&html`<span style=${{fontSize:11,color:'#C02020'}}>Vous avez cree ce BC — separation des fonctions</span>`}
          ${bc.statut==='valide'&&(user.role==='reception'||isDG)&&html`<button class="btn bs bsm" onClick=${()=>ouvrirReception(bc)}>Receptionner et verifier →</button>`}
          ${bc.statut==='recu'&&(isCompta||isDG)&&html`<button class="btn bs bsm" onClick=${()=>validerC(bc.id)}>Validation comptable</button>`}
        </div>
      </div>`;
    })}
    ${bcs.length===0&&html`<div class="ca"><div class="em"><p>Aucun bon de commande</p></div></div>`}
  </div>`;
}


function PaiePage({data,setData,user}){
  const[tab,setTab]=useState('dashboard');
  const[sel,setSel]=useState(null);
  const[validated,setValidated]=useState({});
  const[showAddEmp,setShowAddEmp]=useState(false);
  const[showConge,setShowConge]=useState(false);
  const[showAvance,setShowAvance]=useState(false);
  const[newEmp,setNewEmp]=useState({nom:'',poste:'',contrat:'CDI',salaire:'',embauche:new Date().toISOString().split('T')[0],conges_solde:0,fin_cdd:''});
  const[congeForm,setCongeForm]=useState({emp_id:'',debut:'',fin:'',motif:'',type:'annuel'});
  const[avanceForm,setAvanceForm]=useState({emp_id:'',montant:'',motif:'',remboursement:6});

  const cfg=data.config||{};
  const now=new Date();
  const mois=now.toLocaleString('fr-FR',{month:'long',year:'numeric'});
  const employes=data.employes||[];
  const conges=data.conges||[];
  const avances=data.avances||[];
  const pointage=data.pointage||[];

  const totals=employes.reduce((a,e)=>{const p=calcPaie(e.salaire);return{brut:a.brut+p.brut,net:a.net+p.net,cout:a.cout+p.cout_total};},{brut:0,net:0,cout:0});
  const cdd_alert=employes.filter(e=>e.contrat==='CDD'&&e.fin_cdd&&(new Date(e.fin_cdd)-now)/1000/60/60/24<60);

  // Pointage stats today
  const today=now.toISOString().split('T')[0];
  const todayPt=pointage.filter(p=>p.date===today);
  const presents=employes.filter(e=>todayPt.some(p=>p.emp_id===e.id&&p.type==='entree')).length;

  const addEmploye=()=>{
    if(!newEmp.nom||!newEmp.poste||!newEmp.salaire){alert('Nom, poste et salaire requis');return;}
    const mat='EMP-'+Date.now();
    const e={id:Date.now(),mat,...newEmp,salaire:parseFloat(newEmp.salaire),conges_solde:parseInt(newEmp.conges_solde)||0};
    setData(d=>({...d,employes:[...d.employes,e]}));
    setShowAddEmp(false);setNewEmp({nom:'',poste:'',contrat:'CDI',salaire:'',embauche:new Date().toISOString().split('T')[0],conges_solde:0,fin_cdd:''});
    alert('✓ Employé ajouté: '+e.nom);
  };

  const soumettreCongé=()=>{
    if(!congeForm.emp_id||!congeForm.debut||!congeForm.fin){alert('Employé, dates début et fin requis');return;}
    const debut=new Date(congeForm.debut),fin=new Date(congeForm.fin);
    const jours=Math.round((fin-debut)/1000/60/60/24)+1;
    const emp=employes.find(e=>e.id===parseInt(congeForm.emp_id));
    if(congeForm.type==='annuel'&&emp&&jours>emp.conges_solde){alert('Solde congés insuffisant! Solde: '+emp.conges_solde+' jours');return;}
    const c={id:'CG'+Date.now(),...congeForm,emp_id:parseInt(congeForm.emp_id),jours,statut:'pending',demande_le:new Date().toISOString(),emp_nom:emp?.nom};
    setData(d=>({...d,conges:[c,...(d.conges||[])],alertes:[{id:'A'+Date.now(),type:'conge',titre:'Demande congé - '+emp?.nom,msg:congeForm.debut+' au '+congeForm.fin+' ('+jours+' jours)',statut:'pending'},...d.alertes]}));
    setShowConge(false);setCongeForm({emp_id:'',debut:'',fin:'',motif:'',type:'annuel'});
    alert('✓ Demande envoyée au DG');
  };

  const approuverConge=(id,dec)=>{
    const c=conges.find(x=>x.id===id);
    setData(d=>({...d,
      conges:d.conges.map(x=>x.id===id?{...x,statut:dec,traite_par:user.name,traite_le:new Date().toISOString()}:x),
      employes:dec==='approved'&&c?.type==='annuel'?d.employes.map(e=>e.id===c.emp_id?{...e,conges_solde:Math.max(0,e.conges_solde-c.jours)}:e):d.employes,
    }));
  };

  const soumettreAvance=()=>{
    if(!avanceForm.emp_id||!avanceForm.montant){alert('Employé et montant requis');return;}
    const emp=employes.find(e=>e.id===parseInt(avanceForm.emp_id));
    const a={id:'AV'+Date.now(),...avanceForm,emp_id:parseInt(avanceForm.emp_id),montant:parseFloat(avanceForm.montant),statut:'pending',demande_le:new Date().toISOString(),emp_nom:emp?.nom,reste:parseFloat(avanceForm.montant)};
    setData(d=>({...d,avances:[a,...(d.avances||[])],alertes:[{id:'A'+Date.now(),type:'avance',titre:'Demande avance - '+emp?.nom,msg:avanceForm.montant+' DT - '+avanceForm.motif,statut:'pending'},...d.alertes]}));
    setShowAvance(false);setAvanceForm({emp_id:'',montant:'',motif:'',remboursement:6});
    alert('✓ Demande envoyée au DG');
  };

  const approuverAvance=(id,dec)=>setData(d=>({...d,avances:d.avances.map(a=>a.id===id?{...a,statut:dec,traite_par:user.name}:a)}));

  const printBulletin=(emp)=>{

    <div style="background:#F7F9FC;padding:14px;border-radius:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;font-size:11px">
      <div><div class="title">Employé</div><strong>${emp.nom}</strong></div>

    </div>
    <table>
      <thead><tr><th>Rubrique</th><th>Base légale</th><th>Taux</th><th style="color:#7BEFA0">Gain (DT)</th><th style="color:#FFB3B3">Retenue (DT)</th></tr></thead>
      <tbody>
        <tr class="section-row"><td colspan="5">Rémunération</td></tr>
        <tr><td>Salaire de base</td><td>Code du Travail Tunisien</td><td>—</td><td style="color:#0E7A4E;font-weight:700">${p.brut.toFixed(3)}</td><td>—</td></tr>
        <tr class="section-row"><td colspan="5">Cotisations salariales</td></tr>

      </div>

          <tr style=${{background:'rgba(0,44,95,.03)'}}><td colSpan="5" style=${{fontSize:10,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',padding:'6px 12px'}}>RÉMUNÉRATION</td></tr>

function FacturesPage({data,setData,user}){
  if(user.role==='chef'||user.role==='tech'){
    return html`<div class="ca"><div class="em"><div style=${{fontSize:32,marginBottom:12}}>⛔</div><p>Accès non autorisé</p><p style=${{fontSize:11,color:'#8A99AA',marginTop:6}}>Le Chef Atelier et les Techniciens n ont pas accès à la facturation.</p></div></div>`;
  }
  const[sel,setSel]=useState(null);
  const[tab,setTab]=useState('liste');
  const[payMode,setPayMode]=useState('');
  const[chequeInfo,setChequeInfo]=useState({num:'',banque:'',echeance:''});
  const[showAvoir,setShowAvoir]=useState(false);
  const[avoirMotif,setAvoirMotif]=useState('');
  const[filterStatut,setFilterStatut]=useState('all');
  const[filterMonth,setFilterMonth]=useState('');

  const fac=sel?data.factures.find(f=>f.id===sel):null;
  const facOT=fac?data.ots.find(o=>o.id===fac.ot_id):null;
  const facCl=fac?data.clients.find(c=>c.id===fac.client_id):null;
  const cf=useMemo(()=>facOT?calcF(facOT,data.pieces):null,[facOT,data.pieces]);
  const cfg=data.config||{};

  // KPIs
  const factures=data.factures||[];
  const payees=factures.filter(f=>f.statut==='payee');
  const impayees=factures.filter(f=>f.statut==='en_attente');
  const avoirs=factures.filter(f=>f.type==='avoir');
  const caTotal=payees.reduce((a,f)=>a+f.ttc,0);
  const impayeTotal=impayees.reduce((a,f)=>a+f.ttc,0);

  const encaisser=()=>{
    if(!payMode){alert('Sélectionnez le mode de paiement');return;}
    if(payMode==='Chèque'&&!chequeInfo.num){alert('Numéro de chèque requis');return;}
    const infoPay=payMode==='Chèque'?{...chequeInfo}:{};
    setData(d=>({...d,
      factures:d.factures.map(f=>f.id===sel?{...f,statut:'payee',mode_paiement:payMode,infos_paiement:infoPay,paye_le:new Date().toISOString(),encaisse_par:user.name}:f),
      caisse:[{id:'CM'+Date.now(),date:new Date().toISOString(),type:'entree',montant:cf?.ttc||0,lib:'Encaissement '+sel+' - '+facCl?.nom,createur:user.name},...(d.caisse||[])],
      audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'encaissement',module:'Facturation',detail:sel+' - '+(cf?.ttc||0).toFixed(3)+' DT - '+payMode},...(d.audit||[])]
    }));
    alert('✓ Encaissement enregistré - '+(cf?.ttc||0).toFixed(3)+' DT - '+payMode);
    setSel(null);setPayMode('');setChequeInfo({num:'',banque:'',echeance:''});
  };

  const creerAvoir=()=>{
    if(!avoirMotif){alert('Motif de l\'avoir requis');return;}
    const avoirId='AV-'+Date.now();
    const avoir={id:avoirId,type:'avoir',fac_origine:fac.id,client_id:fac.client_id,ot_id:fac.ot_id,
      date:new Date().toISOString().split('T')[0],
      ht:-cf.ht,tva:-cf.tva,ttc:-cf.ttc,

  // LIST VIEW
  const filtered=factures.filter(f=>{

  const months=[...new Set(factures.map(f=>f.date.slice(0,7)))].sort().reverse();

  return html`<div>

// -- CAISSE PAGE -------------------------------------------
function CaissePage({data,setData,user}){
  const[show,setShow]=useState(false);
  const[form,setForm]=useState({type:'entree',montant:'',lib:''});
  const mvts=data.caisse||[];
  const avances=data.avances||[];
  const isDG=can(user,'ALL');
  const isCompta=user.role==='compta';

  // Avances approuvées non encore décaissées
  const avancesApprouvees=avances.filter(a=>a.statut==='approved'&&!a.decaisse);
  const totalAvancesEnAttente=avancesApprouvees.reduce((a,x)=>a+parseFloat(x.montant||0),0);

  const decaisserAvance=(avId)=>{
    const av=avances.find(a=>a.id===avId);
    if(!av)return;
    if(!confirm('Décaisser '+av.montant+' DT pour avance de '+av.emp_nom+' ?'))return;
    setData(d=>({...d,
      avances:d.avances.map(a=>a.id===avId?{...a,decaisse:true,decaisse_le:new Date().toISOString(),decaisse_par:user.name}:a),
      caisse:[{id:'CM'+Date.now(),date:new Date().toISOString(),type:'sortie',montant:parseFloat(av.montant),lib:'Avance salaire - '+av.emp_nom+' - '+av.motif,createur:user.name},...(d.caisse||[])],
      audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,action:'decaissement_avance',module:'Caisse',detail:av.emp_nom+' - '+av.montant+' DT'},...(d.audit||[])]
    }));
    alert('✓ Avance décaissée - '+av.montant+' DT enregistré en sortie caisse');
  };

  const ent=mvts.filter(m=>m.type==='entree').reduce((a,m)=>a+m.montant,0);
  const sor=mvts.filter(m=>m.type==='sortie').reduce((a,m)=>a+m.montant,0);
  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}> 
      <div><h2 style=${{fontSize:18,fontWeight:700}}>Caisse Espèces</h2><p style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>Rapprochement obligatoire chaque soir</p></div>
      ${(isDG||isCompta)&&html`<button class="btn bp" onClick=${()=>setShow(true)}>+ Mouvement</button>`}
    </div>

    <div class="kg k3" style=${{marginBottom:14}}> 
      <div class="kp" style=${{borderTopColor:'#0E7A4E'}}><div class="kl">Total entrées</div><div class="kv" style=${{color:'#0E7A4E'}}>${ent.toFixed(3)} DT</div></div>
      <div class="kp" style=${{borderTopColor:'#C02020'}}><div class="kl">Total sorties</div><div class="kv" style=${{color:'#C02020'}}>${sor.toFixed(3)} DT</div></div>
      <div class="kp" style=${{borderTopColor:'#002C5F'}}><div class="kl">Solde caisse</div><div class="kv" style=${{color:'#002C5F'}}>${(ent-sor).toFixed(3)} DT</div></div>
    </div>

    <!-- Avances approuvées à décaisser - DG et compta seulement -->
    ${(isDG||isCompta)&&avancesApprouvees.length>0&&html`<div class="ca" style=${{marginBottom:14,border:'2px solid #9A5F00'}}>
      <div class="ch" style=${{background:'#FDF3E3'}}><span style=${{fontSize:13,fontWeight:700,color:'#9A5F00'}}>💵 Avances approuvées — À décaisser</span><span style=${{fontSize:11,color:'#9A5F00'}}>${totalAvancesEnAttente.toFixed(3)} DT total</span></div>
      <div style=${{padding:12}}>
        ${avancesApprouvees.map(av=>html`
          <div key=${av.id} style=${{display:'flex',alignItems:'center',gap:12,padding:'8px 0',borderBottom:'1px solid rgba(0,44,95,.05)'}}>
            <div style=${{flex:1}}>
              <div style=${{fontSize:13,fontWeight:700}}>${av.emp_nom}</div>
              <div style=${{fontSize:11,color:'#4A5568'}}>${av.motif||'Avance sur salaire'} — Remboursement: ${(parseFloat(av.montant)/av.remboursement).toFixed(3)} DT × ${av.remboursement} mois</div>
              <div style=${{fontSize:10,color:'#8A99AA',marginTop:1}}>Approuvé par DG — Demandé le ${new Date(av.demande_le).toLocaleDateString('fr-FR')}</div>
            </div>
            <div style=${{textAlign:'right'}}>
              <div style=${{fontSize:16,fontWeight:700,color:'#9A5F00'}}>${parseFloat(av.montant).toFixed(3)} DT</div>
              ${(isDG||isCompta)&&html`<button class="btn bsm" style=${{background:'#9A5F00',color:'#fff',marginTop:4,fontSize:11}} onClick=${()=>decaisserAvance(av.id)}>💵 Décaisser</button>`}
            </div>
          </div>`)}
      </div>
    </div>`}

    ${show&&html`<div class="ca" style=${{marginBottom:12,padding:16,border:'2px solid #00AAD2'}}>
      <div class="g3">
        <div class="fi"><label>Type</label><select value=${form.type} onChange=${e=>setForm({...form,type:e.target.value})}><option value="entree">Encaissement</option><option value="sortie">Décaissement</option></select></div>
        <div class="fi"><label>Montant (DT)</label><input type="number" step="0.001" value=${form.montant} onInput=${e=>setForm({...form,montant:e.target.value})} placeholder="0.000"/></div>
        <div class="fi"><label>Libellé</label><input value=${form.lib} onInput=${e=>setForm({...form,lib:e.target.value})} placeholder="Ex: Paiement FAC-1090"/></div>
      </div>
      <div style=${{display:'flex',gap:8}}>
        <button class="btn bg" onClick=${()=>setShow(false)}>Annuler</button>
        <button class="btn bs" onClick=${()=>{if(!form.montant||!form.lib)return;setData(d=>({...d,caisse:[{id:'CM'+Date.now(),date:new Date().toISOString(),type:form.type,montant:parseFloat(form.montant),lib:form.lib,createur:user.name},...(d.caisse||[])]}));setForm({type:'entree',montant:'',lib:''});setShow(false);}}>+ Enregistrer</button>
      </div>
    </div>`}

    <div class="ca"><div class="tw"><table>
      <thead><tr><th>Date/Heure</th><th>Libellé</th><th>Par</th><th style=${{textAlign:'right',color:'#0E7A4E'}}>Entrée</th><th style=${{textAlign:'right',color:'#C02020'}}>Sortie</th></tr></thead>
      <tbody>${mvts.map((m,i)=>html`<tr key=${i}>

// Règles bonus trimestriel BYD 2025
// ① 36 u./trim atteint → +50% TOUTES commissions
// ② Obj modèle individuel atteint mais pas global → +20% sur ce modèle
// ③ Standard sinon
const BYD_OBJ_GLOBAL_TRIM=36;

const calcBonusFactor=(modId, ventesFactTrim, modeles)=>{
  const totalTrim=ventesFactTrim.length;
  // Rule 1: global 36/trim → +50%
  if(totalTrim>=BYD_OBJ_GLOBAL_TRIM) return 1.5;
  // Rule 2: individual model objective
  const mod=modeles.find(m=>m.id===modId)||(BYD_MODELS_DEFAULT.find(m=>m.id===modId));
  if(mod&&mod.obj_trim>0){
    const ventesModTrim=ventesFactTrim.filter(v=>v.model_id===modId).length;
    if(ventesModTrim>=mod.obj_trim) return 1.2;
  }
  // Rule 3: standard
  return 1.0;
};

function B2BPage({data,setData,user}){
  const[showNew,setShowNew]=useState(false);
  const[form,setForm]=useState({client_id:'',remise_mo:0,remise_p:0,delai:30,notes:''});
  const accords=data.accords||[];
  const clients=data.clients||[];
  const isDG=can(user,'ALL');

  const save=()=>{
    if(!form.client_id){alert('Client requis');return;}
    const existing=accords.find(a=>a.client_id===parseInt(form.client_id)&&a.actif);
    if(existing){alert('Un accord actif existe déjà pour ce client');return;}
    const a={id:'ACC-'+Date.now(),client_id:parseInt(form.client_id),remise_mo:parseFloat(form.remise_mo)||0,remise_p:parseFloat(form.remise_p)||0,delai:parseInt(form.delai)||30,notes:form.notes,actif:true,cree_par:user.name,date:new Date().toISOString().split('T')[0]};
    setData(d=>({...d,accords:[a,...(d.accords||[])],clients:d.clients.map(cl=>cl.id===a.client_id?{...cl,type:'b2b',remise_mo:a.remise_mo,remise_pieces:a.remise_p,delai:a.delai}:cl)}));
    setForm({client_id:'',remise_mo:0,remise_p:0,delai:30,notes:''});setShowNew(false);
    alert('Accord B2B créé — remises appliquées automatiquement');
  };

  const toggleActif=(id)=>{
    setData(d=>({...d,accords:d.accords.map(a=>a.id===id?{...a,actif:!a.actif}:a)}));
  };

  const b2bClients=clients.filter(c=>c.type==='b2b'||accords.some(a=>a.client_id===c.id));
  const b2bTotal=b2bClients.reduce((acc,cl)=>{
    const facs=(data.factures||[]).filter(f=>f.client_id===cl.id&&f.statut==='payee');
    return acc+facs.reduce((a,f)=>a+f.ttc,0);
  },0);

  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div><h2 style=${{fontSize:18,fontWeight:700}}>CRM B2B — Accords commerciaux</h2><p style=${{fontSize:11,color:'#8A99AA',marginTop:2}}>${accords.filter(a=>a.actif).length} accord${accords.filter(a=>a.actif).length!==1?'s':''} actif${accords.filter(a=>a.actif).length!==1?'s':''} — CA B2B total: ${b2bTotal.toFixed(3)} DT</p></div>
      ${isDG&&html`<button class="btn bp bsm" onClick=${()=>setShowNew(!showNew)}>+ Nouvel accord B2B</button>`}
    </div>

    <div class="al ain" style=${{marginBottom:14}}>Quand un client B2B arrive, l'ERP détecte son accord et applique les remises sur l'OT automatiquement.</div>

    ${showNew&&isDG&&html`<div class="ca" style=${{marginBottom:14,padding:16,border:'2px solid #002C5F'}}>
      <div style=${{fontSize:13,fontWeight:700,marginBottom:12}}>Nouvel accord commercial B2B</div>
      <div class="g2">
        <div class="fi"><label>Client B2B *</label>
          <select value=${form.client_id} onChange=${e=>setForm({...form,client_id:e.target.value})}>
            <option value="">Sélectionner...</option>
            ${clients.map(cl=>html`<option key=${cl.id} value=${cl.id}>${cl.nom} (${cl.type==='b2b'?'B2B':'B2C'})</option>`)}
          </select>
        </div>
        <div class="fi"><label>Délai paiement (jours)</label>
          <select value=${form.delai} onChange=${e=>setForm({...form,delai:e.target.value})}>
            ${[0,15,30,45,60,90].map(d=>html`<option key=${d} value=${d}>${d===0?'Comptant':d+' jours'}</option>`)}
          </select>
        </div>
        <div class="fi"><label>Remise Main d'Oeuvre (%)</label><input type="number" min="0" max="50" value=${form.remise_mo} onInput=${e=>setForm({...form,remise_mo:e.target.value})} placeholder="0"/></div>

      const cl=clients.find(x=>x.id===a.client_id);
      const facs=(data.factures||[]).filter(f=>f.client_id===a.client_id&&f.statut==='payee');

      const ots=(data.ots||[]).filter(o=>o.client_id===a.client_id);
      // OTs where remises from this contract were applied

            <div style=${{display:'flex',gap:6,alignItems:'center'}}>
              <span class=${('tag '+(isOk?'tok':'twn'))} style=${{fontSize:10}}>${typeLabel}</span>
              ${!a.actif&&html`<span class="tag ter">Suspendu</span>`}
              ${isDG&&html`<button class="btn bsm" style=${{background:a.actif?'#FDECEC':'#E6F4EE',color:a.actif?'#C02020':'#0E7A4E',border:'none',cursor:'pointer',fontSize:11,padding:'4px 10px',borderRadius:7}} onClick=${()=>toggleActif(a.id)}>${a.actif?'Suspendre':'Réactiver'}</button>`}
            </div>
          </div>

          <!-- Contract terms -->
          <div style=${{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8}}>
            ${[
              ['Remise MO',(a.remise_mo||0)+'%',a.remise_mo>0?'#0E7A4E':'#8A99AA'],
              ['Remise pièces',(a.remise_p||0)+'%',a.remise_p>0?'#0E7A4E':'#8A99AA'],

              ['OTs avec remise',otsAvecRemise.length+'/'+ots.length,'#1255A0'],

              <div style=${{fontSize:9,color:'#8A99AA',marginBottom:2,textTransform:'uppercase',letterSpacing:'.04em'}}>${l}</div>
              <div style=${{fontSize:13,fontWeight:700,color:col}}>${v}</div>
            </div>`)}
          </div>
          ${a.notes&&html`<div style=${{marginTop:8,fontSize:11,color:'#4A5568',padding:'6px 8px',background:'#F7F9FC',borderRadius:6}}>📄 ${a.notes}</div>`}
          ${!isOk&&html`<div class="al awn" style=${{marginTop:8,marginBottom:0,fontSize:11}}>⚠ Accord verbal — Risque légal. Recommandé : contrat écrit ou email de confirmation.</div>`}
        </div>

        <!-- OT history with remises -->
        ${otsAvecRemise.length>0&&html`<div style=${{padding:'10px 16px',borderBottom:'1px solid rgba(0,44,95,.06)'}}>
          <div style=${{fontSize:10,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>OTs avec remises contractuelles appliquées (${otsAvecRemise.length})</div>
          <div class="tw"><table style=${{fontSize:11}}>
            <thead><tr><th>OT</th><th>Date</th><th>Statut</th><th style=${{textAlign:'right'}}>Remise MO</th><th style=${{textAlign:'right'}}>Remise pièces</th><th style=${{textAlign:'right'}}>Économie MO</th></tr></thead>
            <tbody>${otsAvecRemise.slice(0,8).map(o=>{
              const econ=(o.mo_h*o.mo_tarif*(o.remise_mo||0)/100);
              const st=({ouvert:'#8A99AA',en_cours:'#1255A0',termine_tech:'#9A5F00',valide_ca:'#0E7A4E',facture:'#5B4FC9'})[o.statut]||'#8A99AA';
              return html`<tr key=${o.id}>

                <td style=${{textAlign:'right',fontWeight:700,color:'#0E7A4E'}}>${o.remise_mo||0}%</td>
                <td style=${{textAlign:'right',fontWeight:700,color:'#0E7A4E'}}>${o.remise_pieces||0}%</td>
                <td style=${{textAlign:'right',fontWeight:700,color:'#C02020'}}>-${econ.toFixed(3)} DT</td>
              </tr>`;
            })}
            ${otsAvecRemise.length>8&&html`<tr><td colSpan="6" style=${{color:'#8A99AA',textAlign:'center',padding:'6px'}}>… et ${otsAvecRemise.length-8} autre(s)</td></tr>`}
            </tbody>
          </table></div>
        </div>`}
        ${otsAvecRemise.length===0&&ots.length>0&&html`<div style=${{padding:'10px 16px',fontSize:11,color:'#8A99AA'}}>
          ${ots.length} OT${ots.length>1?'s':''} enregistré${ots.length>1?'s':''} — aucune remise contractuelle appliquée encore.
        </div>`}
        ${ots.length===0&&html`<div style=${{padding:'10px 16px',fontSize:11,color:'#8A99AA'}}>
          Aucun OT pour ce client — les remises seront appliquées dès le premier OR.
        </div>`}

        <!-- CA summary -->
        <div style=${{padding:'10px 16px',background:'#F7F9FC',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style=${{fontSize:11,color:'#8A99AA'}}>${facs.length} facture${facs.length!==1?'s':''} payée${facs.length!==1?'s':''}</span>
          <span style=${{fontSize:13,fontWeight:700,color:'#002C5F'}}>CA total: ${caTotal.toFixed(3)} DT TTC</span>
        </div>
      </div>`;
    })}
  </div>`;
}
function AlertesPage({data,setData,user}){
  const pending=data.alertes.filter(a=>a.statut==='pending');
  const info=data.alertes.filter(a=>a.statut==='info');
  const done=data.alertes.filter(a=>a.statut!=='pending'&&a.statut!=='info');

  const resolve=(id,dec)=>setData(d=>{
    const alerte=d.alertes.find(a=>a.id===id);
    let ots=d.ots;
    let devis=d.devis||[];
    // OT remise approval
    if(dec==='approved'&&alerte?.type==='remise'&&alerte?.ot_id&&alerte?.remise_pct){
      ots=d.ots.map(o=>o.id===alerte.ot_id?{...o,remise_mo:alerte.remise_pct}:o);
    }
    // Devis remise approval — apply to all matching devis lignes for this client
    if(dec==='approved'&&alerte?.type==='remise_devis'){
      devis=devis.map(dv=>{
        if(String(dv.client_id)===String(alerte.temp_client_id)&&dv.statut==='en_attente'){
          const newLignes=dv.lignes.map(l=>({...l,remise:l.type==='mo'?(alerte.remise_pct_mo||0):(alerte.remise_pct_p||0)}));
          const ht=+newLignes.reduce((a,l)=>a+(l.qte*l.pu*(1-(l.remise||0)/100)),0).toFixed(3);
          const tva=+(ht*0.19).toFixed(3);
          return{...dv,lignes:newLignes,remise_dg_mo:alerte.remise_pct_mo||0,remise_dg_p:alerte.remise_pct_p||0,ht,tva,ttc:+(ht+tva+0.6).toFixed(3)};
        }
        return dv;
      });
    }
    return{...d,
      ots,devis,
      alertes:d.alertes.map(a=>a.id===id?{...a,statut:dec,resolved_by:user.name,resolved_le:new Date().toISOString()}:a),
      audit:[{id:'A'+Date.now(),ts:new Date().toISOString(),user:user.name,role:user.role,
        action:dec==='approved'?'approbation_remise_dg':'refus_remise_dg',module:'Alertes',
        detail:(alerte?.titre||id)+' — '+(dec==='approved'?'APPROUVÉ':'REFUSÉ')+' par '+user.name},...(d.audit||[])],
    };
  });

  const renderPendingCard=(a)=>{
    // Rich card for devis remise request
    if(a.type==='remise_devis')return html`<div key=${a.id} class="ca" style=${{marginBottom:10,border:'2px solid rgba(154,95,0,.25)',overflow:'hidden'}}>
      <div style=${{padding:'12px 16px',background:'rgba(253,243,227,.5)',borderBottom:'1px solid rgba(154,95,0,.15)',display:'flex',alignItems:'center',gap:10}}>
        <div style=${{width:34,height:34,borderRadius:9,background:'#9A5F00',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>🔒</div>
        <div style=${{flex:1}}>
          <div style=${{fontSize:13,fontWeight:700,color:'#0D1829'}}>${a.titre}</div>
          <div style=${{fontSize:11,color:'#9A5F00',marginTop:1}}>Demande de remise exceptionnelle sur devis — approbation DG requise</div>
        </div>
        <span class="tag twn" style=${{flexShrink:0}}>⏳ En attente</span>
      </div>
      <div style=${{padding:'12px 16px'}}>
        <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:10}}>
          <div style=${{background:'#fff',border:'1px solid rgba(0,44,95,.08)',borderRadius:8,padding:'8px 10px'}}>
            <div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',marginBottom:2}}>Client</div>
            <div style=${{fontSize:13,fontWeight:700,color:'#0D1829'}}>${a.client_nom}</div>
          </div>
          <div style=${{background:'#fff',border:'1px solid rgba(0,44,95,.08)',borderRadius:8,padding:'8px 10px'}}>
            <div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',marginBottom:2}}>Remise demandée</div>
            <div style=${{fontSize:13,fontWeight:700,color:'#9A5F00'}}>${a.remise_pct_mo||0}% MO · ${a.remise_pct_p||0}% pièces</div>
          </div>
          <div style=${{background:'#fff',border:'1px solid rgba(0,44,95,.08)',borderRadius:8,padding:'8px 10px'}}>
            <div style=${{fontSize:9,color:'#8A99AA',textTransform:'uppercase',marginBottom:2}}>Demandée par</div>
            <div style=${{fontSize:13,fontWeight:700,color:'#0D1829'}}>${a.demande_par}</div>
            <div style=${{fontSize:10,color:'#8A99AA'}}>${new Date(a.demande_le).toLocaleDateString('fr-FR')}</div>
          </div>
        </div>
        ${a.motif&&html`<div style=${{fontSize:11,color:'#4A5568',marginBottom:10,padding:'7px 10px',background:'#F7F9FC',borderRadius:7,borderLeft:'3px solid #9A5F00'}}>Motif : ${a.motif}</div>`}
        ${can(user,'ALL')&&html`<div style=${{display:'flex',gap:8}}>
          <button class="btn bs" style=${{flex:1}} onClick=${()=>{if(confirm('Approuver la remise '+a.remise_pct_mo+'% MO / '+a.remise_pct_p+'% pièces pour '+a.client_nom+' ?'))resolve(a.id,'approved');}}>✓ Approuver — appliquer les remises</button>
          <button class="btn bd" onClick=${()=>{if(confirm('Refuser cette demande de remise ?'))resolve(a.id,'rejected');}}>✗ Refuser</button>
        </div>`}
      </div>
    </div>`;
    // Standard OT remise card
    if(a.type==='remise')return html`<div key=${a.id} class="ca" style=${{marginBottom:8,border:'1.5px solid rgba(154,95,0,.2)',overflow:'hidden'}}>
      <div style=${{padding:'12px 16px',background:'rgba(253,243,227,.4)',borderBottom:'1px solid rgba(154,95,0,.1)',display:'flex',alignItems:'center',gap:10}}>
        <div style=${{width:34,height:34,borderRadius:9,background:'#9A5F00',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>%</div>
        <div style=${{flex:1}}>
          <div style=${{fontSize:13,fontWeight:700}}>${a.titre}</div>
          <div style=${{fontSize:11,color:'#8A99AA',marginTop:1}}>${a.msg}</div>
        </div>
        <span class="tag twn">⏳ OT</span>
      </div>
      ${can(user,'ALL')&&html`<div style=${{padding:'10px 16px',display:'flex',gap:6,justifyContent:'flex-end'}}>
        <button class="btn bs bsm" onClick=${()=>resolve(a.id,'approved')}>✓ Approuver ${a.remise_pct||''}%</button>
        <button class="btn bd bsm" onClick=${()=>resolve(a.id,'rejected')}>Refuser</button>
      </div>`}
    </div>`;
    // Generic card
    return html`<div key=${a.id} class="ca" style=${{marginBottom:8,padding:'14px 16px',display:'flex',gap:12,alignItems:'flex-start'}}>
      <div class="dot" style=${{background:'#C02020',marginTop:5}}/>
      <div style=${{flex:1}}><div style=${{fontSize:13,fontWeight:700}}>${a.titre}</div><div style=${{fontSize:12,color:'#8A99AA',marginTop:2}}>${a.msg}</div></div>
      ${can(user,'ALL')&&a.type!=='stock'&&html`<div style=${{display:'flex',gap:6,flexShrink:0}}><button class="btn bs bsm" onClick=${()=>resolve(a.id,'approved')}>✓ Approuver</button><button class="btn bd bsm" onClick=${()=>resolve(a.id,'rejected')}>Refuser</button></div>`}
    </div>`;
  };

  return html`<div>
    <h2 style=${{fontSize:18,fontWeight:700,marginBottom:4}}>Validations & Alertes</h2>
    <p style=${{fontSize:11,color:'#8A99AA',marginBottom:14}}>${pending.length} action${pending.length!==1?'s':''} requise${pending.length!==1?'s':''}</p>
    ${pending.length===0&&html`<div class="al aok" style=${{textAlign:'center',padding:24,fontSize:14,fontWeight:700}}>✓ Aucune validation en attente !</div>`}
    ${pending.map(a=>renderPendingCard(a))}
    ${info.length>0&&html`<div>${info.map(a=>html`<div key=${a.id} style=${{display:'flex',gap:10,padding:'9px 14px',background:'#fff',border:'1px solid rgba(0,44,95,.06)',borderRadius:10,marginBottom:5}}><span>ℹ️</span><div><div style=${{fontSize:12,fontWeight:700}}>${a.titre}</div><div style=${{fontSize:11,color:'#8A99AA'}}>${a.msg}</div></div></div>`)}</div>`}
    ${done.length>0&&html`<div style=${{marginTop:14}}>
      <div style=${{fontSize:11,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',marginBottom:6}}>Historique récent</div>
      ${done.slice(0,8).map(a=>{
        const resolvedTxt=a.resolved_by?' — '+(a.statut==='approved'?'approuvé':'refusé')+' par '+a.resolved_by:'';
        const tagCls='tag '+(a.statut==='approved'?'tok':'ter');
        const tagTxt=a.statut==='approved'?'✓ Approuvé':'✗ Refusé';
        return html`<div key=${a.id} style=${{display:'flex',gap:10,padding:'9px 14px',background:'rgba(255,255,255,.6)',border:'1px solid rgba(0,44,95,.05)',borderRadius:10,marginBottom:5,opacity:.7}}>
          <div style=${{flex:1,fontSize:12}}><span style=${{fontWeight:700}}>${a.titre}</span><span style=${{color:'#8A99AA'}}>${resolvedTxt}</span></div>
          <span class=${tagCls}>${tagTxt}</span>
        </div>`;
      })}
    </div>`}
  </div>`;
}

          </select>
        </div>
        <div class="fi" style=${{gridColumn:'1/-1'}}><label>Adresse</label><input value=${form.adresse} onInput=${sf('adresse')} placeholder="Rue, Ville..."/></div>

}
function PlanningPage({data,setData,user}){

  const ots=data.ots||[];

    setData(d=>({...d,ots:d.ots.map(o=>o.id===otId?{...o,bay}:o)}));

        <div style=${{display:'flex',gap:6,flexWrap:'wrap'}}>
          ${Object.entries({ouvert:'Ouvert',en_cours:'En cours',termine_tech:'À valider',valide_ca:'Validé'}).map(([k,l])=>html`
            <span key=${k} style=${{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#4A5568'}}>
              <span style=${{width:10,height:10,borderRadius:2,background:ST_COLORS[k],display:'inline-block'}}></span>${l}
            </span>`)}
        </div>
      </div>
    </div>

        {l:'Bays occupés',v:BAYS.filter(b=>otsByBay[b]?.length>0).length+'/'+BAYS.length,c:'#002C5F'},
        {l:'OTs actifs',v:ots.filter(o=>o.statut==='en_cours'||o.statut==='ouvert').length,c:'#00AAD2'},
        {l:'À valider CA',v:ots.filter(o=>o.statut==='termine_tech').length,c:'#9A5F00'},
        {l:'Non assignés',v:ots.filter(o=>!o.bay&&o.statut!=='facture'&&o.statut!=='valide_ca').length,c:'#C02020'},
      ].map(k=>html`<div key=${k.l} class="kp" style=${{borderTopColor:k.c}}><div class="kl">${k.l}</div><div class="kv" style=${{color:k.c,fontSize:18}}>${k.v}</div></div>`)}
    </div>

    <!-- Timeline Grid -->
    <div class="ca" style=${{overflow:'hidden',marginBottom:14}}>
      <div style=${{overflowX:'auto'}}>
        <div style=${{minWidth:CELL_W*HOURS.length+120+'px'}}>

          <!-- Header: hours -->
          <div style=${{display:'flex',borderBottom:'2px solid rgba(0,44,95,.1)',background:'#F7F9FC',position:'sticky',top:0,zIndex:10}}>
            <div style=${{width:120,flexShrink:0,padding:'8px 10px',fontSize:10,fontWeight:700,color:'#8A99AA',textTransform:'uppercase',letterSpacing:'.06em',borderRight:'1px solid rgba(0,44,95,.07)'}}>Bay</div>

            </div>`)}

          <!-- Bay rows -->
          ${BAYS.map(bay=>{
            const bayOTs=otsByBay[bay]||[];

              <div style=${{width:120,flexShrink:0,padding:'10px 12px',borderRight:'1px solid rgba(0,44,95,.07)',display:'flex',flexDirection:'column',justifyContent:'center',background:'#F7F9FC'}}>
                <div style=${{width:34,height:34,borderRadius:9,background:bayOTs.length>0?'#002C5F':'#E5E7EA',color:bayOTs.length>0?'#fff':'#8A99AA',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,marginBottom:3}}>B${bay}</div>

                  return html`<div key=${ot.id}
                    title=${ot.id+' — '+vh?.modele+' ('+cl?.nom+')'}
                    style=${{
                      position:'absolute',
                      left:offsetH*CELL_W+'px',
                      top:6,
                      width:Math.min(dur*CELL_W-4,HOURS.length*CELL_W-offsetH*CELL_W-4)+'px',
                      height:BAY_H-12+'px',

                      padding:'5px 8px',
                      overflow:'hidden',
                      cursor:'pointer',
                      zIndex:2,

                })}

            </div>`;
          })}
        </div>
      </div>
    </div>

    <!-- OTs sans bay -->
    ${ots.filter(o=>!o.bay&&o.statut!=='facture'&&(o.statut==='ouvert'||o.statut==='en_cours')).length>0&&html`

            <span class="tag tin" style=${{fontSize:10}}>${ot.id}</span>

                onClick=${()=>assignBay(ot.id,b)}>B${b}</button>`)}
            </div>
          </div>`;
        })}
      </div>
    </div>`}

    <!-- Bay cards summary -->
    <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
      ${BAYS.map(bay=>{
        const ot=data.ots.find(o=>o.bay===bay&&(o.statut==='en_cours'||o.statut==='ouvert'||o.statut==='termine_tech'));

          <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <div style=${{width:32,height:32,borderRadius:8,background:ot?c:'#F0F2F5',color:ot?'#fff':'#8A99AA',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,flexShrink:0}}>B${bay}</div>

        </div>`;
      })}
    </div>
  </div>`;
}
